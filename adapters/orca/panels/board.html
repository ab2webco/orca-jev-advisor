            approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
          })))
        } else {
          parts.push(line(t('approvals.noSuggestionOverlap', {
            highest: String(ceiling.highestApproved), lowest: String(ceiling.lowestRejected),
            approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
          })))
        }
        el('approvals-body').innerHTML = parts.join('')
      }

      function renderSpeed (ab) {
        var samples = (ab && ab.sampleCount) || 0
        if (samples <= 0) { fill('speed-body', 'speed-empty', '', t('speed.empty')); return }

        // The model is named, never called "the big model": the id comes
        // straight off the comparison rows. More than one id in the window
        // is possible (a config change mid-run), so they are all shown.
        var modelIds = (ab.modelIds || [])
        var modelName = modelIds.length > 0 ? modelIds.join(' / ') : t('stats.na')

        var chart = compareBars([
          { name: t('speed.jev'), valueMs: ab.jevLatency && ab.jevLatency.medianMs, cls: 'v1' },
          { name: modelName, valueMs: ab.bigModelLatency && ab.bigModelLatency.medianMs, cls: 'v3' }
        ])

        var parts = [chart, line(t('speed.samples', { n: String(samples) }))]
        if (typeof ab.agreementCount === 'number') {
          parts.push(line(t('speed.agreement', { agree: String(ab.agreementCount), n: String(samples) })))
        }
        var disagreements = ab.disagreements || []
        if (disagreements.length > 0) {
          parts.push('<p class="cmp-foot">' + esc(t('speed.disagreementsHeading')) + ' ' +
            disagreements.map(function (d) {
              return esc(t('speed.disagreement', {
                count: num(d.count), jev: verdictWord(d.jevVerdict), model: verdictWord(d.bigModelVerdict)
              }))
            }).join(' · ') + '</p>')
        }
        if ((ab.failureCount || 0) > 0) {
          parts.push(line(t('speed.failures', { n: String(ab.failureCount) })))
        }

        var jevTokens = ab.jevTokens || {}
        var bigTokens = ab.bigModelTokens || {}
        if (typeof jevTokens.inputTotal === 'number' && typeof bigTokens.outputTotal === 'number') {
          var loadedContext = (bigTokens.cacheCreationInputTotal || 0) + (bigTokens.cacheReadInputTotal || 0)
          parts.push('<div class="divider" style="margin-top:10px;padding-top:8px">' +
            '<h2>' + esc(t('speed.tokensHeading')) + '</h2>' +
            hbars([
              { label: t('speed.tokensRowJev'), value: (jevTokens.inputTotal || 0) + (jevTokens.outputTotal || 0) },
              { label: t('speed.tokensRowAnswer'), value: (bigTokens.inputTotal || 0) + (bigTokens.outputTotal || 0) },
              { label: t('speed.tokensRowContext'), value: loadedContext }
            ], 'v1') +
            line(t('speed.tokensJev', { in: num(jevTokens.inputTotal || 0), out: num(jevTokens.outputTotal || 0) })) +
            line(t('speed.tokensBig', {
              model: modelName, in: num(bigTokens.inputTotal || 0),
              out: num(bigTokens.outputTotal || 0), cache: num(loadedContext)
            })) +
            line(t('speed.tokensNote')) + '</div>')
        }
        fill('speed-body', 'speed-empty', parts.join(''), '')
      }

      /** rows: [{ label, value }] as labelled numbers, for figures that
       *  share no unit and so must not be drawn on one bar scale. The
       *  number is printed before its label (`column-reverse` keeps the
       *  `<dt>` first for assistive technology). */
      function figures (rows) {
        return '<dl class="figures">' + rows.map(function (r) {
          return '<div class="figure"><dt>' + esc(r.label) + '</dt><dd>' + esc(num(r.value)) + '</dd></div>'
        }).join('') + '</dl>'
      }

      function renderSkills (mod) {
        if (!((mod.totalDecisions || 0) > 0)) { fill('skills-body', null, '', t('stats.skillsEmpty')); return }
        var w = windowOf(mod)
        if (w && w.available === false) { fill('skills-body', null, '', t('window.unavailableCard')); return }
        // A summary from before the windows (an older worker) has only the all-time figures.
        var figuresOf = w || mod
        var rows = [{ label: t('stats.skillSuggestions'), value: figuresOf.suggestedCount || 0 }]
        if (figuresOf.listingCharsTotal != null) {
          rows.push({ label: t('stats.listingChars'), value: figuresOf.listingCharsTotal })
        }
        var parts = [figures(rows)]
        // #11: a rate on a handful of samples is noise, so below the
        // readiness threshold the line gives the counts, never a percentage.
        var minComparable = mod.readiness && mod.readiness.thresholds && mod.readiness.thresholds.minComparable
        var comparable = figuresOf.comparableCount || 0
        if (figuresOf.matchRate == null) parts.push(line(t('stats.skillMatchRate') + ': ' + t('stats.na')))
        else if (typeof minComparable === 'number' && comparable < minComparable) {
          parts.push(line(t('stats.skillMatchFew', { matched: num(figuresOf.matchedCount || 0), n: num(comparable), min: num(minComparable) })))
        } else parts.push(line(t('stats.skillMatchEnough', { percent: num(pct(figuresOf.matchRate)), n: num(comparable) })))
        fill('skills-body', null, parts.join(''), '')
      }

      /** K0 (odd/tasks/typing-lead-time.md): the pause between the last
       *  keystroke and sending, in the window, from the worker's
       *  consumptionSummary.typing (read-consumption.mjs). No summary (no
       *  file yet, no prompt in the window, an {ok:false} read, or none
       *  published) is no line at all, never a zero; with only injected
       *  prompts there is no pause to show. */
      function renderSkillsTyping (summary) {
        var typing = summary && summary.ok === true ? windowOf(summary.typing) : null
        if (!typing || typeof typing.typed !== 'number' || typeof typing.injected !== 'number' || typing.typed + typing.injected <= 0) { el('skills-typing').innerHTML = ''; return }
        var seconds = function (value) { return num(Math.round(value / 100) / 10) }
        el('skills-typing').innerHTML = typing.typed > 0 && typeof typing.p50Ms === 'number' && typeof typing.p90Ms === 'number'
          ? line(t('skills.typing', { p50: seconds(typing.p50Ms), p90: seconds(typing.p90Ms), typed: num(typing.typed), injected: num(typing.injected) }))
          : line(t('skills.typingNoneTyped', { injected: num(typing.injected) }))
      }

      // ---------- render: modules (odd/tasks/board-global-window.md W3) -----
      // measurementsSummary.modules (read-measurements.mjs moduleWindows):
      // per module, one entry per window with the figures its card shows.
      // The state is the integration status's (claudeIntegrationStatus
      // .modules[id].state, what the config panel's switch shows): off,
      // shadow or active.
      var lastIntegrationStatus = null
      function moduleStateLine (id) {
        var modules = lastIntegrationStatus && lastIntegrationStatus.modules
        var state = modules && modules[id] && modules[id].state
        if (state !== 'off' && state !== 'shadow' && state !== 'active') return ''
        return '<p class="mod-state">' + esc(t('modules.state', { state: t('modules.state.' + state) })) + '</p>'
      }
      function moduleWindow (name) {
        var ok = !!(lastStats && lastStats.ok)
        var part = ok && lastStats.modules ? lastStats.modules[name] : null
        return { part: part, w: windowOf(part) }
      }
      /** One module card: its state, then its window's figures, or one line
       *  saying why there are none (no summary yet, the version window
       *  unavailable, or nothing in this window). `figuresOf(w)` returns the
       *  `figures()` rows and the lines under them; `count(w)` is whether
       *  anything happened at all. */
      function renderModuleCard (bodyId, labelId, id, name, count, figuresOf, before) {
        var found = moduleWindow(name)
        setWindowLabel(labelId, windowLabel(found.w))
        var parts = [moduleStateLine(id)]
        if (before) parts.push(before(found.part))
        if (!found.part) parts.push(line(t('modules.notYet'), 'empty-line'))
        else if (!found.w || found.w.available === false) parts.push(line(t('window.unavailableCard'), 'empty-line'))
        else if (count(found.w) <= 0) parts.push(line(t('modules.quiet'), 'empty-line'))
        else parts.push(figuresOf(found.w))
        el(bodyId).innerHTML = parts.join('')
      }
      function memoryWhere (part) {
        var latest = part && part.latest
        var key = !latest ? 'unknown' : latest.permission === 'refused' ? 'refused' : ['live', 'down', 'absent'].indexOf(latest.backend) !== -1 ? latest.backend : 'unknown'
        return line(t('modules.memory.where', { where: t('modules.memory.where.' + key) }), 'kpi-sub')
      }
      function renderModules () {
        var memoryState = lastIntegrationStatus && lastIntegrationStatus.modules && lastIntegrationStatus.modules.memory && lastIntegrationStatus.modules.memory.state
        renderModuleCard('memory-body', 'win-memory', 'memory', 'memory', function (w) { return w.decisions || 0 }, function (w) {
          var parts = [figures([
            { label: t('modules.memory.decisions'), value: w.decisions || 0 },
            { label: t('modules.memory.engramSaved'), value: w.engramSaved || 0 },
            { label: t('modules.memory.written'), value: w.written || 0 },
            { label: t('modules.memory.mainEngramSaves'), value: w.mainEngramSaves || 0 },
            { label: t('modules.memory.judgePending'), value: w.judgePending || 0 }
          ])]
          if (typeof w.agreementRate === 'number') parts.push(line(t('modules.memory.agreement', { percent: String(Math.round(w.agreementRate * 100)) })))
          if ((w.engramFailed || 0) > 0) parts.push(line(t('modules.memory.engramFailed', { n: num(w.engramFailed) })))
          if (memoryState === 'shadow') parts.push(line(t('modules.memory.shadowNote'), 'empty-line'))
          return parts.join('')
        }, memoryWhere)
        renderModuleCard('ciwatch-body', 'win-ciwatch', 'ci-watch', 'ciWatch', function (w) { return w.watches || 0 }, function (w) {
          return figures([
            { label: t('modules.ciWatch.watches'), value: w.watches || 0 },
            { label: t('modules.ciWatch.ghCalls'), value: w.ghCalls || 0 },
            { label: t('modules.ciWatch.pollsReplaced'), value: w.pollsReplaced || 0 }
          ]) + line(t('modules.ciWatch.outcomes', { finished: num(w.finished || 0), failed: num(w.failed || 0) }))
        })
        renderModuleCard('verifydone-body', 'win-verifydone', 'verify-done', 'verifyDone', function (w) { return w.decisions || 0 }, function (w) {
          return figures([
            { label: t('modules.verifyDone.decisions'), value: w.decisions || 0 },
            { label: t('modules.verifyDone.claims'), value: w.claims || 0 },
            { label: t('modules.verifyDone.wouldBlock'), value: w.wouldBlock || 0 }
          ]) + ((w.jevFailed || 0) > 0 ? line(t('modules.verifyDone.jevFailed', { n: num(w.jevFailed) })) : '') +
            line(t('modules.verifyDone.note'), 'empty-line')
        })
      }

      // ---------- render: consumption (JEV-060 slice 1, T5) -----------------
      // Three honest states, never two -- same convention config.html's own
      // modelsRenderMeasurements already uses for modelMeasurements: no
      // summary yet (or a genuine ok:true empty payload) reads as "no data
      // yet"; ok:false reads as its own distinct failure sentence; only a
      // real ok:true payload with real numbers ever renders the populated
      // card. Every number below comes straight from consumptionSummary
      // (main.mjs's publishConsumptionSummary / read-consumption.mjs), never
      // invented -- a null field renders as consumption.na, never a
      // fabricated zero.

      /** A percentage row using the same .hrow/.htrack/.hfill markup as
       *  hbars() above, but for a value that IS already the percentage to
       *  show (0-100 or null) -- hbars itself scales against the largest row
       *  in its own list, which is the wrong shape for an independent share
       *  or quota percentage. */
      function barRow (label, percent, cls) {
        var rounded = (percent === null || percent === undefined || !isFinite(percent)) ? null : Math.round(percent * 10) / 10
        var widthPercent = rounded === null ? 0 : Math.min(100, Math.max(0, rounded))
        var valueText = rounded === null ? t('consumption.na') : percentText(percent)
        return '<div class="hrow v1">' +
          '<span class="hl" title="' + esc(label) + '">' + esc(label) + '</span>' +
          '<span class="htrack"><span class="hfill ' + (cls || 'v1') + '" style="width:' + widthPercent + '%"></span></span>' +
          '<span class="hv">' + esc(valueText) + '</span></div>'
      }

      /** `resetsAt` is epoch milliseconds (verified by hand against a real
       *  `orca account list --json` fixture in main.test.mjs -- 13-digit
       *  values in the current era), never an ISO string or epoch seconds --
       *  `new Date(ms)` is the correct read. `null`/unparseable renders as
       *  consumption.na via the caller, never a raw epoch number. */
      function formatResetsAt (resetsAtMs) {
        if (typeof resetsAtMs !== 'number' || !isFinite(resetsAtMs)) return null
        var date = new Date(resetsAtMs)
        if (isNaN(date.getTime())) return null
        try {
          return date.toLocaleString(currentLocale === 'es' ? 'es-ES' : 'en-US',
            { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
        } catch (error) {
          return date.toISOString()
        }
      }

      /** The person's model catalog (storage key `models`, the rows the
       *  config panel edits), read on every reload: id -> label, shortened
       *  for this card's compact rows -- the catalog's own `label` carries a
       *  redundant "Claude " prefix ("Claude Sonnet 5.5") that this card
       *  drops. */
      var MODELS_KEY = 'models'
      var modelLabels = {}

      function modelLabelsFromCatalog (catalog) {
        var labels = {}
        if (!Array.isArray(catalog)) return labels
        catalog.forEach(function (row) {
          if (!row || typeof row !== 'object' || typeof row.id !== 'string' || typeof row.label !== 'string') return
          var label = row.label.replace(/^Claude\s+/, '').trim()
          if (label) labels[row.id] = label
        })
        return labels
      }

      /** The catalog label for a model id (a `[1m]` context suffix names the
       *  same model), or the id itself when the catalog does not know it --
       *  the raw id is never lost, it also stays in the caller's `title`. */
      function friendlyModelName (id) {
        var base = String(id).split('[')[0]
        if (Object.prototype.hasOwnProperty.call(modelLabels, id)) return modelLabels[id]
        if (Object.prototype.hasOwnProperty.call(modelLabels, base)) return modelLabels[base]
        return id
      }

      /** One model's input/cache-read/cache-write/output shares -- each a
       *  0..1 fraction of that model's OWN total tokens (src/core/
       *  consumption.ts's own doc on ModelUsageShare), never a share of the
       *  window's whole traffic. All four together account for the model's
       *  own total, so the four rendered bars sum to ~100% -- rendering
       *  fewer than four is exactly what let a Sonnet row read as 74+10+5=89
       *  before `inputShare` existed. `pct()` both converts to a percent and
       *  rounds. The visible name is friendly (friendlyModelName); the raw
       *  id a person would need to cross-reference elsewhere lives in the
       *  same element's `title`, never dropped. */
      function consumptionModelBlock (modelShare) {
        var tokens = typeof modelShare.tokens === 'number' ? ' · ' + t('consumption.modelTokens', { n: num(modelShare.tokens) }) : ''
        return '<p class="kpi-sub"><b title="' + esc(modelShare.model) + '">' + esc(friendlyModelName(modelShare.model)) + '</b> · ' +
          esc(t('consumption.steps', { n: num(modelShare.stepCount) }) + tokens) + '</p>' +
          '<div class="hrows">' +
            barRow(t('consumption.input'), percentOf(modelShare.inputShare), 'v1') +
            barRow(t('consumption.cacheRead'), percentOf(modelShare.cacheReadShare), 'v2') +
            barRow(t('consumption.cacheWrite'), percentOf(modelShare.cacheWriteShare), 'v3') +
            barRow(t('consumption.output'), percentOf(modelShare.outputShare), 'v1') +
          '</div>'
      }

      /** The label a quota row shows in place of the raw account id: the
       *  account's `email` as `orca account list --json` reports it, joined
       *  on by the worker (main.mjs's withAccountEmails,
       *  odd/tasks/board-tabs-and-names.md T1) -- for a custom-endpoint
       *  account that field is Orca's own endpoint label, shown as-is.
       *  Without one: "This computer" for `home` (kept in case a future quota
       *  source ever reports it -- today's CLI never does), else "Account "
       *  plus the id's first 8 characters, same truncation
       *  `accountConfigTarget` (src/core/orca_accounts.ts) uses for its own
       *  `label`. The raw id is never lost -- it moves to the element's
       *  `title`. */
      function accountShortLabel (account) {
        if (typeof account.email === 'string' && account.email.length > 0) return account.email
        return account.id === 'home' ? t('consumption.accountHome') : t('consumption.accountLabel', { id: String(account.id).slice(0, 8) })
      }

      /** One quota account's session/weekly usage bars and its weekly reset
       *  time. `sessionUsedPercent`/`weeklyUsedPercent` are already 0-100
       *  percentages on the wire (main.mjs's accountQuotaEntry mirrors
       *  `orca account list --json`'s own usedPercent fields verbatim), unlike
       *  the 0..1 fractions above -- passed to barRow directly, never through
       *  pct(). */
      function consumptionQuotaBlock (account) {
        var label = accountShortLabel(account)
        var heading = account.status ? (label + ' · ' + account.status) : label
        var resetText = formatResetsAt(account.resetsAt)
        return '<p class="kpi-sub"><b title="' + esc(account.id) + '">' + esc(heading) + '</b></p>' +
          '<div class="hrows">' +
            barRow(t('consumption.session'), account.sessionUsedPercent, 'v1') +
            barRow(t('consumption.weekly'), account.weeklyUsedPercent, 'v3') +
          '</div>' +
          line(t('consumption.resetsAt', { when: resetText || t('consumption.na') })) +
          (typeof account.error === 'string' && account.error.length > 0 ? line(t('consumption.quotaError', { reason: account.error })) : '')
      }

      /**
       * The plain-language recommendations, gated key-by-key: a trigger's
       * key is present in `recommendations` only when the worker actually
       * had real data for it (mcpServerCount is the one exception -- see
       * src/core/consumption.ts's own doc, 0 is honest data there). A
       * present trigger with `overThreshold: false` still gets a quiet
       * confirming line (for longSession/subagentShare -- reassurance that
       * real data was checked and it is fine) rather than nothing; the
       * MCP server count is purely informational and never takes the
       * `.stale` warning tone, since the brief specifies no threshold for
       * it.
       */
      function consumptionRecommendationLines (recommendations) {
        // W4 #10: advice is not an alarm -- what asks for an action reads in
        // the normal text colour; the checks that came back fine fold into
        // one quiet line, never a column of reassurances.
        var recs = recommendations || {}
        var act = []
        var checked = []
        if (recs.claudeMdSize) {
          var mdTokens = num(Math.round(recs.claudeMdSize.estimatedTokens))
          if (recs.claudeMdSize.overThreshold) act.push(t('consumption.claudeMdSize', { tokens: mdTokens }) + ' ' + t('consumption.claudeMdSizeSuggestion'))
          else checked.push(t('consumption.recItemClaudeMd', { tokens: mdTokens }))
        }
        if (recs.longSession) {
          var ctx = num(Math.round(recs.longSession.avgMainStepContextReread))
          if (recs.longSession.overThreshold) act.push(t('consumption.longSessionWarning', { tokens: ctx }))
          else checked.push(t('consumption.recItemContext', { tokens: ctx }))
        }
        if (recs.subagentShare) {
          var percent = num(Math.round(recs.subagentShare.subagentSharePercent * 10) / 10)
          if (recs.subagentShare.overThreshold) act.push(t('consumption.subagentShareWarning', { percent: percent }))
          else checked.push(t('consumption.recItemSubagents', { percent: percent }))
        }
        if (recs.mcpServerCount) checked.push(t('consumption.recItemMcp', { count: num(recs.mcpServerCount.count) }))
        var parts = act.length > 0 ? act.map(function (text) { return line(text, 'kpi-sub rec-act') }) : [line(t('consumption.recNothing'), 'kpi-sub')]
        if (checked.length > 0) parts.push(line(t('consumption.recChecked', { list: checked.join(' · ') }), 'empty-line'))
        return parts.join('')
      }

      /** The router's own three decision points and four tiers (JEV-060
       *  slice 2, §3/§4), in the fixed order the spec lists them -- never
       *  derived from whatever keys happen to be present, so an empty point
       *  or tier still has a place in the layout rather than reordering
       *  around whatever the log happened to contain. Tier wording matches
       *  src/core/i18n_model_router.ts's own "stage.*" status-line words
       *  (consultar/implementar/analizar/razonar a fondo) on purpose -- the
       *  same tier must read the same word wherever the person sees it. */
      var MODEL_ROUTER_POINTS = ['start', 'stage', 'subagent']
      var MODEL_ROUTER_POINT_KEYS = {
        start: 'consumption.modelRouterPointStart',
        stage: 'consumption.modelRouterPointStage',
        subagent: 'consumption.modelRouterPointSubagent'
      }
      var MODEL_ROUTER_TIERS = ['simple', 'standard', 'complex', 'frontier']
      var MODEL_ROUTER_TIER_KEYS = {
        simple: 'consumption.modelRouterTierSimple',
        standard: 'consumption.modelRouterTierStandard',
        complex: 'consumption.modelRouterTierComplex',
        frontier: 'consumption.modelRouterTierFrontier'
      }

      /** One decision point's tier counts as hbars() rows -- a point with
       *  every tier at zero renders no bars at all (hbars' own "max <= 0"
       *  guard), so a point with no decisions yet is left out of the
       *  section entirely rather than shown as four empty bars. */
      function modelRouterPointRows (counts) {
        return MODEL_ROUTER_TIERS.map(function (tier) {
          return { label: t(MODEL_ROUTER_TIER_KEYS[tier]), value: (counts && counts[tier]) || 0 }
        })
      }

      /**
       * The board's "Model router" subsection (JEV-060 slice 2, §8, T9):
       * `modelRouter` is `summarizeRouterDecisions`'s own summary
       * (read-consumption.mjs), or `null`/`undefined` when no
       * model-router-decisions-*.jsonl file exists at all (the router has
       * never run, or is `off`) -- rendered as one honest line, never a
       * zeroed-out summary that would look like a router that ran and
       * decided nothing.
       */
      function consumptionModelRouterBlock (summary, modelRouter) {
        if (!summary) return line(t('consumption.modelRouterEmpty'), 'empty-line')
        if (!modelRouter || modelRouter.available === false) return line(t('window.unavailableCard'), 'empty-line')

        var parts = []
        var anyPoint = false
        MODEL_ROUTER_POINTS.forEach(function (point) {
          var bars = hbars(modelRouterPointRows(modelRouter.byPoint && modelRouter.byPoint[point]), 'v2')
          if (!bars) return
          anyPoint = true
          parts.push('<p class="kpi-sub"><b>' + esc(t(MODEL_ROUTER_POINT_KEYS[point])) + '</b></p>' + bars)
        })
        if (!anyPoint) parts.push(line(t('consumption.modelRouterNoDecisions'), 'empty-line'))

        parts.push(line(t('consumption.modelRouterAppliedMeasured', { applied: num(modelRouter.applied), measured: num(modelRouter.measured) })))
        // Track R: switches the cold cache made free, in the window. A summary from before the count has none: no line, never a zero.
        if (typeof modelRouter.coldSwitches === 'number') parts.push(line(t('consumption.modelRouterColdSwitches', { n: num(modelRouter.coldSwitches) })))
        // Never a negative "saving": a total below zero is what the
        // switches cost (review finding 8), and the line always says what
        // the estimate covers.
        var estimate = modelRouter.savedEstimate
        if (estimate === null || estimate === undefined) {
          parts.push(line(t('consumption.modelRouterNoEstimateYet'), 'empty-line'))
        } else {
          parts.push(line(t(estimate < 0 ? 'consumption.modelRouterExtraCost' : 'consumption.modelRouterSavedEstimate', { amount: usd(estimate) })))
          parts.push(line(t('consumption.modelRouterEstimateScope'), 'empty-line'))
        }
        return parts.join('')
      }

      /**
       * The context steward (odd/tasks/jev-context-steward.md): the window's
       * compactions, and an ESTIMATE of the context each one took off every
       * later step. When `steward.verified` (verifyStewardSaving) confirms a
       * saving on real usage in the same window, that measured total
       * replaces the per-step estimate, which overstates the drop.
       * `summary` null: no log yet, one honest line.
       */
      function consumptionStewardBlock (summary, steward) {
        if (!summary) return line(t('consumption.stewardEmpty'), 'empty-line')
        if (!steward || steward.available === false) return line(t('window.unavailableCard'), 'empty-line')
        var parts = [line(t('consumption.stewardApplied', { applied: num(steward.applied), would: num(steward.wouldCompact) }))]
        var verified = steward.verified
        if (verified && verified.verified > 0) {
          parts.push(line(t('consumption.stewardVerified', {
            tokens: num(verified.tokensNotReread),
            share: verified.share === null || verified.share === undefined ? '—' : percentText(Math.round(verified.share * 100)),
            verified: num(verified.verified),
            compactions: num(verified.compactions)
          })))
        } else {
          parts.push(steward.freedPerStep === null || steward.freedPerStep === undefined
            ? line(t('consumption.stewardNoFreed'), 'empty-line')
            : line(t('consumption.stewardFreed', { tokens: num(steward.freedPerStep) })))
        }
        return parts.join('') + consumptionPreColdBlock(steward.preCold)
      }

      /**
       * Track S (odd/tasks/steward-pre-cold.md): the pre-cold tier in the
       * window (summarizePreCold). Saving and waste only when an applied
       * compaction measured them; the cold rewrite only when a measured
       * session came back. `undefined` (an older worker): nothing; null: one
       * honest line.
       */
      function consumptionPreColdBlock (preCold) {
        if (preCold === undefined) return ''
        if (preCold === null) return line(t('consumption.stewardColdEmpty'), 'empty-line')
        var parts = [line(t('consumption.stewardCold', { fired: num(preCold.fired), would: num(preCold.wouldFire), returned: num(preCold.returned), early: num(preCold.returnedEarly), gone: num(preCold.notReturned), pending: num(preCold.pending) }))]
        var hasSaving = preCold.realizedSaving !== null && preCold.realizedSaving !== undefined
        var hasWaste = preCold.waste !== null && preCold.waste !== undefined
        if (hasSaving || hasWaste) parts.push(line(t('consumption.stewardColdSaving', { saving: num(preCold.realizedSaving), waste: num(preCold.waste) })))
        if (preCold.coldRewriteOnReturn !== null && preCold.coldRewriteOnReturn !== undefined) parts.push(line(t('consumption.stewardColdRewrite', { tokens: num(preCold.coldRewriteOnReturn) })))
        return parts.join('')
      }

      /**
       * `summary`: the raw `consumptionSummary` storage value, or `null`
       * before the worker's first publish. Usage, the router, the steward
       * and typing each carry one summary per board window
       * (read-consumption.mjs, odd/tasks/board-global-window.md W1); this
       * card shows the current window's. The recommendation triggers are
       * NOT windowed: read-consumption.mjs always computes them from the
       * last 24 h.
       */
      // 0.6.8 T6: the main conversation and its subagents counted apart, as
      // real totals (src/core/consumption.ts's byAgent). A side with no
      // reported figure says so; it never prints a zero it did not measure.
      function consumptionByAgentLines (byAgent) {
        var main = byAgent.main || { stepCount: 0, tokens: null }
        var sub = byAgent.subagent || { stepCount: 0, tokens: null }
        var total = (main.tokens || 0) + (sub.tokens || 0)
        var percent = num(total > 0 && sub.tokens !== null ? Math.round((sub.tokens / total) * 1000) / 10 : 0)
        return (main.tokens === null
          ? line(t('consumption.byAgent.mainNoTokens', { steps: num(main.stepCount) }), 'empty-line')
          : line(t('consumption.byAgent.main', { tokens: num(main.tokens), steps: num(main.stepCount) }))) +
          (sub.tokens === null
            ? line(t('consumption.byAgent.subagentNoTokens', { steps: num(sub.stepCount) }), 'empty-line')
            : line(t('consumption.byAgent.subagent', { tokens: num(sub.tokens), steps: num(sub.stepCount), percent: percent })))
      }

      function renderConsumption (summary) {
        setWindowLabel('win-consumption', windowLabel(summary && summary.ok !== false ? windowOf(summary.usage) : null, summary && summary.checkedAt))
        if (!summary) { fill('consumption-body', 'consumption-empty', '', t('consumption.empty')); return }
        if (summary.ok === false) { fill('consumption-body', 'consumption-empty', '', t('consumption.unavailable')); return }

        var w = windowOf(summary.usage) || { stepCount: 0, byModel: [], avgMainStepContextReread: null, subagentShare: null }
        var quota = summary.quota || { accounts: [], checkedAt: null }
        var accounts = Array.isArray(quota.accounts) ? quota.accounts : []
        var hasUsage = (w.stepCount || 0) > 0
        var hasQuota = accounts.length > 0
        var hasModelRouter = !!summary.modelRouter
        var hasSteward = !!summary.steward

        if (!hasUsage && !hasQuota && !hasModelRouter && !hasSteward) {
          fill('consumption-body', 'consumption-empty', '', t('consumption.empty'))
          return
        }

        var parts = []

        parts.push('<p class="kpi-sub"><b>' + esc(t('consumption.usageHeading')) + '</b></p>')
        if (w.available === false) {
          parts.push(line(t('window.unavailableCard'), 'empty-line'))
        } else if (w.byModel && w.byModel.length > 0) {
          // W4 #4: how much, not only how it splits; a model with under 2% of
          // the window's steps folds into one line instead of its own bars.
          var main = (w.byAgent && w.byAgent.main) || {}
          var sub = (w.byAgent && w.byAgent.subagent) || {}
          if (typeof main.tokens === 'number' || typeof sub.tokens === 'number') {
            parts.push(line(t('consumption.usageTotal', { tokens: num((main.tokens || 0) + (sub.tokens || 0)), steps: num(w.stepCount || 0) })))
          }
          var floor = (w.stepCount || 0) * 0.02
          var big = w.byModel.filter(function (m) { return m.stepCount >= floor })
          var small = w.byModel.filter(function (m) { return m.stepCount < floor })
          parts.push(big.map(consumptionModelBlock).join('<div class="divider"></div>'))
          if (small.length > 0) {
            parts.push(line(t('consumption.smallModels', {
              n: num(small.length),
              steps: t('consumption.steps', { n: num(small.reduce(function (acc, m) { return acc + (m.stepCount || 0) }, 0)) }),
              tokens: num(small.reduce(function (acc, m) { return acc + (m.tokens || 0) }, 0))
            })))
          }
        } else {
          parts.push(line(t('consumption.noModelData'), 'empty-line'))
        }
        if (w.available !== false) parts.push(w.avgMainStepContextReread === null || w.avgMainStepContextReread === undefined
          ? line(t('consumption.noContextData'), 'empty-line')
          : line(t('consumption.avgContext', { tokens: num(Math.round(w.avgMainStepContextReread)) })))
        if (w.available !== false) parts.push(w.byAgent ? consumptionByAgentLines(w.byAgent) : w.subagentShare === null || w.subagentShare === undefined
          ? line(t('consumption.noSubagentData'), 'empty-line')
          : line(t('consumption.subagentSplit', { percent: num(Math.round(w.subagentShare * 1000) / 10) })))

        if (hasQuota) {
          parts.push('<div class="divider"></div><p class="kpi-sub"><b>' + esc(t('consumption.quotaHeading')) + '</b> · ' + esc(t('window.ignoresNow')) + '</p>')
          parts.push(accounts.map(consumptionQuotaBlock).join('<div class="divider"></div>'))
        }

        var recLines = consumptionRecommendationLines(summary.recommendations)
        if (recLines) {
          parts.push('<div class="divider"></div><p class="kpi-sub"><b>' + esc(t('consumption.recommendationsHeading')) + '</b> · ' + esc(t('window.ignoresDay')) + '</p>')
          parts.push(recLines)
        }

        parts.push('<div class="divider"></div><p class="kpi-sub"><b>' + esc(t('consumption.modelRouterHeading')) + '</b></p>')
        parts.push(consumptionModelRouterBlock(summary.modelRouter, windowOf(summary.modelRouter)))

        parts.push('<div class="divider"></div><p class="kpi-sub"><b>' + esc(t('consumption.stewardHeading')) + '</b></p>')
        parts.push(consumptionStewardBlock(summary.steward, windowOf(summary.steward)))

        fill('consumption-body', 'consumption-empty', parts.join(''), '')
      }

      // ---------- render: activity per project (JEVADV-63) --------------------
      // `activityByProjectSummary` (src/core/activity_by_project.ts,
      // adapters/orca/read-activity.mjs): {ok, windows: {day, week, version,
      // all}, corruptLines, checkedAt} or {ok:false, reason, detail,
      // checkedAt}. Each window: {available, sinceMs, coverageSinceMs,
      // projects (already ranked: dearest first, NEVER re-sorted here), rest,
      // totals}. Same null/ok:false/empty three-way split as
      // renderConsumption above.
      var ACTIVITY_TOP_N = 6
      var activityExpanded = false
      var lastActivitySummary = null

      /** "1 step" / "3 steps": `base` + One|Other, with the count formatted. */
      function activityCount (n, base) {
        return t(base + (n === 1 ? 'One' : 'Other'), { n: num(n) })
      }


      /** "N switches, ~$X saved/extra cost (estimate)" -- the same
       *  never-negative-saving convention consumptionModelRouterBlock
       *  applies (Math.abs + relabel to "extra cost" below zero). `router`
       *  is null when the project has no router decision in the window
       *  (never a fake zero row), in which case the line is omitted. */
      function activityRouterText (router) {
        // W7: a project whose router decisions were all measured only switched nothing.
        if (!router || ((router.applied || 0) === 0 && (router.savedEstimate === null || router.savedEstimate === undefined))) return ''
        var estimate = router.savedEstimate
        if (estimate === null || estimate === undefined) return t('activity.routerNoEstimate', { switches: num(router.applied) })
        return t(estimate < 0 ? 'activity.routerCost' : 'activity.routerSaved', { switches: num(router.applied), amount: usd(estimate) })
      }

      /** One project: its name and estimated cost (labelled) on one line,
       *  then its counts, then its dearest models and its router line. A
       *  blocked count takes the destructive colour only when it is not zero. */
      function activityProjectRow (entry) {
        var name = projectLabel(entry.project)
        var steps = (entry.steps && (entry.steps.main || 0) + (entry.steps.subagent || 0)) || 0
        var outcomes = entry.gateOutcomes || {}
        var counts = [esc(activityCount(entry.judged || 0, 'activity.judged'))]
        if ((outcomes.asked || 0) > 0 || (outcomes.blocked || 0) > 0) {
          counts[0] += ' (' + esc(t('activity.outcomes', { asked: num(outcomes.asked || 0), blocked: '\u0000' })).replace('\u0000',
            '<span class="' + ((outcomes.blocked || 0) > 0 ? 'vd' : '') + '">' + esc(num(outcomes.blocked || 0)) + '</span>') + ')'
        }
        counts.push(esc(activityCount(steps, 'activity.steps')))
        if ((entry.tokens || 0) > 0) counts.push(esc(t('activity.tokens', { n: num(entry.tokens) })))
        var details = []
        var models = Array.isArray(entry.models) ? entry.models.filter(function (m) { return (m.estimatedCostUsd || 0) > 0 }) : []
        if (models.length > 0) {
          details.push(t('activity.models', { list: models.map(function (m) { return friendlyModelName(m.model) + ' ' + usd(m.estimatedCostUsd) }).join(' · ') }))
        }
        var router = activityRouterText(entry.router)
        if (router) details.push(router)
        var cost = (entry.estimatedCostUsd || 0) > 0
          ? '<span class="act-cost">' + esc(usd(entry.estimatedCostUsd)) + '<small>' + esc(t('activity.costLabel')) + '</small></span>'
          : ''
        return '<li class="act-row">' +
          '<div class="act-head"><span class="act-name" title="' + esc(name) + '">' + esc(name) + '</span>' + cost + '</div>' +
          '<p class="act-sub">' + counts.join(' · ') + '</p>' +
          (details.length ? '<p class="act-sub">' + esc(details.join(' · ')) + '</p>' : '') +
        '</li>'
      }

      /** Top ACTIVITY_TOP_N projects, in the reader's own ranked order
       *  (never re-sorted here), plus a "show more" toggle for the rest of
       *  the listed ones, and the reader's own `rest` row for the projects
       *  past the ones it lists. */
      function renderActivityProjects (summary) {
        lastActivitySummary = summary
        setWindowLabel('win-projects', windowLabel(summary && summary.ok !== false ? windowOf(summary) : null, summary && summary.checkedAt))
        if (!summary) { fill('projects-body', 'projects-empty', '', t('activity.empty')); return }
        if (summary.ok === false) { fill('projects-body', 'projects-empty', '', t('activity.unavailable')); return }
        var w = windowOf(summary)
        if (w && w.available === false) { fill('projects-body', 'projects-empty', '', t('window.unavailableCard')); return }
        var projects = w && Array.isArray(w.projects) ? w.projects : []
        if (projects.length === 0) { fill('projects-body', 'projects-empty', '', t('activity.empty')); return }
        var totals = w.totals || {}
        var total = '<p class="act-total">' + esc(t('activity.total', {
          cost: usd(totals.estimatedCostUsd), projects: num(totals.projects || projects.length),
          judged: activityCount(totals.judged || 0, 'activity.judged'), steps: activityCount(totals.steps || 0, 'activity.steps')
        })) + '</p>'
        var shown = activityExpanded ? projects : projects.slice(0, ACTIVITY_TOP_N)
        var extra = projects.length - ACTIVITY_TOP_N
        var list = '<ol class="act-list" id="projects-list">' + shown.map(activityProjectRow).join('') + '</ol>'
        var toggle = extra > 0
          ? '<button type="button" class="act-toggle" data-activity-toggle aria-controls="projects-list" aria-expanded="' + (activityExpanded ? 'true' : 'false') + '">' +
            esc(activityExpanded ? t('activity.showLess') : t('activity.showMore', { n: String(extra) })) + '</button>'
          : ''
        var rest = w.rest && (activityExpanded || extra <= 0)
          ? '<p class="act-rest">' + esc(t('activity.rest', { n: num(w.rest.projects), cost: usd(w.rest.estimatedCostUsd), judged: activityCount(w.rest.judged || 0, 'activity.judged'), steps: activityCount(w.rest.steps || 0, 'activity.steps') })) + '</p>'
          : ''
        fill('projects-body', 'projects-empty', total + list + rest + toggle, '')
      }

      // One listener for the toggle, which is re-rendered with the cards;
      // the same pattern as cardsEl's own live-toggle listener below.
      el('projects-body').addEventListener('click', function (event) {
        var button = event.target && event.target.closest ? event.target.closest('[data-activity-toggle]') : null
        if (!button) return
        activityExpanded = !activityExpanded
        renderActivityProjects(lastActivitySummary)
        var again = el('projects-body').querySelector('[data-activity-toggle]')
        if (again) again.focus()
      })

      function renderUnmeasured () {
        el('unmeasured-body').innerHTML = [
          'unmeasured.money', 'unmeasured.extrapolation',
          'unmeasured.quality', 'unmeasured.counterfactual'
        ].map(function (key) { return '<li>' + esc(t(key)) + '</li>' }).join('')
      }

      /**
       * The catalog key naming who decided a recent row, or null for a source
       * this board does not know. A model-judged row (source `jev`) names the
       * provider that answered it: Clef when its row says so (C3,
       * odd/tasks/clef-decides-policies.md), Jev otherwise. Pure, so it is
       * tested from the panel's own source (board_html_providers.test.mjs).
       */
      function recentSourceKey (r) {
        if (r.source === 'jev') return r.provider === 'clef' ? 'stats.recentClef' : 'stats.recentJev'
        var keys = { 'local-rule': 'stats.recentLocalRule', cache: 'stats.recentCached', none: 'stats.recentNone' }
        return Object.prototype.hasOwnProperty.call(keys, r.source) ? keys[r.source] : null
      }

      function renderRecent (gate) {
        var recent = gate.recent || []
        if (recent.length === 0) {
          el('stats-recent').innerHTML = line(t('stats.recentEmpty'), 'empty-line')
          return
        }
        var sourceLabel = function (r) {
          var key = recentSourceKey(r)
          return key !== null ? t(key) : (r.source || '')
        }
        // 'advise' (the advise-model release): the model was refused this
        // one attempt and handed a reason, but nobody was interrupted --
        // its own state, own label, never `done`'s green (a clean pass) and
        // never `blocked`'s red (nothing was permanently refused). Every
        // OTHER verdict keeps printing its own raw word, unchanged.
        var verdictState = { deny: 'blocked', ask: 'working', advise: 'advised' }
        // W5 (#12): every verdict in the board's language; an unknown one keeps its raw word.
        var verdictLabel = { advise: t('stats.recentAdvise'), allow: t('verdict.allow'), ask: t('verdict.ask'), deny: t('verdict.deny') }
        // Family, source, verdict, age: the project moves to the tooltip and
        // the full timestamp is gone -- "4 min ago" is what a person scans.
        el('stats-recent').innerHTML = '<ul class="recent-list">' + recent.map(function (r) {
          var latency = r.latencyMs != null ? ' · ' + ms(r.latencyMs) + ' ms' : ''
          return '<li title="' + esc(projectLabel(r.project)) + '">' +
            '<span class="tag">' + esc(r.commandFamily || '') + '</span>' +
            '<span class="tag">' + esc(sourceLabel(r) + latency) + '</span>' +
            '<span class="' + tagClass(verdictState[r.verdict] || 'done') + '">' +
            esc(verdictLabel[r.verdict] || r.verdict || '') + '</span>' +
            '<span class="when">' + esc(ago(r.at)) + '</span></li>'
        }).join('') + '</ul>'
      }

      function show (id, visible) { el(id).style.display = visible ? '' : 'none' }

      // 0.6.8 T5: the items queue mode set aside for a person. Shown only
      // when there is at least one -- with queue mode off (the default) the
      // list is always empty, and an empty card on every board would say
      // nothing. `waitingTotal` can exceed the listed items (the reader
      // lists at most 20); the heading counts all of them.
      function renderWaiting (gate) {
        var waiting = Array.isArray(gate.waiting) ? gate.waiting : []
        var total = typeof gate.waitingTotal === 'number' ? gate.waitingTotal : waiting.length
        show('card-waiting', waiting.length > 0)
        if (waiting.length === 0) return
        el('waiting-heading').textContent = t('waiting.heading', { n: String(total) })
        el('waiting-body').innerHTML = waiting.map(function (item) {
          return '<li>' +
            '<span class="meta">' +
              '<span class="tag working">' + esc(item.policyId || '') + '</span>' +
              '<span class="tag">' + esc(projectLabel(item.project)) + '</span>' +
              '<span class="when">' + esc(ago(item.at)) + '</span>' +
            '</span>' +
            '<code>' + esc(item.command || '') + '</code></li>'
        }).join('')
      }

      // Whether the board has anything to say beyond its empty state.
      var hasMeasurements = false

      function renderStats (summary, policiesWithoutKind) {
        lastStats = summary
        lastPoliciesWithoutKind = policiesWithoutKind || null
        var ok = !!(summary && summary.ok)
        var gate = (ok && summary.gate) || {}
        var mod = (ok && summary.modSkills) || {}
        var ab = (ok && summary.abBenchmark) || {}
        var windows = gate.windows || null
        var hasGate = !!(windows && windows.all && windows.all.totalDecisions > 0)
        var hasSpeed = (ab.sampleCount || 0) > 0
        var hasSkills = (mod.totalDecisions || 0) > 0
        hasMeasurements = hasGate || hasSpeed || hasSkills
        // JEVADV-49: at least one stored team policy has no kind (a config-
        // panel save can silently strip it -- see main.mjs's own
        // publishPoliciesWithoutKindStatus). This must be visible even on a
        // machine with no gate decisions measured yet, so it gets its own
        // reason to show the status card, independent of hasGate.
        var kindIssue = !!(lastPoliciesWithoutKind && lastPoliciesWithoutKind.count > 0)
        // 0.6.17 T4: decisions that could not be written show the card too --
        // with every append failing there is no decision to show it for.
        var appendIssue = !!(gate.health && gate.health.appendFailures && gate.health.appendFailures.count > 0)

        // An empty log gets one card that says why, never a column of empty
        // sections and never a zero standing in for "nothing yet". With tabs
        // (odd/tasks/board-tabs-and-names.md T2) that rule holds per tab:
        // Gate's is card-empty, and the live, activity, consumption and
        // skills cards always show, each saying in its own words that
        // nothing is there yet -- otherwise the Activity or Skills tab
        // would open blank. card-projects (JEVADV-63) manages its own empty
        // state through renderActivityProjects, fed by its own storage key
        // (activityByProjectSummary), not by hasGate/hasSkills.
        renderWaiting(gate)
        show('card-empty', !hasGate)
        el('empty-body').textContent = t('empty.body')
        show('card-status', hasGate || kindIssue || appendIssue)
        show('card-recent', hasGate)
        show('card-speed', hasMeasurements)
        show('card-unmeasured', hasMeasurements)

        var key = activeWindowKey(windows)
        currentWindowKey = key
        lastGateWindows = windows
        var w = (windows && windows[key]) || {}
        show('top', hasGate && w.totalDecisions > 0)
        renderWindowPicker(windows, key)
        // W2: the gate's cards follow the window; the last decisions, the
        // A/B comparison and the waiting queue are what they are right now.
        var gateLabel = windowLabel(windows && windows[key])
        setWindowLabel('win-status', gateLabel)
        setWindowLabel('win-toll', gateLabel)
        setWindowLabel('win-interv', gateLabel)
        setWindowLabel('win-providers', gateLabel)
        setWindowLabel('win-calibration', gateLabel)
        setWindowLabel('win-recent', t('window.ignoresRecent', { n: num((gate.recent || []).length) }))
        setWindowLabel('win-speed', t('window.ignoresAb'))
        setWindowLabel('win-waiting', t('window.ignoresNow'))
        setWindowLabel('win-skills', windowLabel(windowOf(mod)))
        if (hasGate) {
          renderStatus(gate.health || {}, w, lastPoliciesWithoutKind)
          if (w.totalDecisions > 0) {
            renderToll(w)
            renderInterventions(w)
            renderApprovals(w.approvals || {})
          }
          renderRecent(gate)
        } else if (kindIssue || appendIssue) {
          // No gate decisions measured at all, but the kind-less-policy
          // warning still has to render somewhere -- the same chips
          // function, with no gate health to report (its own no-data chips
          // are truthful either way: "Jev has not answered a call yet" is
          // exactly what "no gate data" means here).
          renderStatus(gate.health || {}, {}, lastPoliciesWithoutKind)
        }
        // Multi-provider P7: follows the window; Clef spend today shows it even before a decision is logged.
        renderProviders(hasGate ? w : {}, gate.clefBudget || null)
        if (hasMeasurements) {
          renderUnmeasured()
          renderSpeed(ab)
        }
        renderSkills(mod)
      }

      // ---------- render: live board -----------------------------------------
      function tagClass (state) {
        if (state === 'done') return 'tag done'
        if (state === 'working') return 'tag working'
        if (state === 'blocked') return 'tag blocked'
        if (state === 'advised') return 'tag advised'
        return 'tag'
      }
      // odd/tasks/board-leftovers.md L6 -- the owner's panel with 63 agents
      // listed the oldest first inside each status, said "working" for rows
      // silent for three days, and repeated one project and branch more than
      // ten times. So: one row per project and branch (its latest state, its
      // last-seen time and how many sessions it stands for), newest first
      // across every status, a working or waiting row silent for over an
      // hour shown as "no signal", and rows last seen over 24 h ago behind a
      // "show more" toggle. View only: the worker's entries are unchanged.
      var LIVE_STALE_AFTER_MS = 60 * 60 * 1000
      var LIVE_RECENT_MS = 24 * 60 * 60 * 1000
      // The states that claim someone is active right now; `done` never goes
      // stale, it is already the end.
      var LIVE_ACTIVE_STATES = ['working', 'waiting']
      var LIVE_STATE_WORDS = ['working', 'waiting', 'done', 'blocked']
      var liveExpanded = false
      var lastBoard = null

      function presentText (value) { return (typeof value === 'string' && value.length > 0) ? value : null }
      function entryTime (entry) {
        var at = Date.parse(entry && entry.updatedAt)
        return isNaN(at) ? null : at
      }
      /** Which row an entry belongs to: its project (the resolved name, else
       *  the raw id) plus its branch. An entry with no project at all never
       *  merges with another unnamed one: it keeps its own worktree, or its
       *  own pane when it has none or is on the floating terminal (every
       *  floating pane shares that one worktree id). */
      function liveGroupKey (e) {
        var project = presentText(e.projectName) || presentText(e.project)
        // W6 (#14): one row per project; its other branches are counted on it.
        if (project !== null) return 'p\u0000' + project
        var worktree = presentText(e.worktreeId)
        if (worktree !== null && worktree !== FLOATING_TERMINAL_WORKTREE_ID) return 'w\u0000' + worktree
        return 'k\u0000' + String(e.paneKey)
      }
      /** Newer first: by last-seen time, a missing time last, then by the
       *  order Orca received the events in. */
      function newerFirst (aTime, aReceived, bTime, bReceived) {
        if (aTime !== bTime) {
          if (aTime === null) return 1
          if (bTime === null) return -1
          return bTime - aTime
        }
        return (bReceived || 0) - (aReceived || 0)
      }
      function liveGroups (entries) {
        var byKey = {}
        var order = []
        entries.forEach(function (entry) {
          var e = entry || {}
          var key = liveGroupKey(e)
          var group = byKey[key]
          if (!group) {
            group = byKey[key] = { latest: e, lastSeen: entryTime(e), count: 0, branches: {} }
            order.push(group)
          } else if (newerFirst(entryTime(e), e.receivedAt, group.lastSeen, group.latest.receivedAt) < 0) {
            group.latest = e
            group.lastSeen = entryTime(e)
          }
          group.count += 1
          if (presentText(e.rama) !== null) group.branches[e.rama] = true
        })
        return order.sort(function (a, b) { return newerFirst(a.lastSeen, a.latest.receivedAt, b.lastSeen, b.latest.receivedAt) })
      }
      function liveRow (group, nowMs) {
        var entry = group.latest
        var view = liveEntryView(entry)
        var silent = group.lastSeen === null || nowMs - group.lastSeen > LIVE_STALE_AFTER_MS
        var noSignal = LIVE_ACTIVE_STATES.indexOf(entry.state) !== -1 && silent
        var branches = Object.keys(group.branches || {})
        var others = branches.filter(function (b) { return b !== view.branch }).length
        var title = view.title + (branches.length > 1 ? ' · ' + branches.join(', ') : '')
        // W6 (#14): two lines, the same on every row -- name, state and time;
        // then branch, other branches and sessions, quiet.
        var sub = (view.branch ? '<span class="tag branch">' + esc(view.branch) + '</span>' : '') +
          (others > 0 ? '<span class="count branches">' + esc(t('live.otherBranches', { n: num(others) })) + '</span>' : '') +
          (group.count > 1 ? '<span class="count">' + esc(t('live.sessions', { n: num(group.count) })) + '</span>' : '')
        return '<div class="live-row" title="' + esc(title) + '">' +
          '<span class="live-main"><span class="name">' + esc(view.name) + '</span>' +
          (noSignal
            ? '<span class="tag state nosignal">' + esc(t('live.noSignal')) + '</span>'
            : '<span class="' + tagClass(entry.state) + ' state">' + esc(LIVE_STATE_WORDS.indexOf(entry.state) !== -1 ? t('state.' + entry.state) : (entry.state || '?')) + '</span>') +
          '</span><span class="when">' + esc(ago(entry.updatedAt)) + '</span>' +
          (sub ? '<span class="live-sub">' + sub + '</span>' : '') + '</div>'
      }
      function render (board) {
        lastBoard = board
        setWindowLabel('win-live', t('window.ignoresNow'))
        var entries = (board && Array.isArray(board.entries)) ? board.entries.slice() : []

        if (!entries.length) {
          cardsEl.innerHTML = '<p class="empty">' + esc(t('live.empty')) + '</p>'
          statusEl.textContent = ''
          return
        }

        var nowMs = Date.now()
        var groups = liveGroups(entries)
        var recent = groups.filter(function (g) { return g.lastSeen !== null && nowMs - g.lastSeen <= LIVE_RECENT_MS })
        var olderCount = groups.length - recent.length
        var shown = liveExpanded ? groups : recent
        // A pane key is a pair of UUIDs that tells a person nothing: the
        // project and branch are the chips, the ids only the tooltip.
        var list = shown.length
          ? '<div class="live-list" id="live-list">' + shown.map(function (g) { return liveRow(g, nowMs) }).join('') + '</div>'
          : '<p class="empty-line" id="live-list">' + esc(t('live.none24h')) + '</p>'
        var toggle = olderCount > 0
          ? '<button type="button" class="live-toggle" data-live-toggle aria-controls="live-list" aria-expanded="' + (liveExpanded ? 'true' : 'false') + '">' +
            esc(liveExpanded ? t('live.showLess') : t('live.showMore', { n: String(olderCount) })) + '</button>'
          : ''
        cardsEl.innerHTML = list + toggle
        statusEl.textContent = t('live.agentsCount', { n: num(recent.length) })
      }

      // One listener for the toggle, which is re-rendered with the list; the
      // focus goes back onto the new button so the keyboard never loses it.
      cardsEl.addEventListener('click', function (event) {
        var button = event.target && event.target.closest ? event.target.closest('[data-live-toggle]') : null
        if (!button) return
        liveExpanded = !liveExpanded
        render(lastBoard)
        var again = cardsEl.querySelector('[data-live-toggle]')
        if (again) again.focus()
      })

      // Every number on this board (board entries, measurementsSummary) is
      // written only by the worker -- if it has never run, both stay
      // legitimately absent forever, and "No data yet" is honest but does
      // not say why. This note names the real cause once the worker's own
      // heartbeat (T1 in odd/tasks/panel-worker-wakeup.md) says nobody is
      // running right now.
      function renderWorkerNote (heartbeat) {
        if (isHeartbeatFresh(heartbeat, Date.now(), WORKER_HEARTBEAT_STALE_MS)) {
          noteEl.className = 'meta nota'
          noteEl.textContent = ''
          return
        }
        noteEl.className = 'meta nota stale'
        noteEl.textContent = t('common.workerSilent')
      }

      var lastConsumption = null
      /** Every card that follows the window, from the last summaries read --
       *  on each reload and when the person picks a chip. The gate's own
       *  windows settle the window first (renderStats). */
      function renderEverything () {
        renderStats(lastStats, lastPoliciesWithoutKind)
        renderConsumption(lastConsumption)
        renderSkillsTyping(lastConsumption)
        renderActivityProjects(lastActivitySummary)
        renderModules()
      }

      function reload (usuario) {
        signalPanelOpen()
        return Promise.all([
          read('board', usuario),
          read('measurementsSummary', usuario),
          read(WORKER_HEARTBEAT_KEY, false),
          read(POLICIES_WITHOUT_KIND_STATUS_KEY, false).catch(function () { return null }),
          read('consumptionSummary', usuario),
          read('activityByProjectSummary', usuario),
          read(MODELS_KEY, false).catch(function () { return null }),
          read('claudeIntegrationStatus', false).catch(function () { return null })
        ]).then(function (results) {
          modelLabels = modelLabelsFromCatalog(results[6])
          lastIntegrationStatus = results[7]
          render(results[0] || { entries: [] })
          renderWorkerNote(results[2])
          lastStats = results[1]
          lastPoliciesWithoutKind = results[3] || null
          lastConsumption = results[4]
          lastActivitySummary = results[5]
          renderEverything()
        }).catch(function (error) {
          noteEl.className = 'meta nota stale'
          // Same rule as config.html: a raw fault message is written for
          // whoever is debugging, not for whoever installed this.
          noteEl.textContent = t('error.unexpected')
        })
      }

      var timer = null
      function startPolling () {
        if (timer) return
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload(false)
        }, 8000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reload(false); startPolling() } else if (timer) {
          clearInterval(timer); timer = null
        }
      })
      window.addEventListener('focus', function () { reload(false) })

      el('refresh').addEventListener('click', function (event) {
        var b = event.currentTarget
        b.disabled = true
        statusEl.textContent = t('live.updating')
        Promise.resolve(reload(true)).then(function () {
          setTimeout(function () { b.disabled = false }, 400)
        })
      })

      // Orca's language decides; see the note in config.html. JEVADV-10
      // (odd/tasks/release-0.5.1.md): read the worker's own published
      // locale status BEFORE the first paint, and repaint with Orca's own
      // explicit setting when the worker already knows one -- this board
      // still never PUSHES a locale request back (read-only, see
      // localeFromOrca's own doc comment above).
      var LOCALE_STATUS_KEY = 'localeStatus'
      // W2: the window this viewer picked last, from the host's plugin
      // storage (inside Orca localStorage throws), read before the first
      // paint like the locale; the host's value wins over localStorage.
      Promise.resolve().then(function () {
        return Promise.all([
          read(LOCALE_STATUS_KEY, false).catch(function () { return null }),
          read(WINDOW_STORAGE_KEY, false).catch(function () { return null })
        ])
      }).then(function (results) {
        var status = results[0]
        if (WINDOW_KEYS.indexOf(results[1]) !== -1) chosenWindow = results[1]
        currentLocale = resolveEffectiveLocale(status, currentLocale)
        applyStaticI18n()
        return reload(true)
      }).then(startPolling)
    </script>
  </body>
</html>

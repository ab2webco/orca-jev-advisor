<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advisor</title>
    <!--
      Every user-facing string here comes from CATALOG (es/en) below, by
      key -- see panels/config.html's <head> comment for why this is not
      Orca's own `contributes.languagePacks` (verified in orca-oss:
      I18nProvider.tsx only applies a plugin's pack when
      uiLanguage === pack.id -- it replaces Orca's whole UI language, not
      one plugin's own panel). The language choice is shared with
      config.html through the same `localeStatus`/`localeRequest` keys.

      Numbers on this panel are never invented: every one comes from
      counting entries in the JSONL logs main.mjs's read-measurements.mjs
      aggregates (adapters/claude/gate-bash.ts's, adapters/claude/mod-skills'
      and adapters/claude/gate-outcome.ts's). Nothing here estimates a saved
      dollar, a saved token, or how long a deliberation would have taken --
      none of that is measured anywhere in this plugin.

      The approvals section is the same rule applied to a suggested number:
      src/core/approval_record.ts's ceilingEvidence() returns null, not a
      guess, whenever approvals and rejections overlap or one side has no
      evidence yet -- and this panel renders that null as an honest sentence
      explaining why, never as a blank dash.
    -->
    <style>
      /* El host inyecta una lista corta de tokens en el <style> del shell
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts)
         y pone light/dark en <html>. Nada mas llega aca: ni utilidades de Tailwind,
         ni la tipografia de la app. Los respaldos son los valores reales de
         main.css, no un gris inventado, para que el panel se lea bien incluso
         cuando el host no inyecta nada (host viejo, o el arnes de pruebas). */
      :root {
        color-scheme: light dark;
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717; --fb-primary-foreground: #fafafa;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-ring: #a1a1a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5; --fb-primary-foreground: #171717;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-ring: #737373;
        }
      }
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 0 0 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; margin: 0 0 8px; padding: 8px 12px;
        border-bottom: 1px solid var(--border, var(--fb-border));
      }
      header .meta { margin-left: auto; }
      header button {
        font: inherit; font-size: 13px; line-height: 1; padding: 3px 8px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md);
        background: var(--secondary, var(--fb-secondary));
        color: var(--muted-foreground, var(--fb-muted-foreground));
        transition: background-color 90ms ease, color 90ms ease;
      }
      header button:hover { background: var(--accent, var(--fb-accent));
                            color: var(--accent-foreground, var(--fb-accent-foreground)); }
      header button:active { transform: translateY(1px); }
      header button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      header button[disabled] { opacity: 0.5; cursor: default; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .meta { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .nota { margin: 0 0 8px; padding: 0 12px; }
      .nota:empty { display: none; }

      section { padding: 10px 12px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           margin: 0 0 8px; font-weight: 600; }
      .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
      .stat { border: 1px solid var(--border, var(--fb-border)); border-radius: var(--radius-md); padding: 8px 10px; }
      .stat .n { font-size: 20px; font-weight: 700; line-height: 1.2; }
      .stat .label { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); margin-top: 2px; }
      .empty-line { color: var(--muted-foreground, var(--fb-muted-foreground)); font-size: 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      /* At 320px the five-column family table is 386px wide. Let the table
         scroll inside its own box instead of pushing the whole page sideways. */
      #gate-by-family { overflow-x: auto; }
      #gate-by-family table { min-width: 340px; }
      th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border, var(--fb-border)); }
      th { color: var(--muted-foreground, var(--fb-muted-foreground)); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
      tr:last-child td { border-bottom: 0; }
      .divider { border-top: 1px solid var(--border, var(--fb-border)); margin-top: 4px; }

      .item { padding: 8px 12px; border-bottom: 1px solid var(--border, var(--fb-border)); }
      .item:last-child { border-bottom: 0; }
      .line1 { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
      .worktree { font-weight: 500; word-break: break-all; }
      .pane { color: var(--muted-foreground, var(--fb-muted-foreground)); font-size: 11px; word-break: break-all; }
      .when { margin-left: auto; color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; white-space: nowrap; }
      .tag { font-size: 10px; border: 1px solid var(--border, var(--fb-border));
             border-radius: 9999px; padding: 0 6px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Sin tono propio de exito/alerta -- la allowlist no lo tiene. `done`
         y `working` se apoyan en --accent (superficie de enfasis), `blocked`
         en --destructive (el unico rojo disponible), y todo lo demas en el
         filete neutro, igual que hace activity.html con sus tres etiquetas. */
      .tag.done { background: var(--accent, var(--fb-accent));
                  color: var(--accent-foreground, var(--fb-accent-foreground));
                  border-color: transparent; font-weight: 600; }
      .tag.working { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      .tag.blocked { color: var(--destructive, var(--fb-destructive)); border-style: dashed; }
      .empty { color: var(--muted-foreground, var(--fb-muted-foreground)); padding: 8px 12px; }
      .stale { color: var(--destructive, var(--fb-destructive)); }
    </style>
  </head>
  <body>

    </header>

      <div class="divider" style="margin-top:14px; padding-top:10px;">

    <section id="live-section">
      <h2 data-i18n="live.heading"></h2>
      <div id="cards"><p class="empty" data-i18n="live.loading"></p></div>
    </section>

    <script>
      'use strict'

      var el = function (id) { return document.getElementById(id) }
      var cardsEl = el('cards')
      var statusEl = el('status')
      var noteEl = el('note')

      // ---------- catalogo de idioma (es/en) --------------------------------
      var CATALOG = {

          'approvals.noSuggestionOverlap': 'Las aprobaciones y los rechazos se superponen -- lo más alto aprobado ({{highest}}) es mayor o igual que lo más bajo rechazado ({{lowest}}), con {{approved}} aprobación(es) y {{rejected}} rechazo(s) -- así que ningún techo único los separa todavía.',

          'stats.byProjectSkills': 'Skills',

          'stats.recentJev': 'jev',
          'stats.tableProject': 'project',
          'stats.tableCount': 'decisions',
          'stats.na': 'not enough data',
          'stats.unknownProject': '(unknown project)',
          'gate.heading': 'What the Jev gate did',
          'gate.empty': 'The gate has not run yet. This section fills in the next time Claude Code proposes a command for the gate to judge.',
          'gate.verdict.allow': 'Allowed silently',
          'gate.verdict.ask': 'Asked',
          'gate.verdict.deny': 'Blocked',
          'gate.source.localRule': 'Local rule (~1ms, no network)',
          'gate.source.cache': 'Cache (no network)',
          'gate.source.jev': 'Jev (network)',
          'gate.latency': 'Jev latency: median {{median}}ms · max {{max}}ms ({{n}} measured call(s))',
          'gate.latency.none': 'Jev latency: no network calls yet (everything resolved by local rule or cache).',
          'gate.byFamilyHeading': 'Where it is used most (command family)',
          'gate.byFamilyEmpty': 'No data yet.',
          'gate.tableFamily': 'family',
          'gate.tableTotal': 'total',
          'gate.tableAllowed': 'allowed',
          'gate.tableAsked': 'asked',
          'gate.tableBlocked': 'blocked',
          'approvals.heading': 'What the person answered',
          'approvals.empty': 'The gate has not stopped any command yet. This section fills in the next time it asks and the person answers.',
          'approvals.asked': 'Questions asked',
          'approvals.approved': 'Approved',
          'approvals.rejected': 'Rejected',
          'approvals.unresolved': 'Unanswered',
          'approvals.highestApproved': 'Highest approved',
          'approvals.lowestRejected': 'Lowest rejected',
          'approvals.band': 'Band between them',
          'approvals.suggestedCeiling': 'Suggested ceiling',
          'approvals.evidenceCount': 'Based on {{approved}} approval(s) and {{rejected}} rejection(s) with a score.',
          'approvals.noSuggestionInsufficient': 'Not enough evidence yet to suggest a ceiling: scored approvals and rejections are needed on both sides ({{approved}} approval(s), {{rejected}} rejection(s) so far).',
          'approvals.noSuggestionOverlap': 'Approvals and rejections overlap -- the highest approved ({{highest}}) is at or above the lowest rejected ({{lowest}}), with {{approved}} approval(s) and {{rejected}} rejection(s) -- so no single ceiling separates them yet.',

          'live.loading': 'Loading…',
          'live.empty': 'No data yet. The board fills in as events arrive.',
          'live.unknownWorktree': '(unknown worktree)',
          'live.agentsCount': '{{n}} agent(s)',
          'live.updating': 'Updating…'
        }
      }
      /**
       * The language Orca is running in.
       *
       * Orca substitutes the resolved UI locale into the panel shell's
       * `<html lang>`, so the plugin no longer has to ask a question the
       * user already answered in Orca's own settings. Anything this plugin
       * has no catalog for falls back to English.
       */
      function localeFromOrca () {
        var tag = (document.documentElement.getAttribute('lang') || '').toLowerCase()
        return tag.indexOf('es') === 0 ? 'es' : 'en'
      }

      var currentLocale = localeFromOrca()
      function t (key, params) {
        var template = (CATALOG[currentLocale] && CATALOG[currentLocale][key]) || CATALOG.es[key] || key
        if (!params) return template
        return template.replace(/\{\{(\w+)\}\}/g, function (_m, name) {
          return Object.prototype.hasOwnProperty.call(params, name) ? params[name] : ''
        })
      }
      function applyStaticI18n () {
        document.querySelectorAll('[data-i18n]').forEach(function (node) { node.textContent = t(node.getAttribute('data-i18n')) })
        document.querySelectorAll('[data-i18n-title]').forEach(function (node) { node.title = t(node.getAttribute('data-i18n-title')) })
        document.querySelectorAll('[data-i18n-aria]').forEach(function (node) { node.setAttribute('aria-label', t(node.getAttribute('data-i18n-aria'))) })
      }

      // ---------- puente real con el host --------------------------------
      // El panel corre en un iframe sandboxed de origen opaco: sin peticiones
      // externas, el unico canal es postMessage con el frame padre
      // (orca-oss src/shared/plugins/plugin-panel-bridge.ts). '*' es el unico
      // targetOrigin usable porque el origen del iframe es opaco; el host
      // valida la ventana que lo manda.
      //
      // El host admite un cupo de mensajes por ventana y contesta
      // `rate_limited` al resto (PANEL_MESSAGE_RATE_LIMIT en el mismo
      // archivo). Este panel solo hace lecturas -sondeo cada 8 s mas el clic
      // manual-, asi que la cola solo necesita distinguir "esto lo pidio la
      // persona" (prioridad, reintento) de "esto es sondeo de fondo" (se dej
      // caer y la vuelta siguiente lo vuelve a pedir), tal como wa-inbox
      // config.html lo resuelve para sus quince claves, simplificado a una.
      var seq = 0
      var pending = {}
      var CUPO = { max: 30, ventanaMs: 10000, reserva: 4 }
      var gastados = []
      var cola = []
      var colaTimer = null
      var frenoHasta = 0
      var RECHAZADO = { ok: false, errorCode: 'rate_limited' }

      function hayLugarDeSondeo () {
        var corte = Date.now() - CUPO.ventanaMs
        while (gastados.length && gastados[0] <= corte) gastados.shift()
        return gastados.length < CUPO.max - CUPO.reserva
      }
      function proximoHueco () {
        var ahora = Date.now()
        if (cola[0] && cola[0].usuario) return Math.max(60, (cola[0].desde || 0) - ahora)
        var falta = frenoHasta - ahora
        if (gastados.length) falta = Math.max(falta, gastados[0] + CUPO.ventanaMs - ahora)
        return Math.max(60, Math.min(falta, CUPO.ventanaMs))
      }
      function despachar (it) {
        var requestId = 'req-' + (++seq)
        pending[requestId] = function (d) {
          if (!(d && d.errorCode === 'rate_limited')) { it.resolve(d); return }
          frenoHasta = Date.now() + 1000
          if (!it.usuario || Date.now() >= it.vence) { it.resolve(d); return }
          it.espera = Math.min((it.espera || 300) * 2, 2500)
          it.desde = Date.now() + it.espera
          encolar(it)
        }
        window.parent.postMessage(
          { type: 'orca-panel-action', requestId: requestId, action: it.action, params: it.params }, '*')
      }
      function drenar () {
        if (colaTimer) { clearTimeout(colaTimer); colaTimer = null }
        var ahora = Date.now()
        while (cola.length) {
          var it = cola[0]
          if (it.vence <= ahora) { cola.shift(); it.resolve(RECHAZADO); continue }
          if (it.usuario ? (it.desde || 0) > ahora : (ahora < frenoHasta || !hayLugarDeSondeo())) break
          cola.shift()
          if (!it.usuario) gastados.push(ahora)
          despachar(it)
        }
        if (cola.length) colaTimer = setTimeout(drenar, proximoHueco())
      }
      function encolar (it) {
        var i = cola.length
        if (it.usuario) { i = 0; while (i < cola.length && cola[i].usuario) i++ }
        cola.splice(i, 0, it)
        drenar()
      }
      function call (action, params, usuario) {
        return new Promise(function (resolve) {
          encolar({
            action: action, params: params, usuario: !!usuario,
            vence: Date.now() + (usuario ? 30000 : 12000), resolve: resolve
          })
        })
      }
      window.addEventListener('message', function (event) {
        var d = event.data
        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // storage.get devuelve { value: <dato> } y el bridge lo envuelve otra vez.
      function stored (result) {
        if (!result || !result.ok || !result.value) return null
        return result.value.value === undefined ? null : result.value.value
      }
      function read (key, usuario) { return call('storage.get', { key: key }, usuario).then(stored) }

      // This panel only reads. The locale mirror for the gate and the skills
      // mod is written by config.html alone; both panels doing it would race
      // for no gain, so there is no storage.set helper here.
      // ---------- render: stats ---------------------------------------------
      function esc (text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }
      function pct (fraction) {
        return fraction === null || fraction === undefined ? null : Math.round(fraction * 1000) / 10
      }
      function statTile (n, label) {
        return '<div class="stat"><div class="n">' + esc(n) + '</div><div class="label">' + esc(label) + '</div></div>'
      }

      /** null/undefined-safe project label -- a record whose project could
       *  not be resolved (gate-bash.ts's own projectName() returning null)
       *  is still shown, honestly, never silently dropped. */
      function projectLabel (project) {
        return (project === null || project === undefined || project === '') ? t('stats.unknownProject') : String(project)
      }

      var lastStats = null
      function renderStats (summary) {
        lastStats = summary
        var gridEl = el('stats-grid')
        var emptyEl = el('stats-empty')
        var byProjectEl = el('stats-by-project')
        var recentEl = el('stats-recent')
        var gateEmptyEl = el('gate-empty')
        var gateVerdictGridEl = el('gate-verdict-grid')
        var gateSourceGridEl = el('gate-source-grid')
        var gateLatencyEl = el('gate-latency-line')
        var gateByFamilyEl = el('gate-by-family')
        var approvalsEmptyEl = el('approvals-empty')
        var approvalsGridEl = el('approvals-grid')
        var approvalsCeilingEl = el('approvals-ceiling')

        if (!summary || !summary.ok) {
          gridEl.innerHTML = ''
          emptyEl.style.display = ''
          emptyEl.textContent = t('stats.noData')
          gateEmptyEl.style.display = ''
          gateEmptyEl.textContent = t('gate.empty')
          gateVerdictGridEl.innerHTML = ''
          gateSourceGridEl.innerHTML = ''
          gateLatencyEl.textContent = ''
          gateByFamilyEl.innerHTML = '<p class="empty-line">' + esc(t('gate.byFamilyEmpty')) + '</p>'
          approvalsEmptyEl.style.display = ''
          approvalsEmptyEl.textContent = t('approvals.empty')
          approvalsGridEl.innerHTML = ''
          approvalsCeilingEl.innerHTML = ''
          byProjectEl.innerHTML = '<p class="empty-line">' + esc(t('stats.byProjectEmpty')) + '</p>'
          recentEl.innerHTML = '<p class="empty-line">' + esc(t('stats.recentEmpty')) + '</p>'
          return
        }

        var gate = summary.gate || {}
        var mod = summary.modSkills || {}
        var approvals = summary.approvals || {}

        // ---- resumen de skills (lo unico que queda en el grid de arriba) ----
        if (!((mod.totalDecisions || 0) > 0)) {
          gridEl.innerHTML = ''
          emptyEl.style.display = ''
          emptyEl.textContent = t('stats.skillsEmpty')
        } else {
          emptyEl.style.display = 'none'
          var tiles = []
          tiles.push(statTile(mod.suggestedCount || 0, t('stats.skillSuggestions')))
          tiles.push(statTile(mod.matchRate == null ? t('stats.na') : pct(mod.matchRate) + '%', t('stats.skillMatchRate')))
          if (mod.listingCharsTotal != null) {
            tiles.push(statTile(mod.listingCharsTotal.toLocaleString(), t('stats.listingChars')))
          }
          gridEl.innerHTML = tiles.join('')
        }

        // ---- lo que hizo el gate de Jev: honesto, nunca "0 guardado" cuando
        // en realidad es "todavia no corrio" ------------------------------
        var gateHasData = (gate.totalDecisions || 0) > 0
        if (!gateHasData) {
          gateEmptyEl.style.display = ''
          gateEmptyEl.textContent = t('gate.empty')
          gateVerdictGridEl.innerHTML = ''
          gateSourceGridEl.innerHTML = ''
          gateLatencyEl.textContent = ''
          gateByFamilyEl.innerHTML = '<p class="empty-line">' + esc(t('gate.byFamilyEmpty')) + '</p>'
        } else {
          gateEmptyEl.style.display = 'none'
          var verdict = gate.byVerdict || { allow: 0, ask: 0, deny: 0 }
          gateVerdictGridEl.innerHTML = [
            statTile(verdict.allow || 0, t('gate.verdict.allow')),
            statTile(verdict.ask || 0, t('gate.verdict.ask')),
            statTile(verdict.deny || 0, t('gate.verdict.deny'))
          ].join('')

          var source = gate.bySource || { 'local-rule': 0, cache: 0, jev: 0 }
          gateSourceGridEl.innerHTML = [
            statTile(source['local-rule'] || 0, t('gate.source.localRule')),
            statTile(source.cache || 0, t('gate.source.cache')),
            statTile(source.jev || 0, t('gate.source.jev'))
          ].join('')

          var latency = gate.jevLatency || { sampleCount: 0, medianMs: null, maxMs: null }
          gateLatencyEl.textContent = latency.sampleCount > 0
            ? t('gate.latency', { median: String(Math.round(latency.medianMs)), max: String(Math.round(latency.maxMs)), n: String(latency.sampleCount) })
            : t('gate.latency.none')

          var families = gate.byCommandFamily || []
          if (families.length === 0) {
            gateByFamilyEl.innerHTML = '<p class="empty-line">' + esc(t('gate.byFamilyEmpty')) + '</p>'
          } else {
            var familyRows = families.map(function (f) {
              var v = f.byVerdict || { allow: 0, ask: 0, deny: 0 }
              return '<tr><td>' + esc(f.commandFamily) + '</td><td>' + esc(f.total) + '</td><td>' + esc(v.allow || 0) + '</td><td>' + esc(v.ask || 0) + '</td><td>' + esc(v.deny || 0) + '</td></tr>'
            }).join('')
            gateByFamilyEl.innerHTML = '<table><thead><tr><th>' + esc(t('gate.tableFamily')) + '</th><th>' + esc(t('gate.tableTotal')) + '</th><th>' + esc(t('gate.tableAllowed')) + '</th><th>' + esc(t('gate.tableAsked')) + '</th><th>' + esc(t('gate.tableBlocked')) + '</th></tr></thead><tbody>' + familyRows + '</tbody></table>'
          }
        }

        // ---- lo que respondio la persona cuando el gate la detuvo, y lo que
        // esa respuesta dice sobre el techo -- ceilingEvidence() (approval_
        // record.ts) nunca inventa un numero: si aprobaciones y rechazos se
        // superponen, o falta evidencia de un lado, suggestedCeiling es null
        // y esta seccion explica por que en vez de mostrar un guion. -------
        var approvalsHaveData = (approvals.asked || 0) > 0
        if (!approvalsHaveData) {
          approvalsEmptyEl.style.display = ''
          approvalsEmptyEl.textContent = t('approvals.empty')
          approvalsGridEl.innerHTML = ''
          approvalsCeilingEl.innerHTML = ''
        } else {
          approvalsEmptyEl.style.display = 'none'
          approvalsGridEl.innerHTML = [
            statTile(approvals.asked || 0, t('approvals.asked')),
            statTile(approvals.approved || 0, t('approvals.approved')),
            statTile(approvals.rejected || 0, t('approvals.rejected')),
            statTile(approvals.unresolved || 0, t('approvals.unresolved'))
          ].join('')

          var ceiling = approvals.ceiling || { highestApproved: null, lowestRejected: null, band: null, suggestedCeiling: null, approvedCount: 0, rejectedCount: 0 }
          if (ceiling.suggestedCeiling != null) {
            approvalsCeilingEl.innerHTML = '<div class="stat-grid">' + [
              statTile(ceiling.highestApproved, t('approvals.highestApproved')),
              statTile(ceiling.lowestRejected, t('approvals.lowestRejected')),
              statTile(ceiling.band, t('approvals.band')),
              statTile(ceiling.suggestedCeiling, t('approvals.suggestedCeiling'))
            ].join('') + '</div><p class="empty-line" style="margin-top:8px">' +
              esc(t('approvals.evidenceCount', { approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0) })) + '</p>'
          } else if ((ceiling.approvedCount || 0) === 0 || (ceiling.rejectedCount || 0) === 0) {
            approvalsCeilingEl.innerHTML = '<p class="empty-line">' + esc(t('approvals.noSuggestionInsufficient', {
              approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
            })) + '</p>'
          } else {
            approvalsCeilingEl.innerHTML = '<p class="empty-line">' + esc(t('approvals.noSuggestionOverlap', {
              highest: String(ceiling.highestApproved), lowest: String(ceiling.lowestRejected),
              approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
            })) + '</p>'
          }
        }

        // Por proyecto: combina gate y skills en una tabla simple.
        var projects = {}
        ;(gate.byProject || []).forEach(function (p) { var k = projectLabel(p.project); projects[k] = projects[k] || {}; projects[k].gate = p.total })
        ;(mod.byProject || []).forEach(function (p) { var k = projectLabel(p.key); projects[k] = projects[k] || {}; projects[k].skills = p.count })
        var projectKeys = Object.keys(projects).sort(function (a, b) {
          var ta = (projects[a].gate || 0) + (projects[a].skills || 0)
          var tb = (projects[b].gate || 0) + (projects[b].skills || 0)
          return tb - ta
        })
        if (projectKeys.length === 0) {
          byProjectEl.innerHTML = '<p class="empty-line">' + esc(t('stats.byProjectEmpty')) + '</p>'
        } else {
          var rows = projectKeys.map(function (key) {
            return '<tr><td>' + esc(key) + '</td><td>' + esc(projects[key].gate || 0) + '</td><td>' + esc(projects[key].skills || 0) + '</td></tr>'
          }).join('')
          byProjectEl.innerHTML = '<table><thead><tr><th>' + esc(t('stats.tableProject')) + '</th><th>' + esc(t('stats.byProjectGate')) + '</th><th>' + esc(t('stats.byProjectSkills')) + '</th></tr></thead><tbody>' + rows + '</tbody></table>'
        }

        // Ultimas decisiones del gate.
        var recent = gate.recent || []
        if (recent.length === 0) {
          recentEl.innerHTML = '<p class="empty-line">' + esc(t('stats.recentEmpty')) + '</p>'
        } else {
          var sourceLabel = { 'local-rule': t('stats.recentLocalRule'), cache: t('stats.recentCached'), jev: t('stats.recentJev') }
          recentEl.innerHTML = recent.map(function (r) {
            var latency = r.latencyMs != null ? ' · ' + r.latencyMs + 'ms' : ''
            return '<div class="item" style="padding:6px 0"><div class="line1">' +
              '<span class="worktree">' + esc(projectLabel(r.project)) + '</span>' +
              '<span class="tag">' + esc(r.commandFamily || '') + '</span>' +
              '<span class="tag">' + esc(sourceLabel[r.source] || esc(r.source)) + latency + '</span>' +
              '<span class="' + tagClass(r.verdict === 'deny' ? 'blocked' : (r.verdict === 'ask' ? 'working' : 'done')) + '">' + esc(r.verdict || '') + '</span>' +
              '<span class="when">' + when(r.at) + '</span></div></div>'
          }).join('')
        }
      }

      // ---------- render: live board -----------------------------------------
      function tagClass (state) {
        if (state === 'done') return 'tag done'
        if (state === 'working') return 'tag working'
        if (state === 'blocked') return 'tag blocked'
        return 'tag'
      }
      function when (iso) {
        var ms = Date.parse(String(iso || ''))
        if (!ms) return esc(iso)
        try { return new Date(ms).toLocaleString() } catch (error) { return esc(iso) }
      }

      var lastBoard = null
      function render (board) {
        lastBoard = board
        var entries = (board && Array.isArray(board.entries)) ? board.entries.slice() : []
        // "Quien necesita algo" antes que el conteo: no-terminado primero,
        // y entre los no-terminados el que lleva mas tiempo esperando.
        entries.sort(function (a, b) {
          var aDone = a && a.state === 'done' ? 1 : 0
          var bDone = b && b.state === 'done' ? 1 : 0
          if (aDone !== bDone) return aDone - bDone
          return (a && a.receivedAt || 0) - (b && b.receivedAt || 0)
        })

        if (!entries.length) {
          cardsEl.innerHTML = '<p class="empty">' + esc(t('live.empty')) + '</p>'
          statusEl.textContent = ''
          return
        }

        cardsEl.innerHTML = entries.map(function (entry) {
          var label = entry.project
            ? esc(entry.project) + (entry.rama ? ' · ' + esc(entry.rama) : '')
            : esc(t('live.unknownWorktree'))
          return '<div class="item"><div class="line1">' +
            '<span class="worktree">' + label + '</span>' +
            '<span class="' + tagClass(entry.state) + '">' + esc(entry.state || '?') + '</span>' +
            '<span class="when">' + when(entry.updatedAt) + '</span></div>' +
            '<div class="pane">' + esc(entry.paneKey || '') + '</div>' +
            '</div>'
        }).join('')
        statusEl.textContent = t('live.agentsCount', { n: String(entries.length) })
      }

      function reload (usuario) {
        return Promise.all([
          read('board', usuario),
          read('measurementsSummary', usuario)
        ]).then(function (results) {
          noteEl.textContent = ''
          render(results[0] || { entries: [] })
          renderStats(results[1])
        }).catch(function (error) {
          noteEl.className = 'meta nota stale'
          noteEl.textContent = String(error && error.message || error)
        })
      }

      var timer = null
      function startPolling () {
        if (timer) return
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload(false)
        }, 8000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reload(false); startPolling() } else if (timer) {
          clearInterval(timer); timer = null
        }
      })
      window.addEventListener('focus', function () { reload(false) })

      el('refresh').addEventListener('click', function (event) {
        var b = event.currentTarget
        b.disabled = true
        statusEl.textContent = t('live.updating')
        Promise.resolve(reload(true)).then(function () {
          setTimeout(function () { b.disabled = false }, 400)
        })
      })

      // Orca's language decides; see the note in config.html.
      Promise.resolve().then(function () {
        applyStaticI18n()
        return reload(true)
      }).then(startPolling)
    </script>
  </body>
</html>

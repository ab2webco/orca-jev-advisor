<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advisor</title>
    <!--
      Every user-facing string here comes from CATALOG (es/en) below, by
      key -- see panels/config.html's <head> comment for why this is not
      Orca's own `contributes.languagePacks` (verified in orca-oss:
      I18nProvider.tsx only applies a plugin's pack when
      uiLanguage === pack.id -- it replaces Orca's whole UI language, not
      one plugin's own panel). The language choice is shared with
      config.html through the same `localeStatus`/`localeRequest` keys.

      Numbers on this panel are never invented: every one comes from
      counting entries in the JSONL logs main.mjs's read-measurements.mjs
      aggregates (adapters/claude/gate-bash.ts's, adapters/claude/mod-skills'
      and adapters/claude/gate-outcome.ts's). Nothing here estimates a saved
      dollar, a saved token, or how long a deliberation would have taken --
      none of that is measured anywhere in this plugin.

      The approvals section is the same rule applied to a suggested number:
      src/core/approval_record.ts's ceilingEvidence() returns null, not a
      guess, whenever approvals and rejections overlap or one side has no
      evidence yet -- and this panel renders that null as an honest sentence
      explaining why, never as a blank dash.
    -->
    <style>
      /* El host inyecta una lista corta de tokens en el <style> del shell
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts)
         y pone light/dark en <html>. Nada mas llega aca: ni utilidades de Tailwind,
         ni la tipografia de la app. Los respaldos son los valores reales de
         main.css, no un gris inventado, para que el panel se lea bien incluso
         cuando el host no inyecta nada (host viejo, o el arnes de pruebas). */
      :root {
        color-scheme: light dark;
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717; --fb-primary-foreground: #fafafa;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-ring: #a1a1a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5; --fb-primary-foreground: #171717;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-ring: #737373;
        }
      }
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 0 0 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; margin: 0 0 8px; padding: 8px 12px;
        border-bottom: 1px solid var(--border, var(--fb-border));
      }
      header .meta { margin-left: auto; }
      header button {
        font: inherit; font-size: 13px; line-height: 1; padding: 3px 8px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md);
        background: var(--secondary, var(--fb-secondary));
        color: var(--muted-foreground, var(--fb-muted-foreground));
        transition: background-color 90ms ease, color 90ms ease;
      }
      header button:hover { background: var(--accent, var(--fb-accent));
                            color: var(--accent-foreground, var(--fb-accent-foreground)); }
      header button:active { transform: translateY(1px); }
      header button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      header button[disabled] { opacity: 0.5; cursor: default; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .meta { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .nota { margin: 0 0 8px; padding: 0 12px; }
      .nota:empty { display: none; }

      section { padding: 10px 12px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           margin: 0 0 8px; font-weight: 600; }
      .empty-line { color: var(--muted-foreground, var(--fb-muted-foreground)); font-size: 12px; }
      .divider { border-top: 1px solid var(--border, var(--fb-border)); margin-top: 4px; }

      .item { padding: 8px 12px; border-bottom: 1px solid var(--border, var(--fb-border)); }
      .item:last-child { border-bottom: 0; }
      .line1 { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
      .worktree { font-weight: 500; word-break: break-all; }
      .pane { color: var(--muted-foreground, var(--fb-muted-foreground)); font-size: 11px; word-break: break-all; }
      .when { margin-left: auto; color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; white-space: nowrap; }
      .tag { font-size: 10px; border: 1px solid var(--border, var(--fb-border));
             border-radius: 9999px; padding: 0 6px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Sin tono propio de exito/alerta -- la allowlist no lo tiene. `done`
         y `working` se apoyan en --accent (superficie de enfasis), `blocked`
         en --destructive (el unico rojo disponible), y todo lo demas en el
         filete neutro, igual que hace activity.html con sus tres etiquetas. */
      .tag.done { background: var(--accent, var(--fb-accent));
                  color: var(--accent-foreground, var(--fb-accent-foreground));
                  border-color: transparent; font-weight: 600; }
      .tag.working { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      .tag.blocked { color: var(--destructive, var(--fb-destructive)); border-style: dashed; }
      .empty { color: var(--muted-foreground, var(--fb-muted-foreground)); padding: 8px 12px; }
      .stale { color: var(--destructive, var(--fb-destructive)); }

      /* ---- charts ---------------------------------------------------
         No chart library reaches this iframe (opaque origin, no network,
         and the shell injects only PANEL_DESIGN_TOKEN_ALLOWLIST), so every
         chart below is plain boxes sized by percentage. That is not a
         downgrade: percentages reflow at 320px without a layout engine,
         and painting them with the host's own tokens means they follow the
         theme for free.

         The palette is a three-step neutral ramp plus the single red the
         allowlist carries. Deliberately not a rainbow: --primary,
         --muted-foreground and --ring are the only three neutrals that
         stay distinguishable in BOTH themes (light #171717/#737373/#a1a1a1,
         dark #e5e5e5/#a1a1a1/#737373). A fourth invented hue would look
         right here and wrong in somebody else's Orca. */
      .v1 { --viz: var(--primary, var(--fb-primary)); }
      .v2 { --viz: var(--muted-foreground, var(--fb-muted-foreground)); }
      .v3 { --viz: var(--ring, var(--fb-ring)); }
      .vd { --viz: var(--destructive, var(--fb-destructive)); }

      .cards { display: grid; gap: 10px; grid-template-columns: 1fr; padding: 10px 12px; }
      @media (min-width: 720px) { .cards { grid-template-columns: 1fr 1fr; } .card.wide { grid-column: 1 / -1; } }
      .card {
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md); padding: 10px 12px; min-width: 0;
      }
      .card > h2 { margin: 0 0 8px; }

      .kpi { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
      .kpi-n { font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em;
               font-variant-numeric: tabular-nums; }
      .kpi-unit { font-size: 12px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .kpi-sub { margin: 4px 0 10px; font-size: 12px;
                 color: var(--muted-foreground, var(--fb-muted-foreground)); }

      /* Stacked proportion bar. A 0-count segment renders nothing at all
         rather than a hairline nobody can read or click. */
      .bar { display: flex; height: 10px; border-radius: 9999px; overflow: hidden;
             background: var(--secondary, var(--fb-secondary)); }
      .bar .seg { background: var(--viz); min-width: 2px; }
      .bar .seg + .seg { box-shadow: inset 1px 0 0 var(--background, var(--fb-background)); }

      .legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
      .legend li { display: flex; align-items: baseline; gap: 6px; font-size: 12px; min-width: 0; }
      .legend .sw { width: 8px; height: 8px; border-radius: 2px; background: var(--viz); flex: none; }
      .legend .lv { font-weight: 600; font-variant-numeric: tabular-nums; }
      .legend .ll { color: var(--muted-foreground, var(--fb-muted-foreground));
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .legend .lp { margin-left: auto; color: var(--muted-foreground, var(--fb-muted-foreground));
                    font-variant-numeric: tabular-nums; flex: none; }

      /* Horizontal bars: label, track, value. The label column is capped
         so one long project path cannot squeeze every bar to nothing. */
      .hrows { display: grid; gap: 6px; }
      .hrow { display: grid; grid-template-columns: minmax(0, 7.5em) 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
      @media (min-width: 720px) { .hrow { grid-template-columns: minmax(0, 16em) 1fr auto; } }
      .hrow .hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .htrack { background: var(--secondary, var(--fb-secondary)); border-radius: 9999px; height: 8px; overflow: hidden; }
      .hfill { display: block; height: 100%; background: var(--viz); border-radius: 9999px; min-width: 2px; }
      .hv { font-variant-numeric: tabular-nums; color: var(--muted-foreground, var(--fb-muted-foreground)); }

      /* Speed comparison: two bars on one shared axis, so the gap is the
         thing you see first and the milliseconds only confirm it. */
      .cmp { display: grid; gap: 8px; }
      .cmp-row { display: grid; gap: 3px; }
      .cmp-head { display: flex; gap: 8px; align-items: baseline; font-size: 12px; min-width: 0; }
      .cmp-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cmp-val { margin-left: auto; font-variant-numeric: tabular-nums; flex: none; }
      .cmp-track { background: var(--secondary, var(--fb-secondary)); border-radius: var(--radius-md); height: 16px; overflow: hidden; }
      .cmp-fill { display: block; height: 100%; background: var(--viz); border-radius: var(--radius-md); min-width: 3px; }
      .cmp-foot { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); margin: 2px 0 0; }
      .verdict-chip { font-variant-numeric: tabular-nums; }

      /* ---- the four questions ------------------------------------------
         Status strip, toll, interventions, calibration -- in that order in
         the DOM, which is also the reading order at every width. From
         1100px the interventions table takes the right column beside toll
         and calibration, so all four fit in a 1440x900 viewport without
         scrolling. Everything else sits below them. */
      .windows { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 12px 8px; }
      .windows button {
        font: inherit; font-size: 12px; line-height: 1; padding: 5px 10px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border)); border-radius: 9999px;
        background: transparent; color: var(--muted-foreground, var(--fb-muted-foreground));
      }
      .windows button[aria-pressed="true"] {
        background: var(--primary, var(--fb-primary)); color: var(--primary-foreground, var(--fb-primary-foreground));
        border-color: transparent; font-weight: 600;
      }
      .windows button[disabled] { opacity: 0.45; cursor: default; }
      .windows button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      .windows .meta { flex-basis: 100%; }

      .strip { margin: 0 12px; padding: 8px 12px; border: 1px solid var(--border, var(--fb-border));
               border-radius: var(--radius-md); }
      .strip > h2 { margin: 0 0 6px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { font-size: 12px; border: 1px solid var(--border, var(--fb-border)); border-radius: 9999px;
              padding: 2px 9px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
      .chip.alarm { color: var(--destructive, var(--fb-destructive)); border-color: currentColor; font-weight: 600; }
      .chip b { font-weight: 600; }

      .top { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); padding: 10px 12px 0; }
      @media (min-width: 1100px) {
        /* auto then 1fr: the table spans both rows, and without this its
           height is split across them, opening a gap under the toll card. */
        .top { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
               grid-template-rows: auto 1fr;
               grid-template-areas: "toll interv" "calib interv"; align-items: start; }
        #card-toll { grid-area: toll; }
        #card-interventions { grid-area: interv; }
        #card-calibration { grid-area: calib; }
      }

      .itable { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px;
                font-variant-numeric: tabular-nums; }
      .itable th { font-weight: 600; text-align: right; padding: 0 0 4px 6px; font-size: 11px;
                   color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .itable th:first-child, .itable td:first-child { text-align: left; padding-left: 0; }
      .itable td { text-align: right; padding: 3px 0 3px 6px; border-top: 1px solid var(--border, var(--fb-border)); }
      .itable td:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .itable col.n { width: 5.2em; }
      .itable th { white-space: nowrap; }
      .itable .deny { color: var(--destructive, var(--fb-destructive)); font-weight: 600; }
      .itable .zero { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .itable tr.agg td { color: var(--muted-foreground, var(--fb-muted-foreground)); font-style: italic; }

      .recent-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      .recent-list li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 12px; }
      .live-list { display: grid; gap: 6px; }
      .live-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
      .live-row .name { font-weight: 600; overflow-wrap: anywhere; }

      /* The honesty card. Same border as the rest -- it is not a warning,
         it is the part of the panel that says what these numbers do not
         cover, and it should read as ordinary content, not an alarm. */
      .unmeasured { margin: 0; padding-left: 1.1em; display: grid; gap: 4px;
                    font-size: 12px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .unmeasured li { padding-left: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Advisor</h1>
      <span class="meta" id="status"></span>
      <button id="refresh" data-i18n-title="board.refresh" data-i18n-aria="board.refresh">&#8635;</button>
    </header>
    <p class="meta nota" id="note"></p>

    <nav class="windows" id="windows" data-i18n-aria="window.label">
      <button type="button" data-window="version"></button>
      <button type="button" data-window="day" data-i18n="window.day"></button>
      <button type="button" data-window="week" data-i18n="window.week"></button>
      <button type="button" data-window="all" data-i18n="window.all"></button>
      <span class="meta" id="window-note"></span>
    </nav>

    <section class="card wide" id="card-empty" style="display:none;margin:0 12px">
      <h2 data-i18n="empty.heading"></h2>
      <p class="empty-line" id="empty-body" style="margin:0"></p>
    </section>

    <section class="strip" id="card-status">
      <h2 data-i18n="status.heading"></h2>
      <div class="chips" id="status-body"></div>
    </section>

    <div class="top" id="top">
      <section class="card" id="card-toll">
        <h2 data-i18n="toll.heading"></h2>
        <div id="toll-body"></div>
      </section>

      <section class="card" id="card-interventions">
        <h2 data-i18n="interv.heading"></h2>
        <div id="interventions-body"></div>
      </section>

      <section class="card" id="card-calibration">
        <h2 data-i18n="approvals.heading"></h2>
        <div id="approvals-body"></div>
      </section>
    </div>

    <div class="cards">
      <section class="card wide" id="card-recent">
        <h2 data-i18n="stats.recentHeading"></h2>
        <div id="stats-recent"></div>
      </section>

      <section class="card wide" id="card-live">
        <h2 data-i18n="live.heading"></h2>
        <div id="cards"><p class="empty" data-i18n="live.loading"></p></div>
      </section>

      <section class="card wide" id="card-speed">
        <h2 data-i18n="speed.heading"></h2>
        <div id="speed-empty" class="empty-line" style="display:none"></div>
        <div id="speed-body"></div>
      </section>

      <section class="card" id="card-projects">
        <h2 data-i18n="stats.byProjectHeading"></h2>
        <div id="projects-body"></div>
      </section>

      <section class="card" id="card-skills">
        <h2 data-i18n="skills.heading"></h2>
        <div id="skills-body"></div>
      </section>

      <section class="card wide" id="card-unmeasured">
        <h2 data-i18n="unmeasured.heading"></h2>
        <ul class="unmeasured" id="unmeasured-body"></ul>
      </section>
    </div>

    <script>
      'use strict'

      var el = function (id) { return document.getElementById(id) }
      var cardsEl = el('cards')
      var statusEl = el('status')
      var noteEl = el('note')

      // ---------- catalogo de idioma (es/en) --------------------------------
      var CATALOG = {
        es: {
          'window.label': 'Ventana de tiempo',
          'window.version': 'Esta versión ({{v}})',
          'window.versionNone': 'Esta versión',
          'window.versionUnavailable': 'Ningún registro de decisión lleva todavía la versión del plugin, así que no hay vista por versión.',
          'window.day': '24 h',
          'window.week': '7 días',

          'window.emptyWindow': 'Sin decisiones en esta ventana. Elige una más amplia.',
          'empty.heading': 'Todavía no hay nada medido',

          'status.heading': '¿Funciona el gate?',

          'interv.heading': '¿Dónde interviene?',

          'stats.listingChars': 'Caracteres de listado no enviados',
          'stats.byProjectHeading': 'Por proyecto (todo el registro)',
          'stats.byProjectEmpty': 'Sin datos todavía.',
          'stats.recentHeading': 'Últimas decisiones del gate',
          'stats.recentEmpty': 'Sin decisiones todavía.',
          'stats.recentCached': 'caché',
          'stats.recentLocalRule': 'regla local',
          'stats.recentJev': 'jev',
          'stats.recentNone': 'sin respuesta',
          'stats.na': 'sin datos suficientes',
          'stats.unknownProject': '(proyecto desconocido)',
          'gate.source.localRule': 'Regla local (~1ms, sin red)',
          'gate.source.cache': 'Caché (sin red)',
          'gate.source.jev': 'Jev (con red)',
          'gate.source.none': 'Nadie: Jev no contestó',
          'load.unjudged': '{{n}} comando(s) pasaron sin juicio: se le preguntó a Jev y no contestó. El comando siguió su curso -- fallar abierto es lo correcto -- pero nadie lo revisó, así que no cuentan arriba.',
          'approvals.heading': '¿Cómo va la calibración?',
          'approvals.empty': 'El gate todavía no ha detenido ningún comando. Esta sección se llena la próxima vez que se pregunte y la persona responda.',
          'approvals.approved': 'Aprobadas',
          'approvals.rejected': 'Rechazadas',
          // odd/tasks/production-honesty-pass.md P7: renombrado desde
          // "Sin responder" -- la mayoría de estas, ahora que nueve reglas
          // rechazan directo, son comandos que el gate bloqueó y que nunca
          // llegaron a correr (el freno funcionó), no personas que
          // ignoraron una pregunta. Ver approvals.notRunHint: es una
          // clasificación, no un hecho -- una sesión que se cerró después
          // de correr el comando deja el mismo rastro.
          'approvals.notRun': 'No corrió',
          'approvals.notRunHint': 'No corrió: sin respuesta cuando venció la espera. La mayoría son comandos que el gate rechazó directo y que nunca llegaron a ejecutarse -- el freno funcionó -- pero una sesión que se cerró justo después de correr el comando deja el mismo rastro. Es una clasificación, no un hecho confirmado.',
          'approvals.highestApproved': 'Más alto aprobado',
          'approvals.lowestRejected': 'Más bajo rechazado',

      }
      /**
       * The language Orca is running in.
       *
       * Orca substitutes the resolved UI locale into the panel shell's
       * `<html lang>`, so the plugin no longer has to ask a question the
       * user already answered in Orca's own settings. Anything this plugin
       * has no catalog for falls back to English.
       */
      function localeFromOrca () {
        var tag = (document.documentElement.getAttribute('lang') || '').toLowerCase()
        return tag.indexOf('es') === 0 ? 'es' : 'en'
      }

      var currentLocale = localeFromOrca()
      function t (key, params) {
        var template = (CATALOG[currentLocale] && CATALOG[currentLocale][key]) || CATALOG.es[key] || key
        if (!params) return template
        return template.replace(/\{\{(\w+)\}\}/g, function (_m, name) {
          return Object.prototype.hasOwnProperty.call(params, name) ? params[name] : ''
        })
      }
      function applyStaticI18n () {
        document.querySelectorAll('[data-i18n]').forEach(function (node) { node.textContent = t(node.getAttribute('data-i18n')) })
        document.querySelectorAll('[data-i18n-title]').forEach(function (node) { node.title = t(node.getAttribute('data-i18n-title')) })
        document.querySelectorAll('[data-i18n-aria]').forEach(function (node) { node.setAttribute('aria-label', t(node.getAttribute('data-i18n-aria'))) })
      }

      // ---------- puente real con el host --------------------------------
      // El panel corre en un iframe sandboxed de origen opaco: sin peticiones
      // externas, el unico canal es postMessage con el frame padre
      // (orca-oss src/shared/plugins/plugin-panel-bridge.ts). '*' es el unico
      // targetOrigin usable porque el origen del iframe es opaco; el host
      // valida la ventana que lo manda.
      //
      // El host admite un cupo de mensajes por ventana y contesta
      // `rate_limited` al resto (PANEL_MESSAGE_RATE_LIMIT en el mismo
      // archivo). Este panel solo hace lecturas -sondeo cada 8 s mas el clic
      // manual-, asi que la cola solo necesita distinguir "esto lo pidio la
      // persona" (prioridad, reintento) de "esto es sondeo de fondo" (se dej
      // caer y la vuelta siguiente lo vuelve a pedir), tal como wa-inbox
      // config.html lo resuelve para sus quince claves, simplificado a una.
      var seq = 0
      var pending = {}
      var CUPO = { max: 30, ventanaMs: 10000, reserva: 4 }
      var gastados = []
      var cola = []
      var colaTimer = null
      var frenoHasta = 0
      var RECHAZADO = { ok: false, errorCode: 'rate_limited' }

      function hayLugarDeSondeo () {
        var corte = Date.now() - CUPO.ventanaMs
        while (gastados.length && gastados[0] <= corte) gastados.shift()
        return gastados.length < CUPO.max - CUPO.reserva
      }
      function proximoHueco () {
        var ahora = Date.now()
        if (cola[0] && cola[0].usuario) return Math.max(60, (cola[0].desde || 0) - ahora)
        var falta = frenoHasta - ahora
        if (gastados.length) falta = Math.max(falta, gastados[0] + CUPO.ventanaMs - ahora)
        return Math.max(60, Math.min(falta, CUPO.ventanaMs))
      }
      function despachar (it) {
        var requestId = 'req-' + (++seq)
        pending[requestId] = function (d) {
          if (!(d && d.errorCode === 'rate_limited')) { it.resolve(d); return }
          frenoHasta = Date.now() + 1000
          if (!it.usuario || Date.now() >= it.vence) { it.resolve(d); return }
          it.espera = Math.min((it.espera || 300) * 2, 2500)
          it.desde = Date.now() + it.espera
          encolar(it)
        }
        window.parent.postMessage(
          { type: 'orca-panel-action', requestId: requestId, action: it.action, params: it.params }, '*')
      }
      function drenar () {
        if (colaTimer) { clearTimeout(colaTimer); colaTimer = null }
        var ahora = Date.now()
        while (cola.length) {
          var it = cola[0]
          if (it.vence <= ahora) { cola.shift(); it.resolve(RECHAZADO); continue }
          if (it.usuario ? (it.desde || 0) > ahora : (ahora < frenoHasta || !hayLugarDeSondeo())) break
          cola.shift()
          if (!it.usuario) gastados.push(ahora)
          despachar(it)
        }
        if (cola.length) colaTimer = setTimeout(drenar, proximoHueco())
      }
      function encolar (it) {
        var i = cola.length
        if (it.usuario) { i = 0; while (i < cola.length && cola[i].usuario) i++ }
        cola.splice(i, 0, it)
        drenar()
      }
      function call (action, params, usuario) {
        return new Promise(function (resolve) {
          encolar({
            action: action, params: params, usuario: !!usuario,
            vence: Date.now() + (usuario ? 30000 : 12000), resolve: resolve
          })
        })
      }
      window.addEventListener('message', function (event) {
        var d = event.data
        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // storage.get devuelve { value: <dato> } y el bridge lo envuelve otra vez.
      function stored (result) {
        if (!result || !result.ok || !result.value) return null
        return result.value.value === undefined ? null : result.value.value
      }
      function read (key, usuario) { return call('storage.get', { key: key }, usuario).then(stored) }

      // ---------- worker liveness: heartbeat ----------------------------------
      // Mirrors main.mjs's WORKER_HEARTBEAT_KEY/WORKER_HEARTBEAT_STALE_MS and
      // isHeartbeatFresh -- see the tested original at
      // adapters/orca/panels/worker-status.mjs (and config.html's own copy)
      // for why this is a hand-copy rather than an import.
      var WORKER_HEARTBEAT_KEY = 'workerHeartbeat'
      var WORKER_HEARTBEAT_STALE_MS = 40 * 1000
      function isHeartbeatFresh (heartbeat, nowMs, staleAfterMs) {
        if (!heartbeat || typeof heartbeat !== 'object' || typeof heartbeat.at !== 'string') return false
        var at = Date.parse(heartbeat.at)
        if (isNaN(at)) return false
        var age = nowMs - at
        return age >= 0 && age <= staleAfterMs
      }

      // This panel only reads. The locale mirror for the gate and the skills
      // mod is written by config.html alone; both panels doing it would race
      // for no gain, so there is no storage.set helper here.
      // ---------- render: stats ---------------------------------------------
      function esc (text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }
      function pct (fraction) {
        return fraction === null || fraction === undefined ? null : Math.round(fraction * 1000) / 10
      }
      /** null/undefined-safe project label -- a record whose project could
       *  not be resolved (gate-bash.ts's own projectName() returning null)
       *  is still shown, honestly, never silently dropped. */
      function projectLabel (project) {
        return (project === null || project === undefined || project === '') ? t('stats.unknownProject') : String(project)
      }

      // ---------- chart primitives -------------------------------------
      // Every one of these takes numbers that were counted and returns
      // markup. None of them invents, rounds up, or fills a gap: a series
      // with no samples returns '' and its caller shows a sentence saying
      // why, which is the same rule the ceiling section has followed since
      // approval_record.ts's ceilingEvidence() started returning null.

      function num (value) {
        return (typeof value === 'number' && isFinite(value)) ? value.toLocaleString() : '—'
      }
      function share (part, total) {
        return total > 0 ? Math.round((part / total) * 1000) / 10 : 0
      }
      function ms (value) {
        return (typeof value === 'number' && isFinite(value)) ? Math.round(value).toLocaleString() : '—'
      }

      /** segments: [{ value, cls, label }]. A zero segment is dropped
       *  entirely -- a 0%-wide sliver is unreadable and would still take a
       *  legend row and a hairline of colour, implying something is there. */
      function stackedBar (segments, total) {
        var drawn = segments.filter(function (s) { return s.value > 0 })
        if (drawn.length === 0 || total <= 0) return ''
        var label = drawn.map(function (s) { return s.label + ': ' + num(s.value) }).join(', ')
        return '<div class="bar" role="img" aria-label="' + esc(label) + '">' +
          drawn.map(function (s) {
            return '<span class="seg ' + s.cls + '" style="width:' + share(s.value, total) + '%"></span>'
          }).join('') + '</div>'
      }

      function legendList (segments, total) {
        var drawn = segments.filter(function (s) { return s.value > 0 })
        if (drawn.length === 0) return ''
        return '<ul class="legend">' + drawn.map(function (s) {
          return '<li class="' + s.cls + '"><i class="sw"></i>' +
            '<span class="lv">' + esc(num(s.value)) + '</span>' +
            '<span class="ll">' + esc(s.label) + '</span>' +
            '<span class="lp">' + share(s.value, total) + '%</span></li>'
        }).join('') + '</ul>'
      }

      /** rows: [{ label, value }]. Bars are scaled against the largest row,
       *  not against the total, so the shape of the tail stays visible when
       *  one family dwarfs the rest. */
      function hbars (rows, cls) {
        if (!rows || rows.length === 0) return ''
        var max = rows.reduce(function (m, r) { return Math.max(m, r.value || 0) }, 0)
        if (max <= 0) return ''
        return '<div class="hrows">' + rows.map(function (r) {
          return '<div class="hrow ' + (cls || 'v1') + '">' +
            '<span class="hl" title="' + esc(r.label) + '">' + esc(r.label) + '</span>' +
            '<span class="htrack"><span class="hfill" style="width:' + share(r.value, max) + '%"></span></span>' +
            '<span class="hv">' + esc(num(r.value)) + '</span></div>'
        }).join('') + '</div>'
      }

      /** rows: [{ name, valueMs, cls }] on one shared axis. */
      function compareBars (rows) {
        var usable = rows.filter(function (r) { return typeof r.valueMs === 'number' && isFinite(r.valueMs) })
        if (usable.length === 0) return ''
        var max = usable.reduce(function (m, r) { return Math.max(m, r.valueMs) }, 0)
        if (max <= 0) return ''
        return '<div class="cmp">' + usable.map(function (r) {
          return '<div class="cmp-row ' + r.cls + '">' +
            '<div class="cmp-head"><span class="cmp-name" title="' + esc(r.name) + '">' + esc(r.name) + '</span>' +
            '<span class="cmp-val">' + esc(t('speed.median', { ms: ms(r.valueMs) })) + '</span></div>' +
            '<span class="cmp-track"><span class="cmp-fill" style="width:' + share(r.valueMs, max) + '%"></span></span>' +
            '</div>'
        }).join('') + '</div>'
      }

      function line (text, cls) {
        return '<p class="' + (cls || 'cmp-foot') + '">' + esc(text) + '</p>'
      }

      var lastStats = null

      /** Shows `body`, or hides it and shows `emptyText` in its place.
       *  Every card on this board goes through here so that "nothing yet"
       *  can never be rendered as a zero. */
      function fill (bodyId, emptyId, markup, emptyText) {
        var bodyEl = el(bodyId)
        var emptyEl = emptyId ? el(emptyId) : null
        if (markup) {
          bodyEl.innerHTML = markup
          if (emptyEl) { emptyEl.style.display = 'none'; emptyEl.textContent = '' }
          return
        }
        bodyEl.innerHTML = ''
        if (emptyEl) { emptyEl.style.display = ''; emptyEl.textContent = emptyText || '' }
        else bodyEl.innerHTML = '<p class="empty-line">' + esc(emptyText || '') + '</p>'
      }

      // ---------- board helpers --------------------------------------------
      // Hand-copied from adapters/orca/panels/panel_values.mjs (tested there),
      // converted to ES5 -- `grep -n defaultWindowKey` across both files is
      // how to check the copies still agree.
      function defaultWindowKey (windows) {
        if (!windows) return 'all'
        var order = ['version', 'week', 'all']
        for (var i = 0; i < order.length; i++) {
          var w = windows[order[i]]
          if (w && w.available && w.totalDecisions > 0) return order[i]
        }
        return 'all'
      }
      function relativeAge (iso, nowMs) {
        if (typeof iso !== 'string') return null
        var at = Date.parse(iso)
        if (isNaN(at)) return null
        var seconds = Math.floor((nowMs - at) / 1000)
        if (seconds < 60) return { unit: 'now', n: 0 }
        var minutes = Math.floor(seconds / 60)
        if (minutes < 60) return { unit: 'min', n: minutes }
        var hours = Math.floor(minutes / 60)
        if (hours < 24) return { unit: 'h', n: hours }
        return { unit: 'd', n: Math.floor(hours / 24) }
      }
      function liveEntryView (entry) {
        var e = entry || {}
        function present (value) { return (typeof value === 'string' && value.length > 0) ? value : null }
        return {
          name: present(e.project),
          branch: present(e.rama),
          title: [present(e.worktreeId), present(e.paneKey)].filter(function (part) { return part !== null }).join(' · ')
        }
      }

      /** "4 min ago", or '' when the timestamp cannot be read -- never "NaN". */
      function ago (iso) {
        var age = relativeAge(iso, Date.now())
        return age ? t('age.' + age.unit, { n: String(age.n) }) : ''
      }

      // ---------- window picker ----------------------------------------------
      // null until the person picks one; until then the board follows
      // defaultWindowKey, so a log that gains a stamped version moves the
      // default along with it instead of freezing whatever loaded first.
      var chosenWindow = null
      function activeWindowKey (windows) {
        if (chosenWindow && windows && windows[chosenWindow] && windows[chosenWindow].available) return chosenWindow
        return defaultWindowKey(windows)
      }
      function renderWindowPicker (windows, activeKey) {
        var version = windows && windows.version
        var versionAvailable = !!(version && version.available)
        var buttons = el('windows').querySelectorAll('button[data-window]')
        for (var i = 0; i < buttons.length; i++) {
          var b = buttons[i]
          var key = b.getAttribute('data-window')
          if (key === 'version') {
            b.textContent = versionAvailable ? t('window.version', { v: version.pluginVersion }) : t('window.versionNone')
            b.disabled = !versionAvailable
            b.title = versionAvailable ? '' : t('window.versionUnavailable')
          } else {
            b.disabled = !windows
          }
          b.setAttribute('aria-pressed', key === activeKey ? 'true' : 'false')
        }
        var w = windows && windows[activeKey]
        var note = !versionAvailable ? t('window.versionUnavailable') : ''
        if (w && w.totalDecisions <= 0) note = t('window.emptyWindow')
        el('window-note').textContent = note
      }
      el('windows').addEventListener('click', function (event) {
        var target = event.target
        if (!target || !target.getAttribute || target.disabled) return
        var key = target.getAttribute('data-window')
        if (!key) return
        chosenWindow = key
        if (lastStats) renderStats(lastStats)
      })

      // ---------- the four questions -------------------------------------
      function renderStatus (health, w) {
        var chips = []
        if (health.lastJevAt) chips.push(chip(t('status.jevAnswered', { age: ago(health.lastJevAt) }), ''))
        else chips.push(chip(t('status.jevNever'), ''))
        var failures = health.consecutiveFailures || 0
        chips.push(failures > 0
          ? chip(t('status.failures', { n: num(failures) }), 'alarm', health.lastFailureAt ? ago(health.lastFailureAt) : '')
          : chip(t('status.noFailures'), ''))
        var unjudged = (w.bySource && w.bySource.none) || 0
        chips.push(chip(t('status.unjudged', { n: num(unjudged) }), unjudged > 0 ? 'alarm' : ''))
        var latency = w.jevLatency || {}
        chips.push(latency.sampleCount > 0
          ? chip(t('status.latency', { p50: ms(latency.medianMs), p95: ms(latency.p95Ms) }), '')
          : chip(t('status.latencyNone'), ''))
        el('status-body').innerHTML = chips.join('')
      }
      function chip (text, cls, title) {
        return '<span class="chip' + (cls ? ' ' + cls : '') + '"' +
          (title ? ' title="' + esc(title) + '"' : '') + '>' + esc(text) + '</span>'
      }

      function renderToll (w) {
        var total = w.totalDecisions || 0
        var source = w.bySource || {}
        // A `none` record is a command that reached the point of asking Jev
        // and got no answer -- it passed UNJUDGED. It stays in the bar, in
        // red, and gets its own sentence; it is never folded into what the
        // gate settled.
        var unjudged = source.none || 0
        var median = w.jevLatency && w.jevLatency.medianMs
        var segments = [
          { value: source.jev || 0, cls: 'v1', label: median != null ? t('gate.source.jevMedian', { ms: ms(median) }) : t('gate.source.jev') },
          { value: source.cache || 0, cls: 'v2', label: t('gate.source.cache') },
          { value: source['local-rule'] || 0, cls: 'v3', label: t('gate.source.localRule') },
          { value: unjudged, cls: 'vd', label: t('gate.source.none') }
        ]
        // A count, not minutes: minutes saved would be this count times a
        // median, an extrapolation the unmeasured card says this board does
        // not make.
        var avoided = (source.cache || 0) + (source['local-rule'] || 0)
        el('toll-body').innerHTML =
          '<div class="kpi"><span class="kpi-n">' + esc(num(total)) + '</span>' +
          '<span class="kpi-unit">' + esc(t('toll.unit')) + '</span></div>' +
          '<p class="kpi-sub">' + esc(t('toll.avoided', { n: num(avoided) })) + '</p>' +
          stackedBar(segments, total) + legendList(segments, total) +
          (unjudged > 0 ? line(t('load.unjudged', { n: num(unjudged) })) : '')
      }

      function countCell (value, cls) {
        var n = value || 0
        return '<td class="' + (n === 0 ? 'zero' : (cls || '')) + '">' + esc(num(n)) + '</td>'
      }
      function renderInterventions (w) {
        var verdict = w.byVerdict || {}
        var table = w.interventions || {}
        var rows = table.rows || []
        var sub = line(t('interv.sub', {
          ask: num(verdict.ask || 0), deny: num(verdict.deny || 0), total: num(w.totalDecisions || 0)
        }), 'kpi-sub')
        if (rows.length === 0) {
          el('interventions-body').innerHTML = sub + line(t('interv.none'), 'empty-line')
          return
        }
        var body = rows.map(function (r) {
          return '<tr><td title="' + esc(r.commandFamily) + '">' + esc(r.commandFamily) + '</td>' +
            countCell(r.ask) + countCell(r.deny, 'deny') + countCell(r.notRun) + '</tr>'
        })
        if (table.rest) {
          var restLabel = esc(t('interv.rest', { n: num(table.rest.families) }))
          body.push('<tr class="agg"><td title="' + restLabel + '">' + restLabel + '</td>' +
            countCell(table.rest.ask) + countCell(table.rest.deny, 'deny') + countCell(table.rest.notRun) + '</tr>')
        }
        var quiet = table.quiet || { families: 0, total: 0 }
        var hasNotRun = rows.some(function (r) { return r.notRun > 0 }) || !!(table.rest && table.rest.notRun > 0)
        el('interventions-body').innerHTML = sub +
          '<table class="itable"><colgroup><col><col class="n"><col class="n"><col class="n"></colgroup>' +
          '<thead><tr><th scope="col">' + esc(t('interv.family')) + '</th><th scope="col">' + esc(t('interv.ask')) +
          '</th><th scope="col">' + esc(t('interv.deny')) + '</th><th scope="col">' + esc(t('interv.notRun')) + '</th></tr></thead>' +
          '<tbody>' + body.join('') + '</tbody></table>' +
          (quiet.families > 0 ? line(t('interv.quiet', { n: num(quiet.families), total: num(quiet.total) })) : '') +
          (hasNotRun ? line(t('interv.notRunFoot')) : '')
      }

      function renderApprovals (approvals) {
        var asked = approvals.asked || 0
        if (asked <= 0) { el('approvals-body').innerHTML = line(t('approvals.empty'), 'empty-line'); return }
        var segments = [
          { value: approvals.approved || 0, cls: 'v1', label: t('approvals.approved') },
          { value: approvals.rejected || 0, cls: 'vd', label: t('approvals.rejected') },
          { value: approvals.notRun || 0, cls: 'v3', label: t('approvals.notRun') }
        ]
        var parts = [stackedBar(segments, asked), legendList(segments, asked)]
        // P7: the uncertainty stays in the copy, and only when the count is
        // non-zero -- explaining zero of something is noise.
        if ((approvals.notRun || 0) > 0) parts.push(line(t('approvals.notRunHint')))

        var ceiling = approvals.ceiling || {}
        if (ceiling.suggestedCeiling != null) {
          parts.push(hbars([
            { label: t('approvals.highestApproved'), value: ceiling.highestApproved },
            { label: t('approvals.lowestRejected'), value: ceiling.lowestRejected },
            { label: t('approvals.suggestedCeiling'), value: ceiling.suggestedCeiling }
          ], 'v2'))
          parts.push(line(t('approvals.evidenceCount', {
            approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
          })))
        } else if ((ceiling.approvedCount || 0) === 0 || (ceiling.rejectedCount || 0) === 0) {
          parts.push(line(t('approvals.noSuggestionInsufficient', {
            approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
          })))
        } else {
          parts.push(line(t('approvals.noSuggestionOverlap', {
            highest: String(ceiling.highestApproved), lowest: String(ceiling.lowestRejected),
            approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
          })))
        }
        el('approvals-body').innerHTML = parts.join('')
      }

      function renderSpeed (ab) {
        var samples = (ab && ab.sampleCount) || 0
        if (samples <= 0) { fill('speed-body', 'speed-empty', '', t('speed.empty')); return }

        // The model is named, never called "the big model": the id comes
        // straight off the comparison rows. More than one id in the window
        // is possible (a config change mid-run), so they are all shown.
        var modelIds = (ab.modelIds || [])
        var modelName = modelIds.length > 0 ? modelIds.join(' / ') : t('stats.na')

        var chart = compareBars([
          { name: t('speed.jev'), valueMs: ab.jevLatency && ab.jevLatency.medianMs, cls: 'v1' },
          { name: modelName, valueMs: ab.bigModelLatency && ab.bigModelLatency.medianMs, cls: 'v3' }
        ])

        var parts = [chart, line(t('speed.samples', { n: String(samples) }))]
        if (typeof ab.agreementCount === 'number') {
          parts.push(line(t('speed.agreement', { agree: String(ab.agreementCount), n: String(samples) })))
        }
        var disagreements = ab.disagreements || []
        if (disagreements.length > 0) {
          parts.push('<p class="cmp-foot">' + esc(t('speed.disagreementsHeading')) + ' ' +
            disagreements.map(function (d) {
              return esc(t('speed.disagreement', {
                count: String(d.count), jev: String(d.jevVerdict), model: String(d.bigModelVerdict)
              }))
            }).join(' · ') + '</p>')
        }
        if ((ab.failureCount || 0) > 0) {
          parts.push(line(t('speed.failures', { n: String(ab.failureCount) })))
        }

        var jevTokens = ab.jevTokens || {}
        var bigTokens = ab.bigModelTokens || {}
        if (typeof jevTokens.inputTotal === 'number' && typeof bigTokens.outputTotal === 'number') {
          var loadedContext = (bigTokens.cacheCreationInputTotal || 0) + (bigTokens.cacheReadInputTotal || 0)
          parts.push('<div class="divider" style="margin-top:10px;padding-top:8px">' +
            '<h2>' + esc(t('speed.tokensHeading')) + '</h2>' +
            hbars([
              { label: t('speed.tokensRowJev'), value: (jevTokens.inputTotal || 0) + (jevTokens.outputTotal || 0) },
              { label: t('speed.tokensRowAnswer'), value: (bigTokens.inputTotal || 0) + (bigTokens.outputTotal || 0) },
              { label: t('speed.tokensRowContext'), value: loadedContext }
            ], 'v1') +
            line(t('speed.tokensJev', { in: num(jevTokens.inputTotal || 0), out: num(jevTokens.outputTotal || 0) })) +
            line(t('speed.tokensBig', {
              model: modelName, in: num(bigTokens.inputTotal || 0),
              out: num(bigTokens.outputTotal || 0), cache: num(loadedContext)
            })) +
            line(t('speed.tokensNote')) + '</div>')
        }
        fill('speed-body', 'speed-empty', parts.join(''), '')
      }

      function renderProjects (gate, mod) {
        var totals = {}
        ;(gate.byProject || []).forEach(function (p) {
          var key = projectLabel(p.project); totals[key] = (totals[key] || 0) + (p.total || 0)
        })
        ;(mod.byProject || []).forEach(function (p) {
          var key = projectLabel(p.key); totals[key] = (totals[key] || 0) + (p.count || 0)
        })
        var rows = Object.keys(totals)
          .map(function (key) { return { label: key, value: totals[key] } })
          .sort(function (a, b) { return b.value - a.value })
          .slice(0, 8)
        fill('projects-body', null, hbars(rows, 'v2'), t('stats.byProjectEmpty'))
      }

      function renderSkills (mod) {
        if (!((mod.totalDecisions || 0) > 0)) { fill('skills-body', null, '', t('stats.skillsEmpty')); return }
        var rows = [{ label: t('stats.skillSuggestions'), value: mod.suggestedCount || 0 }]
        if (mod.listingCharsTotal != null) {
          rows.push({ label: t('stats.listingChars'), value: mod.listingCharsTotal })
        }
        var parts = [hbars(rows, 'v1')]
        parts.push(line(t('stats.skillMatchRate') + ': ' +
          (mod.matchRate == null ? t('stats.na') : pct(mod.matchRate) + '%')))
        fill('skills-body', null, parts.join(''), '')
      }

      function renderUnmeasured () {
        el('unmeasured-body').innerHTML = [
          'unmeasured.money', 'unmeasured.extrapolation',
          'unmeasured.quality', 'unmeasured.counterfactual'
        ].map(function (key) { return '<li>' + esc(t(key)) + '</li>' }).join('')
      }

      function renderRecent (gate) {
        var recent = gate.recent || []
        if (recent.length === 0) {
          el('stats-recent').innerHTML = line(t('stats.recentEmpty'), 'empty-line')
          return
        }
        var sourceLabel = {
          'local-rule': t('stats.recentLocalRule'), cache: t('stats.recentCached'),
          jev: t('stats.recentJev'), none: t('stats.recentNone')
        }
        // Family, source, verdict, age: the project moves to the tooltip and
        // the full timestamp is gone -- "4 min ago" is what a person scans.
        el('stats-recent').innerHTML = '<ul class="recent-list">' + recent.map(function (r) {
          var latency = r.latencyMs != null ? ' · ' + ms(r.latencyMs) + ' ms' : ''
          return '<li title="' + esc(projectLabel(r.project)) + '">' +
            '<span class="tag">' + esc(r.commandFamily || '') + '</span>' +
            '<span class="tag">' + esc((sourceLabel[r.source] || r.source || '') + latency) + '</span>' +
            '<span class="' + tagClass(r.verdict === 'deny' ? 'blocked' : (r.verdict === 'ask' ? 'working' : 'done')) + '">' +
            esc(r.verdict || '') + '</span>' +
            '<span class="when">' + esc(ago(r.at)) + '</span></li>'
        }).join('') + '</ul>'
      }

      function show (id, visible) { el(id).style.display = visible ? '' : 'none' }

      // Whether the board has anything to say beyond its empty state. The
      // live card reads it too, so an empty log and an empty live list do
      // not leave a card that only says "no data".
      var hasMeasurements = false
      function syncLiveVisibility () {
        var entries = (lastBoard && Array.isArray(lastBoard.entries)) ? lastBoard.entries : []
        show('card-live', hasMeasurements || entries.length > 0)
      }

      function renderStats (summary) {
        lastStats = summary
        var ok = !!(summary && summary.ok)
        var gate = (ok && summary.gate) || {}
        var mod = (ok && summary.modSkills) || {}
        var ab = (ok && summary.abBenchmark) || {}
        var windows = gate.windows || null
        var hasGate = !!(windows && windows.all && windows.all.totalDecisions > 0)
        var hasSpeed = (ab.sampleCount || 0) > 0
        var hasSkills = (mod.totalDecisions || 0) > 0
        hasMeasurements = hasGate || hasSpeed || hasSkills

        // An empty log gets one card that says why, never a column of empty
        // sections and never a zero standing in for "nothing yet".
        show('card-empty', !hasGate)
        el('empty-body').textContent = t('empty.body')
        show('windows', hasGate)
        show('card-status', hasGate)
        show('card-recent', hasGate)
        show('card-projects', hasGate || hasSkills)
        show('card-speed', hasMeasurements)
        show('card-skills', hasMeasurements)
        show('card-unmeasured', hasMeasurements)
        syncLiveVisibility()

        var key = activeWindowKey(windows)
        var w = (windows && windows[key]) || {}
        show('top', hasGate && w.totalDecisions > 0)
        if (hasGate) {
          renderWindowPicker(windows, key)
          renderStatus(gate.health || {}, w)
          if (w.totalDecisions > 0) {
            renderToll(w)
            renderInterventions(w)
            renderApprovals(w.approvals || {})
          }
          renderRecent(gate)
        }
        if (hasMeasurements) {
          renderUnmeasured()
          renderSpeed(ab)
          renderSkills(mod)
        }
        if (hasGate || hasSkills) renderProjects(gate, mod)
      }

      // ---------- render: live board -----------------------------------------
      function tagClass (state) {
        if (state === 'done') return 'tag done'
        if (state === 'working') return 'tag working'
        if (state === 'blocked') return 'tag blocked'
        return 'tag'
      }
      var lastBoard = null
      function render (board) {
        lastBoard = board
        var entries = (board && Array.isArray(board.entries)) ? board.entries.slice() : []
        // "Quien necesita algo" antes que el conteo: no-terminado primero,
        // y entre los no-terminados el que lleva mas tiempo esperando.
        entries.sort(function (a, b) {
          var aDone = a && a.state === 'done' ? 1 : 0
          var bDone = b && b.state === 'done' ? 1 : 0
          if (aDone !== bDone) return aDone - bDone
          return (a && a.receivedAt || 0) - (b && b.receivedAt || 0)
        })

        if (!entries.length) {
          cardsEl.innerHTML = '<p class="empty">' + esc(t('live.empty')) + '</p>'
          statusEl.textContent = ''
          syncLiveVisibility()
          return
        }

        // A pane key is a pair of UUIDs that tells a person nothing: the
        // project and branch are the chips, the ids only the tooltip.
        cardsEl.innerHTML = '<div class="live-list">' + entries.map(function (entry) {
          var view = liveEntryView(entry)
          return '<div class="live-row" title="' + esc(view.title) + '">' +
            '<span class="name">' + esc(view.name || t('live.unknownWorktree')) + '</span>' +
            (view.branch ? '<span class="tag">' + esc(view.branch) + '</span>' : '') +
            '<span class="' + tagClass(entry.state) + '">' + esc(entry.state || '?') + '</span>' +
            '<span class="when">' + esc(ago(entry.updatedAt)) + '</span></div>'
        }).join('') + '</div>'
        statusEl.textContent = t('live.agentsCount', { n: String(entries.length) })
        syncLiveVisibility()
      }

      // Every number on this board (board entries, measurementsSummary) is
      // written only by the worker -- if it has never run, both stay
      // legitimately absent forever, and "No data yet" is honest but does
      // not say why. This note names the real cause once the worker's own
      // heartbeat (T1 in odd/tasks/panel-worker-wakeup.md) says nobody is
      // running right now.
      function renderWorkerNote (heartbeat) {
        if (isHeartbeatFresh(heartbeat, Date.now(), WORKER_HEARTBEAT_STALE_MS)) {
          noteEl.className = 'meta nota'
          noteEl.textContent = ''
          return
        }
        noteEl.className = 'meta nota stale'
        noteEl.textContent = t('common.workerSilent')
      }

      function reload (usuario) {
        return Promise.all([
          read('board', usuario),
          read('measurementsSummary', usuario),
          read(WORKER_HEARTBEAT_KEY, false)
        ]).then(function (results) {
          render(results[0] || { entries: [] })
          renderStats(results[1])
          renderWorkerNote(results[2])
        }).catch(function (error) {
          noteEl.className = 'meta nota stale'
          // Same rule as config.html: a raw fault message is written for
          // whoever is debugging, not for whoever installed this.
          noteEl.textContent = t('error.unexpected')
        })
      }

      var timer = null
      function startPolling () {
        if (timer) return
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload(false)
        }, 8000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reload(false); startPolling() } else if (timer) {
          clearInterval(timer); timer = null
        }
      })
      window.addEventListener('focus', function () { reload(false) })

      el('refresh').addEventListener('click', function (event) {
        var b = event.currentTarget
        b.disabled = true
        statusEl.textContent = t('live.updating')
        Promise.resolve(reload(true)).then(function () {
          setTimeout(function () { b.disabled = false }, 400)
        })
      })

      // Orca's language decides; see the note in config.html.
      Promise.resolve().then(function () {
        applyStaticI18n()
        return reload(true)
      }).then(startPolling)
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advisor</title>
    <!--
      Every user-facing string here comes from CATALOG (es/en) below, by
      key -- see panels/config.html's <head> comment for why this is not
      Orca's own `contributes.languagePacks` (verified in orca-oss:
      I18nProvider.tsx only applies a plugin's pack when
      uiLanguage === pack.id -- it replaces Orca's whole UI language, not
      one plugin's own panel). The language choice is shared with
      config.html through the same `localeStatus`/`localeRequest` keys.

      Numbers on this panel are never invented: every one comes from
      counting entries in the JSONL logs main.mjs's read-measurements.mjs
      aggregates (adapters/claude/gate-bash.ts's, adapters/claude/mod-skills'
      and adapters/claude/gate-outcome.ts's). Nothing here estimates a saved
      dollar, a saved token, or how long a deliberation would have taken --
      none of that is measured anywhere in this plugin.

      The approvals section is the same rule applied to a suggested number:
      src/core/approval_record.ts's ceilingEvidence() returns null, not a
      guess, whenever approvals and rejections overlap or one side has no
      evidence yet -- and this panel renders that null as an honest sentence
      explaining why, never as a blank dash.
    -->
    <style>
      /* El host inyecta una lista corta de tokens en el <style> del shell
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts)
         y pone light/dark en <html>. Nada mas llega aca: ni utilidades de Tailwind,
         ni la tipografia de la app. Los respaldos son los valores reales de
         main.css, no un gris inventado, para que el panel se lea bien incluso
         cuando el host no inyecta nada (host viejo, o el arnes de pruebas). */
      :root {
        color-scheme: light dark;
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717; --fb-primary-foreground: #fafafa;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-ring: #a1a1a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5; --fb-primary-foreground: #171717;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-ring: #737373;
        }
      }
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 0 0 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; margin: 0 0 8px; padding: 8px 12px;
        border-bottom: 1px solid var(--border, var(--fb-border));
      }
      header .meta { margin-left: auto; }
      header button {
        font: inherit; font-size: 13px; line-height: 1; padding: 3px 8px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md);
        background: var(--secondary, var(--fb-secondary));
        color: var(--muted-foreground, var(--fb-muted-foreground));
        transition: background-color 90ms ease, color 90ms ease;
      }
      header button:hover { background: var(--accent, var(--fb-accent));
                            color: var(--accent-foreground, var(--fb-accent-foreground)); }
      header button:active { transform: translateY(1px); }
      header button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      header button[disabled] { opacity: 0.5; cursor: default; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .meta { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .nota { margin: 0 0 8px; padding: 0 12px; }
      .nota:empty { display: none; }

      section { padding: 10px 12px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           margin: 0 0 8px; font-weight: 600; }
      .empty-line { color: var(--muted-foreground, var(--fb-muted-foreground)); font-size: 12px; }
      .divider { border-top: 1px solid var(--border, var(--fb-border)); margin-top: 4px; }

      .item { padding: 8px 12px; border-bottom: 1px solid var(--border, var(--fb-border)); }
      .item:last-child { border-bottom: 0; }
      .line1 { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
      .worktree { font-weight: 500; word-break: break-all; }
      .pane { color: var(--muted-foreground, var(--fb-muted-foreground)); font-size: 11px; word-break: break-all; }
      .when { margin-left: auto; color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; white-space: nowrap; }
      .tag { font-size: 10px; border: 1px solid var(--border, var(--fb-border));
             border-radius: 9999px; padding: 0 6px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Sin tono propio de exito/alerta -- la allowlist no lo tiene. `done`
         y `working` se apoyan en --accent (superficie de enfasis), `blocked`
         en --destructive (el unico rojo disponible), y todo lo demas en el
         filete neutro, igual que hace activity.html con sus tres etiquetas. */
      .tag.done { background: var(--accent, var(--fb-accent));
                  color: var(--accent-foreground, var(--fb-accent-foreground));
                  border-color: transparent; font-weight: 600; }
      .tag.working { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      .tag.blocked { color: var(--destructive, var(--fb-destructive)); border-style: dashed; }
      /* `advised`: the model was refused this one attempt and handed a
         concrete reason, but nobody was interrupted -- neither `done`'s
         quiet accent (that reads as a clean pass), nor `blocked`'s red
         (nothing was permanently refused), nor `working`'s plain bold (that
         is a human still waiting). --primary is already this panel's own
         "distinct, high-contrast" token (the selected window-picker button
         above), so this reuses it rather than inventing a colour the host's
         own allowlist does not carry. */
      .tag.advised { background: var(--primary, var(--fb-primary));
                     color: var(--primary-foreground, var(--fb-primary-foreground));
                     border-color: transparent; font-weight: 600; }
      .empty { color: var(--muted-foreground, var(--fb-muted-foreground)); padding: 8px 12px; }
      .stale { color: var(--destructive, var(--fb-destructive)); }

      /* ---- charts ---------------------------------------------------
         No chart library reaches this iframe (opaque origin, no network,
         and the shell injects only PANEL_DESIGN_TOKEN_ALLOWLIST), so every
         chart below is plain boxes sized by percentage. That is not a
         downgrade: percentages reflow at 320px without a layout engine,
         and painting them with the host's own tokens means they follow the
         theme for free.

         The palette is a three-step neutral ramp plus the single red the
         allowlist carries. Deliberately not a rainbow: --primary,
         --muted-foreground and --ring are the only three neutrals that
         stay distinguishable in BOTH themes (light #171717/#737373/#a1a1a1,
         dark #e5e5e5/#a1a1a1/#737373). A fourth invented hue would look
         right here and wrong in somebody else's Orca. */
      .v1 { --viz: var(--primary, var(--fb-primary)); }
      .v2 { --viz: var(--muted-foreground, var(--fb-muted-foreground)); }
      .v3 { --viz: var(--ring, var(--fb-ring)); }
      .vd { --viz: var(--destructive, var(--fb-destructive)); }

      /* JEVADV-63, odd/tasks/board-global-window.md W1 -- the Activity tab's
         per-project list: one row per project, its estimated cost on the
         right (labelled), and one or two quiet lines of counts under the
         name. Counts of different units are joined in a sentence, never drawn
         on one bar scale (odd/tasks/board-leftovers.md L5). */
      .act-total { margin: 0 0 10px; font-size: 12px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .act-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
      .act-row { padding: 7px 0; border-top: 1px solid var(--border, var(--fb-border)); min-width: 0; }
      .act-row:first-child { border-top: 0; padding-top: 0; }
      .act-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
      .act-name { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
      .act-cost { margin-left: auto; flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
      .act-cost small { font-weight: 400; font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); margin-left: 4px; }
      .act-sub { margin: 2px 0 0; font-size: 12px; overflow-wrap: anywhere;
                 color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .act-sub .vd { color: var(--viz); }
      .act-rest { margin: 8px 0 0; font-size: 12px; font-style: italic; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Same look as .live-toggle, under its own name so the two never
         collide (they sit in different sections of the same tab). */
      .act-toggle { margin-top: 8px; background: none; border: 1px solid var(--border, var(--fb-border));
                    border-radius: 9999px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer;
                    color: var(--foreground, var(--fb-foreground)); }
      .act-toggle:hover { background: var(--accent, var(--fb-accent)); }
      .act-toggle:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }

      .cards { display: grid; gap: 10px; grid-template-columns: 1fr; padding: 10px 12px; }
      @media (min-width: 720px) { .cards { grid-template-columns: 1fr 1fr; } .card.wide { grid-column: 1 / -1; } }
      .card {
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md); padding: 10px 12px; min-width: 0;
      }
      .card > h2 { margin: 0 0 8px; }

      .kpi { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
      .kpi-n { font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em;
               font-variant-numeric: tabular-nums; }
      .kpi-unit { font-size: 12px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* overflow-wrap: an account's email is one unbreakable run, and at
         320px a long one would otherwise push the page sideways. */
      .kpi-sub { margin: 4px 0 10px; font-size: 12px; overflow-wrap: anywhere;
                 color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .kpi-sub.rec-act { color: var(--foreground, var(--fb-foreground)); margin: 4px 0 6px; }

      /* Stacked proportion bar. A 0-count segment renders nothing at all
         rather than a hairline nobody can read or click. */
      .bar { display: flex; height: 10px; border-radius: 9999px; overflow: hidden;
             background: var(--secondary, var(--fb-secondary)); }
      .bar .seg { background: var(--viz); min-width: 2px; }
      .bar .seg + .seg { box-shadow: inset 1px 0 0 var(--background, var(--fb-background)); }

      .legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
      .legend li { display: flex; align-items: baseline; gap: 6px; font-size: 12px; min-width: 0; }
      .legend .sw { width: 8px; height: 8px; border-radius: 2px; background: var(--viz); flex: none; }
      .legend .lv { font-weight: 600; font-variant-numeric: tabular-nums; }
      .legend .ll { color: var(--muted-foreground, var(--fb-muted-foreground));
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .legend .lp { margin-left: auto; color: var(--muted-foreground, var(--fb-muted-foreground));
                    font-variant-numeric: tabular-nums; flex: none; }

      /* Horizontal bars: label, track, value. The label column is capped
         so one long project path cannot squeeze every bar to nothing. */
      .hrows { display: grid; gap: 6px; }
      .hrow { display: grid; grid-template-columns: minmax(0, 7.5em) 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
      @media (min-width: 720px) { .hrow { grid-template-columns: minmax(0, 16em) 1fr auto; } }
      .hrow .hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* W5 (#13): on a phone the label takes its own line above its bar,
         whole, instead of an ellipsis in a 7.5em column. */
      @media (max-width: 480px) {
        .hrow { grid-template-columns: 1fr auto; row-gap: 2px; }
        .hrow .hl { grid-column: 1 / -1; white-space: normal; overflow: visible; overflow-wrap: anywhere; }
      }
      .htrack { background: var(--secondary, var(--fb-secondary)); border-radius: 9999px; height: 8px; overflow: hidden; }
      .hfill { display: block; height: 100%; background: var(--viz); border-radius: 9999px; min-width: 2px; }
      .hv { font-variant-numeric: tabular-nums; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Figures that share no unit (a count of prompts, a count of
         characters) are shown as labelled numbers, never as bars on one
         scale (odd/tasks/board-leftovers.md L5). A label wraps; it is never
         cut. */
      .figures { display: grid; gap: 8px 16px; grid-template-columns: repeat(auto-fit, minmax(9em, 1fr)); margin: 0 0 6px; }
      /* column-reverse puts the number above its label; flex-end keeps the
         numbers of one row level when one label wraps and the other does not. */
      .figure { display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 2px; min-width: 0; }
      .figure dt { font-size: 12px; color: var(--muted-foreground, var(--fb-muted-foreground)); overflow-wrap: anywhere; }
      .figure dd { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }

      /* Speed comparison: two bars on one shared axis, so the gap is the
         thing you see first and the milliseconds only confirm it. */
      .cmp { display: grid; gap: 8px; }
      .cmp-row { display: grid; gap: 3px; }
      .cmp-head { display: flex; gap: 8px; align-items: baseline; font-size: 12px; min-width: 0; }
      .cmp-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cmp-val { margin-left: auto; font-variant-numeric: tabular-nums; flex: none; }
      .cmp-track { background: var(--secondary, var(--fb-secondary)); border-radius: var(--radius-md); height: 16px; overflow: hidden; }
      .cmp-fill { display: block; height: 100%; background: var(--viz); border-radius: var(--radius-md); min-width: 3px; }
      .cmp-foot { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); margin: 2px 0 0; }
      /* Multi-provider: a line that says the gate is not judging (Clef unanswered, Clef off for the day). */
      .provider-meter { margin-top: 6px; }
      .cmp-foot.alarm-line { color: var(--destructive, var(--fb-destructive)); font-weight: 600; }
      .verdict-chip { font-variant-numeric: tabular-nums; }

      /* ---- the four questions ------------------------------------------
         Status strip, toll, interventions, calibration -- in that order in
         the DOM, which is also the reading order at every width. From
         1100px the interventions table takes the right column beside toll
         and calibration, so all four fit in a 1440x900 viewport without
         scrolling. Everything else sits below them. */
      .windows { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 12px 8px; }
      .windows button {
        font: inherit; font-size: 12px; line-height: 1; padding: 5px 10px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border)); border-radius: 9999px;
        background: transparent; color: var(--muted-foreground, var(--fb-muted-foreground));
      }
      .windows button[aria-pressed="true"] {
        background: var(--primary, var(--fb-primary)); color: var(--primary-foreground, var(--fb-primary-foreground));
        border-color: transparent; font-weight: 600;
      }
      .windows button[disabled] { opacity: 0.45; cursor: default; }
      .windows button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      .windows .meta { flex-basis: 100%; }
      .windows .meta:empty { display: none; }
      /* W2: the window a card shows, after its heading, in the heading's own
         quiet colour but not shouted in capitals. */
      h2 .win { text-transform: none; letter-spacing: 0; font-weight: 400; }
      /* W3: a module's state, in the config panel's own words. */
      .mod-state { margin: 0 0 8px; font-size: 12px; }
      h2 .win:not(:empty)::before { content: " · "; }

      .strip { margin: 0 12px; padding: 8px 12px; border: 1px solid var(--border, var(--fb-border));
               border-radius: var(--radius-md); }
      .strip > h2 { margin: 0 0 6px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { font-size: 12px; border: 1px solid var(--border, var(--fb-border)); border-radius: 9999px;
              padding: 2px 9px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
      .chip.alarm { color: var(--destructive, var(--fb-destructive)); border-color: currentColor; font-weight: 600; }
      .chip b { font-weight: 600; }

      .top { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); padding: 10px 12px 0; }
      @media (min-width: 1100px) {
        /* auto then 1fr: the table spans both rows, and without this its
           height is split across them, opening a gap under the toll card. */
        .top { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
               grid-template-rows: auto 1fr;
               grid-template-areas: "toll interv" "calib interv"; align-items: start; }
        #card-toll { grid-area: toll; }
        #card-interventions { grid-area: interv; }
        #card-calibration { grid-area: calib; }
      }

      .itable { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px;
                font-variant-numeric: tabular-nums; }
      .itable th { font-weight: 600; text-align: right; padding: 0 0 4px 6px; font-size: 11px;
                   color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .itable th:first-child, .itable td:first-child { text-align: left; padding-left: 0; }
      .itable td { text-align: right; padding: 3px 0 3px 6px; border-top: 1px solid var(--border, var(--fb-border)); }
      .itable td:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .itable col.n { width: 5.2em; }
      .itable th { white-space: nowrap; }
      .itable .deny { color: var(--destructive, var(--fb-destructive)); font-weight: 600; }
      .itable .zero { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .itable tr.agg td { color: var(--muted-foreground, var(--fb-muted-foreground)); font-style: italic; }

      .recent-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      /* 0.6.8 T5: "Waiting for you". Same margins as the status strip; the
         command wraps anywhere, so a long one never widens a phone. */
      .card.waiting { margin: 10px 12px 10px; border-color: var(--foreground, var(--fb-foreground)); }
      .card.waiting #waiting-release { margin: 0; }
      .waiting-list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 8px; }
      .waiting-list li { display: grid; gap: 3px; font-size: 12px; min-width: 0; }
      .waiting-list .meta { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
      .waiting-list code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
                           overflow-wrap: anywhere; white-space: pre-wrap; }
      .recent-list li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 12px; }
      .live-list { display: grid; gap: 6px; }
      .live-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; font-size: 12px; }
      .live-row .live-main { display: flex; gap: 6px; align-items: baseline; min-width: 0; flex-wrap: wrap; }
      .live-row .live-sub { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
      .live-row .when { margin-left: 0; }
      /* W6 (#14): the branch is quiet text, not a pill; a state pill gets a
         line that shows in both themes (--ring, not the card hairline). */
      .live-row .tag.branch { border: 0; padding: 0; font-size: 11px; overflow-wrap: anywhere; }
      .live-row .tag.state { border-color: var(--ring, var(--fb-ring)); }
      .live-row .name { font-weight: 600; overflow-wrap: anywhere; }
      /* odd/tasks/board-leftovers.md L6. How many sessions one project and
         branch row stands for, and a working or waiting row that has been
         silent too long: both quiet, neither reads as activity. */
      .live-row .count { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); white-space: nowrap; }
      .tag.nosignal { color: var(--muted-foreground, var(--fb-muted-foreground)); border-style: dotted; font-weight: 400; }
      .live-toggle { margin-top: 8px; background: none; border: 1px solid var(--border, var(--fb-border));
                     border-radius: 9999px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer;
                     color: var(--foreground, var(--fb-foreground)); }
      .live-toggle:hover { background: var(--accent, var(--fb-accent)); }
      .live-toggle:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }

      /* The honesty card. Same border as the rest -- it is not a warning,
         it is the part of the panel that says what these numbers do not
         cover, and it should read as ordinary content, not an alarm. */
      .unmeasured { margin: 0; padding-left: 1.1em; display: grid; gap: 4px;
                    font-size: 12px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .unmeasured li { padding-left: 2px; }

      /* odd/tasks/board-tabs-and-names.md T2 -- the tablist that keeps this
         board short enough to scan: one group of sections at a time. The
         same tab look as config.html's own #config-tabbar (JEVADV-41), so
         the plugin's two panels read as one product.
         One row, always (T3): wrapping made the bar two rows at 320px only
         while the bold selected tab was the long one, so the content below
         jumped on every switch. The bar never wraps; if its tabs ever do not
         fit, the bar scrolls sideways on its own and the page never does. */
      .tabbar { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding: 0 12px; margin: 0 0 8px;
                border-bottom: 1px solid var(--border, var(--fb-border)); }
      .tab {
        flex: none; white-space: nowrap;
        border: 1px solid transparent; border-bottom: none; border-radius: var(--radius-md) var(--radius-md) 0 0;
        background: none; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
        color: var(--muted-foreground, var(--fb-muted-foreground));
      }
      /* At phone widths a little less padding lets all four labels fit
         without the bar having to scroll, in both languages. */
      @media (max-width: 400px) { .tab { padding: 7px 9px; } }
      .tab:hover { color: var(--foreground, var(--fb-foreground)); background: var(--accent, var(--fb-accent)); }
      /* Same selected state as config.html's, for the same reason: a filled
         --secondary plus a 2px underline in the foreground colour still has
         real contrast in dark mode, where --border alone would not. */
      .tab[aria-selected="true"] {
        color: var(--foreground, var(--fb-foreground)); font-weight: 600;
        background: var(--secondary, var(--fb-secondary));
        border-color: var(--border, var(--fb-border));
        box-shadow: inset 0 -2px 0 var(--foreground, var(--fb-foreground));
      }
      .tab:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: -2px; }
      .tab-panel[hidden] { display: none; }
      /* odd/tasks/board-leftovers.md L3: until the remembered tab is known
         (the host answers, or 300 ms pass), no tab-panel is painted, so the
         board never shows one tab and then jumps to another. The header and
         the tab bar stay on screen. Set in the markup, so it holds from the
         very first paint. */
      .tabs-restoring .tab-panel { visibility: hidden; }
    </style>

      // ---------- board helpers --------------------------------------------
      // Hand-copied from adapters/orca/panels/panel_values.mjs (tested there),
      // converted to ES5 -- `grep -n defaultWindowKey` across both files is

        for (var i = 0; i < order.length; i++) {

        }

      }
      function relativeAge (iso, nowMs) {
        if (typeof iso !== 'string') return null

        if (minutes < 60) return { unit: 'min', n: minutes }
        var hours = Math.floor(minutes / 60)

        return { unit: 'd', n: Math.floor(hours / 24) }
      }
      // Orca's own FLOATING_TERMINAL_WORKTREE_ID (orca-oss
      // src/shared/floating-workspace-selector.ts): a pane that belongs to no
      // worktree at all, which Orca's own Activity page labels "Floating
      // terminal". Its name is Orca's, not a guess.
      var FLOATING_TERMINAL_WORKTREE_ID = 'global-floating-terminal'

      /** The row's visible name is the project name the worker resolved
       *  (main.mjs's boardProjectName, the same rule "By project" names a
       *  project by) -- never the raw projectId, which moves to `title` with
       *  the worktree and pane ids. A project the worker could not name
       *  reads as unknown, the same words "By project" uses. */
      function liveEntryView (entry) {
        var e = entry || {}
        function present (value) { return (typeof value === 'string' && value.length > 0) ? value : null }
        var name = present(e.projectName)
        if (name === null && e.worktreeId === FLOATING_TERMINAL_WORKTREE_ID) name = t('live.floatingTerminal')
        if (name === null) name = present(e.project) !== null ? t('stats.unknownProject') : t('live.unknownWorktree')
        return {
          name: name,
          branch: present(e.rama),

        }
      }

      /** "4 min ago", or '' when the timestamp cannot be read -- never "NaN". */
      function ago (iso) {

        return age ? t('age.' + age.unit, { n: String(age.n) }) : ''
      }

      // ---------- window picker ----------------------------------------------
      // null until the person picks one; until then the board follows
      // defaultWindowKey, so a log that gains a stamped version moves the
      // default along with it instead of freezing whatever loaded first.
      var chosenWindow = null
      var WINDOW_KEYS = ['day', 'week', 'version', 'all']

      // the way the tab is (writeStoredTab): the host's plugin storage inside

      var WINDOW_STORAGE_KEY = 'jevAdvisor.boardPanel.window'
      function readLocalWindow () {
        try {
          var value = window.localStorage.getItem(WINDOW_STORAGE_KEY)

        try {

      }
      chosenWindow = readLocalWindow()
      /** The chip a person picked, while that window can be shown; else the
       *  default. With no gate summary yet, any window but "this version"
       *  (which needs a stamped build to exist) can be. */
      function activeWindowKey (windows) {
        if (chosenWindow && windows && windows[chosenWindow] && windows[chosenWindow].available) return chosenWindow
        if (chosenWindow && !windows && chosenWindow !== 'version') return chosenWindow
        return defaultWindowKey(windows)
      }
      // odd/tasks/board-global-window.md W1: the one window every card on
      // every tab shows, settled from the gate's windows on each render
      // (renderStats) and by the person's chip.
      var currentWindowKey = 'day'
      var lastGateWindows = null
      /** This card's summary for the current window: `part.windows[key]`,
       *  carrying its own `available`, `sinceMs` and `coverageSinceMs`; null
       *  when the reader published no windows. */
      function windowOf (part) {
        if (!part || typeof part !== 'object' || !part.windows || typeof part.windows !== 'object') return null
        var w = part.windows[currentWindowKey]
        return w && typeof w === 'object' ? w : null
      }

      var DAY_MS = 24 * 60 * 60 * 1000
      /** The current window's name: the chip's own words. */
      function windowName (w) {
        if (currentWindowKey !== 'version') return t('window.' + currentWindowKey)
        var version = (w && typeof w.pluginVersion === 'string' && w.pluginVersion) || (lastGateWindows && lastGateWindows.version && lastGateWindows.version.pluginVersion)

      }
      /** What a card's heading says about its window: the window's name, or,
       *  when the window reaches further back than the card's log keeps
       *  (`coverageSinceMs` later than `sinceMs`), how many days it really
       *  covers. `w`: the card's own entry for the current window, or null;
       *  `checkedAt`: when the worker read that summary (the instant its
       *  coverage was measured from), else now. */
      function windowLabel (w, checkedAt) {
        var name = windowName(w)
        if (w && typeof w.coverageSinceMs === 'number' && (w.sinceMs === null || w.sinceMs === undefined || w.coverageSinceMs > w.sinceMs)) {
          var readAt = typeof checkedAt === 'string' && !isNaN(Date.parse(checkedAt)) ? Date.parse(checkedAt) : Date.now()
          return t('window.kept', { window: name, days: num(Math.max(1, Math.round((readAt - w.coverageSinceMs) / DAY_MS))) })
        }

      }
      function setWindowLabel (id, text) {
        var node = el(id)
        if (node) node.textContent = text || ''
      }
      function renderWindowPicker (windows, activeKey) {
        var version = windows && windows.version
        var versionAvailable = !!(version && version.available)
        var buttons = el('windows').querySelectorAll('button[data-window]')
        for (var i = 0; i < buttons.length; i++) {
          var b = buttons[i]
          var key = b.getAttribute('data-window')

      }
      el('windows').addEventListener('click', function (event) {
        var target = event.target
        if (!target || !target.getAttribute || target.disabled) return
        var key = target.getAttribute('data-window')
        if (!key) return
        chosenWindow = key
        writeStoredWindow(key)
        renderEverything()
      })

      // ---------- the four questions -------------------------------------
      function renderStatus (health, w, policiesWithoutKind) {
        var chips = []
        if (health.lastJevAt) chips.push(chip(t('status.jevAnswered', { age: ago(health.lastJevAt) }), ''))
        else chips.push(chip(t('status.jevNever'), ''))
        var failures = health.consecutiveFailures || 0
        chips.push(failures > 0
          ? chip(t('status.failures', { n: num(failures) }), 'alarm', health.lastFailureAt ? ago(health.lastFailureAt) : '')
          : chip(t('status.noFailures'), ''))
        var unjudged = (w.bySource && w.bySource.none) || 0
        chips.push(chip(t('status.unjudged', { n: num(unjudged) }), unjudged > 0 ? 'alarm' : ''))
        statusLatency(w).forEach(function (l) {
          chips.push(chip(l.key === 'status.latencyNone' ? t(l.key) : t(l.key, { p50: ms(l.p50), p95: ms(l.p95) }), ''))
        })
        // JEVADV-49: a stored team policy with no kind is invisible to the
        // gate (store.ts's getPolicies excludes it) and, until now, invisible
        // to the owner too -- see main.mjs's publishPoliciesWithoutKindStatus.
        if (policiesWithoutKind && policiesWithoutKind.count > 0) {
          chips.push(chip(t('status.policiesWithoutKind', { n: num(policiesWithoutKind.count), ids: policiesWithoutKind.ids.join(', ') }), 'alarm'))
        }
        // 0.6.17 T4: decisions the gate could not write (read-measurements.mjs
        // reads the gate's own counter), never left to look like a quiet gate.
        var appendFailures = health.appendFailures || {}
        if (appendFailures.count > 0) {
          chips.push(chip(t('status.appendFailures', { n: num(appendFailures.count), age: appendFailures.lastAt ? ago(appendFailures.lastAt) : '' }), 'alarm', t('status.appendFailuresTitle')))
        }
        el('status-body').innerHTML = chips.join('')
      }
      /**
       * The status card's latency chips (SF1): Jev's own, from the rows Jev
       * answered, exactly as before; and Clef's beside it when Clef answered
       * in this window, so the two can be compared. Pure, so it is tested
       * from the panel's own source (board_html_providers.test.mjs).
       */
      function statusLatency (w) {
        var jev = (w && w.jevLatency) || {}
        var clef = (w && w.clefLatency) || {}
        var out = [jev.sampleCount > 0 ? { key: 'status.latency', p50: jev.medianMs, p95: jev.p95Ms } : { key: 'status.latencyNone' }]
        if (clef.sampleCount > 0) out.push({ key: 'status.latencyClef', p50: clef.medianMs, p95: clef.p95Ms })
        return out
      }

      function chip (text, cls, title) {
        return '<span class="chip' + (cls ? ' ' + cls : '') + '"' +
          (title ? ' title="' + esc(title) + '"' : '') + '>' + esc(text) + '</span>'
      }

      /**
       * The sources bar's figures (C3b, odd/tasks/clef-decides-policies.md):

        var unanswered = count(source.none)
        var clef = Math.min(count(p && p.answeredBy && p.answeredBy.clef), judged)
        var noneClef = Math.min(count(p && p.clefUnanswered), unanswered)
        var median = function (latency) { return latency && typeof latency.medianMs === 'number' ? latency.medianMs : null }

          jev: judged - clef,
          clef: clef,
          cache: count(source.cache),
          localRule: count(source['local-rule']),

          jevMedianMs: median(w && w.jevLatency),
          clefMedianMs: clef > 0 ? median(w && w.clefLatency) : null
        }
      }

      function renderToll (w) {
        var total = w.totalDecisions || 0
        // A `none` record is a command that reached the point of asking a
        // model and got no answer -- it passed UNJUDGED. It stays in the bar,

        var segments = [
          { value: f.jev, cls: 'v1', label: f.jevMedianMs != null ? t('gate.source.jevMedian', { ms: ms(f.jevMedianMs) }) : t('gate.source.jev') },
          { value: f.clef, cls: 'v1', label: f.clefMedianMs != null ? t('gate.source.clefMedian', { ms: ms(f.clefMedianMs) }) : t('gate.source.clef') },

          { value: f.localRule, cls: 'v3', label: t('gate.source.localRule') },

      // ---------- who decides (multi-provider P7) ------------------------------
      /**

        if (f.failovers > 0) parts.push(line(t('providers.failovers', { n: num(f.failovers), failure: num(f.failure), rate: num(f.rateLimit), budget: num(f.budget), unsupported: num(f.unsupported) })))

      function renderApprovals (approvals) {

          })))
        } else if ((ceiling.approvedCount || 0) === 0 || (ceiling.rejectedCount || 0) === 0) {

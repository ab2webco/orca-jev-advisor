      var lastPoliciesWithoutKind = null

      /** Shows `body`, or hides it and shows `emptyText` in its place.
       *  Every card on this board goes through here so that "nothing yet"
       *  can never be rendered as a zero. */
      function fill (bodyId, emptyId, markup, emptyText) {
        var bodyEl = el(bodyId)
        var emptyEl = emptyId ? el(emptyId) : null
        if (markup) {
          bodyEl.innerHTML = markup
          if (emptyEl) { emptyEl.style.display = 'none'; emptyEl.textContent = '' }
          return
        }
        bodyEl.innerHTML = ''
        if (emptyEl) { emptyEl.style.display = ''; emptyEl.textContent = emptyText || '' }
        else bodyEl.innerHTML = '<p class="empty-line">' + esc(emptyText || '') + '</p>'
      }

      // ---------- board helpers --------------------------------------------
      // Hand-copied from adapters/orca/panels/panel_values.mjs (tested there),
      // converted to ES5 -- `grep -n defaultWindowKey` across both files is
      // how to check the copies still agree.
      function defaultWindowKey (windows) {
        if (!windows) return 'all'
        var order = ['version', 'week', 'all']
        for (var i = 0; i < order.length; i++) {
          var w = windows[order[i]]
          if (w && w.available && w.totalDecisions > 0) return order[i]
        }
        return 'all'
      }
      function relativeAge (iso, nowMs) {
        if (typeof iso !== 'string') return null
        var at = Date.parse(iso)
        if (isNaN(at)) return null
        var seconds = Math.floor((nowMs - at) / 1000)
        if (seconds < 60) return { unit: 'now', n: 0 }
        var minutes = Math.floor(seconds / 60)
        if (minutes < 60) return { unit: 'min', n: minutes }
        var hours = Math.floor(minutes / 60)
        if (hours < 24) return { unit: 'h', n: hours }
        return { unit: 'd', n: Math.floor(hours / 24) }
      }
      // Orca's own FLOATING_TERMINAL_WORKTREE_ID (orca-oss
      // src/shared/floating-workspace-selector.ts): a pane that belongs to no
      // worktree at all, which Orca's own Activity page labels "Floating
      // terminal". Its name is Orca's, not a guess.
      var FLOATING_TERMINAL_WORKTREE_ID = 'global-floating-terminal'

      /** The row's visible name is the project name the worker resolved
       *  (main.mjs's boardProjectName, the same rule "By project" names a
       *  project by) -- never the raw projectId, which moves to `title` with
       *  the worktree and pane ids. A project the worker could not name
       *  reads as unknown, the same words "By project" uses. */
      function liveEntryView (entry) {
        var e = entry || {}
        function present (value) { return (typeof value === 'string' && value.length > 0) ? value : null }
        var name = present(e.projectName)
        if (name === null && e.worktreeId === FLOATING_TERMINAL_WORKTREE_ID) name = t('live.floatingTerminal')
        if (name === null) name = present(e.project) !== null ? t('stats.unknownProject') : t('live.unknownWorktree')
        return {
          name: name,
          branch: present(e.rama),
          title: [present(e.project), present(e.worktreeId), present(e.paneKey)].filter(function (part) { return part !== null }).join(' · ')
        }
      }

      /** "4 min ago", or '' when the timestamp cannot be read -- never "NaN". */
      function ago (iso) {
        var age = relativeAge(iso, Date.now())
        return age ? t('age.' + age.unit, { n: String(age.n) }) : ''
      }

      // ---------- window picker ----------------------------------------------
      // null until the person picks one; until then the board follows
      // defaultWindowKey, so a log that gains a stamped version moves the
      // default along with it instead of freezing whatever loaded first.
      var chosenWindow = null
      function activeWindowKey (windows) {
        if (chosenWindow && windows && windows[chosenWindow] && windows[chosenWindow].available) return chosenWindow
        return defaultWindowKey(windows)
      }
      function renderWindowPicker (windows, activeKey) {
        var version = windows && windows.version
        var versionAvailable = !!(version && version.available)
        var buttons = el('windows').querySelectorAll('button[data-window]')
        for (var i = 0; i < buttons.length; i++) {
          var b = buttons[i]
          var key = b.getAttribute('data-window')
          if (key === 'version') {
            b.textContent = versionAvailable ? t('window.version', { v: version.pluginVersion }) : t('window.versionNone')
            b.disabled = !versionAvailable
            b.title = versionAvailable ? '' : t('window.versionUnavailable')
          } else {
            b.disabled = !windows
          }
          b.setAttribute('aria-pressed', key === activeKey ? 'true' : 'false')
        }
        var w = windows && windows[activeKey]
        var note = !versionAvailable ? t('window.versionUnavailable') : ''
        if (w && w.totalDecisions <= 0) note = t('window.emptyWindow')
        el('window-note').textContent = note
      }
      el('windows').addEventListener('click', function (event) {
        var target = event.target
        if (!target || !target.getAttribute || target.disabled) return
        var key = target.getAttribute('data-window')
        if (!key) return
        chosenWindow = key
        if (lastStats) renderStats(lastStats)
      })

      // ---------- the four questions -------------------------------------
      function renderStatus (health, w, policiesWithoutKind) {
        var chips = []
        if (health.lastJevAt) chips.push(chip(t('status.jevAnswered', { age: ago(health.lastJevAt) }), ''))
        else chips.push(chip(t('status.jevNever'), ''))
        var failures = health.consecutiveFailures || 0
        chips.push(failures > 0
          ? chip(t('status.failures', { n: num(failures) }), 'alarm', health.lastFailureAt ? ago(health.lastFailureAt) : '')
          : chip(t('status.noFailures'), ''))
        var unjudged = (w.bySource && w.bySource.none) || 0
        chips.push(chip(t('status.unjudged', { n: num(unjudged) }), unjudged > 0 ? 'alarm' : ''))
        var latency = w.jevLatency || {}
        chips.push(latency.sampleCount > 0
          ? chip(t('status.latency', { p50: ms(latency.medianMs), p95: ms(latency.p95Ms) }), '')
          : chip(t('status.latencyNone'), ''))
        // JEVADV-49: a stored team policy with no kind is invisible to the
        // gate (store.ts's getPolicies excludes it) and, until now, invisible
        // to the owner too -- see main.mjs's publishPoliciesWithoutKindStatus.
        if (policiesWithoutKind && policiesWithoutKind.count > 0) {
          chips.push(chip(t('status.policiesWithoutKind', { n: num(policiesWithoutKind.count), ids: policiesWithoutKind.ids.join(', ') }), 'alarm'))
        }
        el('status-body').innerHTML = chips.join('')
      }
      function chip (text, cls, title) {
        return '<span class="chip' + (cls ? ' ' + cls : '') + '"' +
          (title ? ' title="' + esc(title) + '"' : '') + '>' + esc(text) + '</span>'
      }

      function renderToll (w) {
        var total = w.totalDecisions || 0
        var source = w.bySource || {}
        // A `none` record is a command that reached the point of asking Jev
        // and got no answer -- it passed UNJUDGED. It stays in the bar, in
        // red, and gets its own sentence; it is never folded into what the
        // gate settled.
        var unjudged = source.none || 0
        var median = w.jevLatency && w.jevLatency.medianMs
        var segments = [
          { value: source.jev || 0, cls: 'v1', label: median != null ? t('gate.source.jevMedian', { ms: ms(median) }) : t('gate.source.jev') },
          { value: source.cache || 0, cls: 'v2', label: t('gate.source.cache') },
          { value: source['local-rule'] || 0, cls: 'v3', label: t('gate.source.localRule') },
          { value: unjudged, cls: 'vd', label: t('gate.source.none') }
        ]
        // A count, not minutes: minutes saved would be this count times a
        // median, an extrapolation the unmeasured card says this board does
        // not make.
        var avoided = (source.cache || 0) + (source['local-rule'] || 0)
        el('toll-body').innerHTML =
          '<div class="kpi"><span class="kpi-n">' + esc(num(total)) + '</span>' +
          '<span class="kpi-unit">' + esc(t('toll.unit')) + '</span></div>' +
          '<p class="kpi-sub">' + esc(t('toll.avoided', { n: num(avoided) })) + '</p>' +
          stackedBar(segments, total) + legendList(segments, total) +
          (unjudged > 0 ? line(t('load.unjudged', { n: num(unjudged) })) : '')
      }

      function countCell (value, cls) {
        var n = value || 0
        return '<td class="' + (n === 0 ? 'zero' : (cls || '')) + '">' + esc(num(n)) + '</td>'
      }
      function renderInterventions (w) {
        var verdict = w.byVerdict || {}
        var table = w.interventions || {}
        var rows = table.rows || []
        var sub = line(t('interv.sub', {
          ask: num(verdict.ask || 0), deny: num(verdict.deny || 0), advise: num(verdict.advise || 0), total: num(w.totalDecisions || 0)
        }), 'kpi-sub')
        if (rows.length === 0) {
          el('interventions-body').innerHTML = sub + line(t('interv.none'), 'empty-line')
          return
        }
        var body = rows.map(function (r) {
          return '<tr><td title="' + esc(r.commandFamily) + '">' + esc(r.commandFamily) + '</td>' +
            countCell(r.ask) + countCell(r.deny, 'deny') + countCell(r.notRun) + '</tr>'
        })
        if (table.rest) {
          var restLabel = esc(t('interv.rest', { n: num(table.rest.families) }))
          body.push('<tr class="agg"><td title="' + restLabel + '">' + restLabel + '</td>' +
            countCell(table.rest.ask) + countCell(table.rest.deny, 'deny') + countCell(table.rest.notRun) + '</tr>')
        }
        var quiet = table.quiet || { families: 0, total: 0 }
        var hasNotRun = rows.some(function (r) { return r.notRun > 0 }) || !!(table.rest && table.rest.notRun > 0)
        el('interventions-body').innerHTML = sub +
          '<table class="itable"><colgroup><col><col class="n"><col class="n"><col class="n"></colgroup>' +
          '<thead><tr><th scope="col">' + esc(t('interv.family')) + '</th><th scope="col">' + esc(t('interv.ask')) +
          '</th><th scope="col">' + esc(t('interv.deny')) + '</th><th scope="col">' + esc(t('interv.notRun')) + '</th></tr></thead>' +
          '<tbody>' + body.join('') + '</tbody></table>' +
          (quiet.families > 0 ? line(t('interv.quiet', { n: num(quiet.families), total: num(quiet.total) })) : '') +
          (hasNotRun ? line(t('interv.notRunFoot')) : '')
      }

      function renderApprovals (approvals) {
        var asked = approvals.asked || 0
        if (asked <= 0) { el('approvals-body').innerHTML = line(t('approvals.empty'), 'empty-line'); return }
        var segments = [
          { value: approvals.approved || 0, cls: 'v1', label: t('approvals.approved') },
          { value: approvals.rejected || 0, cls: 'vd', label: t('approvals.rejected') },
          { value: approvals.notRun || 0, cls: 'v3', label: t('approvals.notRun') },
          // The fourth bucket: asked, still inside the wait window, with no
          // answer yet. Without it the bar/legend covered only part of
          // `asked` for as long as any prompt was still pending.
          { value: approvals.awaiting || 0, cls: 'v2', label: t('approvals.awaiting') }
        ]
        var parts = [stackedBar(segments, asked), legendList(segments, asked)]
        // P7: the uncertainty stays in the copy, and only when the count is
        // non-zero -- explaining zero of something is noise.
        if ((approvals.notRun || 0) > 0) parts.push(line(t('approvals.notRunHint')))

        var ceiling = approvals.ceiling || {}
        if (ceiling.suggestedCeiling != null) {
          parts.push(hbars([
            { label: t('approvals.highestApproved'), value: ceiling.highestApproved },
            { label: t('approvals.lowestRejected'), value: ceiling.lowestRejected },
            { label: t('approvals.suggestedCeiling'), value: ceiling.suggestedCeiling }
          ], 'v2'))
          parts.push(line(t('approvals.evidenceCount', {
            approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
          })))
        } else if ((ceiling.approvedCount || 0) === 0 || (ceiling.rejectedCount || 0) === 0) {
          parts.push(line(t('approvals.noSuggestionInsufficient', {
            approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
          })))
        } else {
          parts.push(line(t('approvals.noSuggestionOverlap', {
            highest: String(ceiling.highestApproved), lowest: String(ceiling.lowestRejected),
            approved: String(ceiling.approvedCount || 0), rejected: String(ceiling.rejectedCount || 0)
          })))
        }
        el('approvals-body').innerHTML = parts.join('')
      }

      function renderSpeed (ab) {
        var samples = (ab && ab.sampleCount) || 0
        if (samples <= 0) { fill('speed-body', 'speed-empty', '', t('speed.empty')); return }

        // The model is named, never called "the big model": the id comes
        // straight off the comparison rows. More than one id in the window
        // is possible (a config change mid-run), so they are all shown.
        var modelIds = (ab.modelIds || [])
        var modelName = modelIds.length > 0 ? modelIds.join(' / ') : t('stats.na')

        var chart = compareBars([
          { name: t('speed.jev'), valueMs: ab.jevLatency && ab.jevLatency.medianMs, cls: 'v1' },
          { name: modelName, valueMs: ab.bigModelLatency && ab.bigModelLatency.medianMs, cls: 'v3' }
        ])

        var parts = [chart, line(t('speed.samples', { n: String(samples) }))]
        if (typeof ab.agreementCount === 'number') {
          parts.push(line(t('speed.agreement', { agree: String(ab.agreementCount), n: String(samples) })))
        }
        var disagreements = ab.disagreements || []
        if (disagreements.length > 0) {
          parts.push('<p class="cmp-foot">' + esc(t('speed.disagreementsHeading')) + ' ' +
            disagreements.map(function (d) {
              return esc(t('speed.disagreement', {
                count: String(d.count), jev: String(d.jevVerdict), model: String(d.bigModelVerdict)
              }))
            }).join(' · ') + '</p>')
        }
        if ((ab.failureCount || 0) > 0) {
          parts.push(line(t('speed.failures', { n: String(ab.failureCount) })))
        }

        var jevTokens = ab.jevTokens || {}
        var bigTokens = ab.bigModelTokens || {}
        if (typeof jevTokens.inputTotal === 'number' && typeof bigTokens.outputTotal === 'number') {
          var loadedContext = (bigTokens.cacheCreationInputTotal || 0) + (bigTokens.cacheReadInputTotal || 0)
          parts.push('<div class="divider" style="margin-top:10px;padding-top:8px">' +
            '<h2>' + esc(t('speed.tokensHeading')) + '</h2>' +
            hbars([
              { label: t('speed.tokensRowJev'), value: (jevTokens.inputTotal || 0) + (jevTokens.outputTotal || 0) },
              { label: t('speed.tokensRowAnswer'), value: (bigTokens.inputTotal || 0) + (bigTokens.outputTotal || 0) },
              { label: t('speed.tokensRowContext'), value: loadedContext }
            ], 'v1') +
            line(t('speed.tokensJev', { in: num(jevTokens.inputTotal || 0), out: num(jevTokens.outputTotal || 0) })) +
            line(t('speed.tokensBig', {
              model: modelName, in: num(bigTokens.inputTotal || 0),
              out: num(bigTokens.outputTotal || 0), cache: num(loadedContext)
            })) +
            line(t('speed.tokensNote')) + '</div>')
        }
        fill('speed-body', 'speed-empty', parts.join(''), '')
      }

      /** rows: [{ label, value }] as labelled numbers, for figures that
       *  share no unit and so must not be drawn on one bar scale. The
       *  number is printed before its label (`column-reverse` keeps the
       *  `<dt>` first for assistive technology). */
      function figures (rows) {
        return '<dl class="figures">' + rows.map(function (r) {
          return '<div class="figure"><dt>' + esc(r.label) + '</dt><dd>' + esc(num(r.value)) + '</dd></div>'
        }).join('') + '</dl>'
      }

      function renderSkills (mod) {
        if (!((mod.totalDecisions || 0) > 0)) { fill('skills-body', null, '', t('stats.skillsEmpty')); return }
        var rows = [{ label: t('stats.skillSuggestions'), value: mod.suggestedCount || 0 }]
        if (mod.listingCharsTotal != null) {
          rows.push({ label: t('stats.listingChars'), value: mod.listingCharsTotal })
        }
        var parts = [figures(rows)]
        parts.push(line(t('stats.skillMatchRate') + ': ' +
          (mod.matchRate == null ? t('stats.na') : pct(mod.matchRate) + '%')))
        fill('skills-body', null, parts.join(''), '')
      }

      // ---------- render: consumption (JEV-060 slice 1, T5) -----------------
      // Three honest states, never two -- same convention config.html's own
      // modelsRenderMeasurements already uses for modelMeasurements: no
      // summary yet (or a genuine ok:true empty payload) reads as "no data
      // yet"; ok:false reads as its own distinct failure sentence; only a
      // real ok:true payload with real numbers ever renders the populated
      // card. Every number below comes straight from consumptionSummary
      // (main.mjs's publishConsumptionSummary / read-consumption.mjs), never
      // invented -- a null field renders as consumption.na, never a
      // fabricated zero.

      /** A percentage row using the same .hrow/.htrack/.hfill markup as
       *  hbars() above, but for a value that IS already the percentage to
       *  show (0-100 or null) -- hbars itself scales against the largest row
       *  in its own list, which is the wrong shape for an independent share
       *  or quota percentage. */
      function barRow (label, percent, cls) {
        var rounded = (percent === null || percent === undefined || !isFinite(percent)) ? null : Math.round(percent * 10) / 10
        var widthPercent = rounded === null ? 0 : Math.min(100, Math.max(0, rounded))
        var valueText = rounded === null ? t('consumption.na') : (rounded + '%')
        return '<div class="hrow v1">' +
          '<span class="hl" title="' + esc(label) + '">' + esc(label) + '</span>' +
          '<span class="htrack"><span class="hfill ' + (cls || 'v1') + '" style="width:' + widthPercent + '%"></span></span>' +
          '<span class="hv">' + esc(valueText) + '</span></div>'
      }

      /** `resetsAt` is epoch milliseconds (verified by hand against a real
       *  `orca account list --json` fixture in main.test.mjs -- 13-digit
       *  values in the current era), never an ISO string or epoch seconds --
       *  `new Date(ms)` is the correct read. `null`/unparseable renders as
       *  consumption.na via the caller, never a raw epoch number. */
      function formatResetsAt (resetsAtMs) {
        if (typeof resetsAtMs !== 'number' || !isFinite(resetsAtMs)) return null
        var date = new Date(resetsAtMs)
        if (isNaN(date.getTime())) return null
        try {
          return date.toLocaleString(currentLocale === 'es' ? 'es-ES' : 'en-US',
            { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
        } catch (error) {
          return date.toISOString()
        }
      }

      /** The current model catalog (seed/models.json), shortened for this
       *  card's compact rows -- the catalog's own `label` carries a
       *  redundant "Claude " prefix ("Claude Sonnet 5") that this card drops.
       *  An id outside this small known set (a future or renamed model)
       *  falls back to itself, never blank -- see friendlyModelName below. */
      var MODEL_FRIENDLY_NAMES = {
        'claude-fable-5-1': 'Fable 5.1',
        'claude-opus-5-5': 'Opus 5.5',
        'claude-sonnet-5': 'Sonnet 5',
        'claude-haiku-4-5-20251001': 'Haiku 4.5'
      }

      /** The friendly label for a model id, or the id itself when it is not
       *  in MODEL_FRIENDLY_NAMES -- the raw id is never lost, it just moves
       *  to the caller's `title` attribute instead of the visible text. */
      function friendlyModelName (id) {
        return MODEL_FRIENDLY_NAMES[id] || id
      }

      /** One model's input/cache-read/cache-write/output shares -- each a
       *  0..1 fraction of that model's OWN total tokens (src/core/
       *  consumption.ts's own doc on ModelUsageShare), never a share of the
       *  window's whole traffic. All four together account for the model's
       *  own total, so the four rendered bars sum to ~100% -- rendering
       *  fewer than four is exactly what let a Sonnet row read as 74+10+5=89
       *  before `inputShare` existed. `pct()` both converts to a percent and
       *  rounds. The visible name is friendly (friendlyModelName); the raw
       *  id a person would need to cross-reference elsewhere lives in the
       *  same element's `title`, never dropped. */
      function consumptionModelBlock (modelShare) {
        return '<p class="kpi-sub"><b title="' + esc(modelShare.model) + '">' + esc(friendlyModelName(modelShare.model)) + '</b> · ' +
          esc(t('consumption.steps', { n: num(modelShare.stepCount) })) + '</p>' +
          '<div class="hrows">' +
            barRow(t('consumption.input'), pct(modelShare.inputShare), 'v1') +
            barRow(t('consumption.cacheRead'), pct(modelShare.cacheReadShare), 'v2') +
            barRow(t('consumption.cacheWrite'), pct(modelShare.cacheWriteShare), 'v3') +
            barRow(t('consumption.output'), pct(modelShare.outputShare), 'v1') +
          '</div>'
      }

      /** The label a quota row shows in place of the raw account id: the
       *  account's `email` as `orca account list --json` reports it, joined
       *  on by the worker (main.mjs's withAccountEmails,
       *  odd/tasks/board-tabs-and-names.md T1) -- for a custom-endpoint
       *  account that field is Orca's own endpoint label, shown as-is.
       *  Without one: "This computer" for `home` (kept in case a future quota
       *  source ever reports it -- today's CLI never does), else "Account "
       *  plus the id's first 8 characters, same truncation
       *  `accountConfigTarget` (src/core/orca_accounts.ts) uses for its own
       *  `label`. The raw id is never lost -- it moves to the element's
       *  `title`. */
      function accountShortLabel (account) {
        if (typeof account.email === 'string' && account.email.length > 0) return account.email
        return account.id === 'home' ? t('consumption.accountHome') : t('consumption.accountLabel', { id: String(account.id).slice(0, 8) })
      }

      /** One quota account's session/weekly usage bars and its weekly reset
       *  time. `sessionUsedPercent`/`weeklyUsedPercent` are already 0-100
       *  percentages on the wire (main.mjs's accountQuotaEntry mirrors
       *  `orca account list --json`'s own usedPercent fields verbatim), unlike
       *  the 0..1 fractions above -- passed to barRow directly, never through
       *  pct(). */
      function consumptionQuotaBlock (account) {
        var label = accountShortLabel(account)
        var heading = account.status ? (label + ' · ' + account.status) : label
        var resetText = formatResetsAt(account.resetsAt)
        return '<p class="kpi-sub"><b title="' + esc(account.id) + '">' + esc(heading) + '</b></p>' +
          '<div class="hrows">' +
            barRow(t('consumption.session'), account.sessionUsedPercent, 'v1') +
            barRow(t('consumption.weekly'), account.weeklyUsedPercent, 'v3') +
          '</div>' +
          line(t('consumption.resetsAt', { when: resetText || t('consumption.na') }))
      }

      /**
       * The plain-language recommendations, gated key-by-key: a trigger's
       * key is present in `recommendations` only when the worker actually
       * had real data for it (mcpServerCount is the one exception -- see
       * src/core/consumption.ts's own doc, 0 is honest data there). A
       * present trigger with `overThreshold: false` still gets a quiet
       * confirming line (for longSession/subagentShare -- reassurance that
       * real data was checked and it is fine) rather than nothing; the
       * MCP server count is purely informational and never takes the
       * `.stale` warning tone, since the brief specifies no threshold for
       * it.
       */
      function consumptionRecommendationLines (recommendations) {
        var recs = recommendations || {}
        var parts = []
        if (recs.claudeMdSize) {
          parts.push(line(t('consumption.claudeMdSize', { tokens: num(Math.round(recs.claudeMdSize.estimatedTokens)) }),
            recs.claudeMdSize.overThreshold ? 'stale' : 'empty-line'))
          if (recs.claudeMdSize.overThreshold) parts.push(line(t('consumption.claudeMdSizeSuggestion'), 'stale'))
        }
        if (recs.mcpServerCount) {
          parts.push(line(t('consumption.mcpServerCount', { count: num(recs.mcpServerCount.count) }), 'empty-line'))
        }
        if (recs.longSession) {
          var longSessionKey = recs.longSession.overThreshold ? 'consumption.longSessionWarning' : 'consumption.longSessionOk'
          parts.push(line(t(longSessionKey, { tokens: num(Math.round(recs.longSession.avgMainStepContextReread)) }),
            recs.longSession.overThreshold ? 'stale' : 'empty-line'))
        }
        if (recs.subagentShare) {
          var subagentShareKey = recs.subagentShare.overThreshold ? 'consumption.subagentShareWarning' : 'consumption.subagentShareOk'
          parts.push(line(t(subagentShareKey, { percent: String(Math.round(recs.subagentShare.subagentSharePercent * 10) / 10) }),
            recs.subagentShare.overThreshold ? 'stale' : 'empty-line'))
        }
        return parts.join('')
      }

      /** The router's own three decision points and four tiers (JEV-060
       *  slice 2, §3/§4), in the fixed order the spec lists them -- never
       *  derived from whatever keys happen to be present, so an empty point
       *  or tier still has a place in the layout rather than reordering
       *  around whatever the log happened to contain. Tier wording matches
       *  src/core/i18n_model_router.ts's own "stage.*" status-line words
       *  (consultar/implementar/analizar/razonar a fondo) on purpose -- the
       *  same tier must read the same word wherever the person sees it. */
      var MODEL_ROUTER_POINTS = ['start', 'stage', 'subagent']
      var MODEL_ROUTER_POINT_KEYS = {
        start: 'consumption.modelRouterPointStart',
        stage: 'consumption.modelRouterPointStage',
        subagent: 'consumption.modelRouterPointSubagent'
      }
      var MODEL_ROUTER_TIERS = ['simple', 'standard', 'complex', 'frontier']
      var MODEL_ROUTER_TIER_KEYS = {
        simple: 'consumption.modelRouterTierSimple',
        standard: 'consumption.modelRouterTierStandard',
        complex: 'consumption.modelRouterTierComplex',
        frontier: 'consumption.modelRouterTierFrontier'
      }

      /** One decision point's tier counts as hbars() rows -- a point with
       *  every tier at zero renders no bars at all (hbars' own "max <= 0"
       *  guard), so a point with no decisions yet is left out of the
       *  section entirely rather than shown as four empty bars. */
      function modelRouterPointRows (counts) {
        return MODEL_ROUTER_TIERS.map(function (tier) {
          return { label: t(MODEL_ROUTER_TIER_KEYS[tier]), value: (counts && counts[tier]) || 0 }
        })
      }

      /**
       * The board's "Model router" subsection (JEV-060 slice 2, §8, T9):
       * `modelRouter` is `summarizeRouterDecisions`'s own summary
       * (read-consumption.mjs), or `null`/`undefined` when no
       * model-router-decisions-*.jsonl file exists at all (the router has
       * never run, or is `off`) -- rendered as one honest line, never a
       * zeroed-out summary that would look like a router that ran and
       * decided nothing.
       */
      function consumptionModelRouterBlock (modelRouter) {
        if (!modelRouter) return line(t('consumption.modelRouterEmpty'), 'empty-line')

        var parts = []
        var anyPoint = false
        MODEL_ROUTER_POINTS.forEach(function (point) {
          var bars = hbars(modelRouterPointRows(modelRouter.byPoint && modelRouter.byPoint[point]), 'v2')
          if (!bars) return
          anyPoint = true
          parts.push('<p class="kpi-sub"><b>' + esc(t(MODEL_ROUTER_POINT_KEYS[point])) + '</b></p>' + bars)
        })
        if (!anyPoint) parts.push(line(t('consumption.modelRouterNoDecisions'), 'empty-line'))

        parts.push(line(t('consumption.modelRouterAppliedMeasured', { applied: num(modelRouter.applied), measured: num(modelRouter.measured) })))
        // Never a negative "saving": a total below zero is what the
        // switches cost (review finding 8), and the line always says what
        // the estimate covers.
        var estimate = modelRouter.savedEstimate
        if (estimate === null || estimate === undefined) {
          parts.push(line(t('consumption.modelRouterNoEstimateYet'), 'empty-line'))
        } else {
          parts.push(line(t(estimate < 0 ? 'consumption.modelRouterExtraCost' : 'consumption.modelRouterSavedEstimate', { amount: Math.abs(estimate).toFixed(2) })))
          parts.push(line(t('consumption.modelRouterEstimateScope'), 'empty-line'))
        }
        return parts.join('')
      }

      /**
       * The context steward (odd/tasks/jev-context-steward.md): the last
       * 24h's compactions, and an ESTIMATE of the context each one took off
       * every later step (per step, never multiplied: the logs carry no
       * session id). `steward` null: no log yet, one honest line.
       */
      function consumptionStewardBlock (steward) {
        if (!steward) return line(t('consumption.stewardEmpty'), 'empty-line')
        var parts = [line(t('consumption.stewardApplied', { applied: num(steward.applied), would: num(steward.wouldCompact) }))]
        parts.push(steward.freedPerStep === null || steward.freedPerStep === undefined
          ? line(t('consumption.stewardNoFreed'), 'empty-line')
          : line(t('consumption.stewardFreed', { tokens: num(steward.freedPerStep) })))
        return parts.join('')
      }

      /**
       * `summary`: the raw `consumptionSummary` storage value, or `null`
       * before the worker's first publish. Primary window: last24h when it
       * has any steps, else last7d -- last24h is the more actionable window,
       * but falling back avoids showing "no data" right after an hour/day
       * boundary when the 7-day window still has real history. The four
       * recommendation triggers are NOT re-derived from this choice: they
       * come straight from `recommendations`, which read-consumption.mjs
       * always computes from last24h specifically (its own trigger
       * functions), independent of which window this function picks to
       * display the raw per-model/context/subagent numbers.
       */
      function renderConsumption (summary) {
        if (!summary) { fill('consumption-body', 'consumption-empty', '', t('consumption.empty')); return }
        if (summary.ok === false) { fill('consumption-body', 'consumption-empty', '', t('consumption.unavailable')); return }

        var usage = summary.usage || {}
        var last24h = usage.last24h || { stepCount: 0, byModel: [], avgMainStepContextReread: null, subagentShare: null }
        var last7d = usage.last7d || { stepCount: 0, byModel: [], avgMainStepContextReread: null, subagentShare: null }
        var quota = summary.quota || { accounts: [], checkedAt: null }
        var accounts = Array.isArray(quota.accounts) ? quota.accounts : []
        var hasUsage = (last24h.stepCount || 0) > 0 || (last7d.stepCount || 0) > 0
        var hasQuota = accounts.length > 0
        var hasModelRouter = !!summary.modelRouter
        var hasSteward = !!summary.steward

        if (!hasUsage && !hasQuota && !hasModelRouter && !hasSteward) {
          fill('consumption-body', 'consumption-empty', '', t('consumption.empty'))
          return
        }

        var w = (last24h.stepCount || 0) > 0 ? last24h : last7d
        var parts = []

        parts.push('<p class="kpi-sub"><b>' + esc(t('consumption.usageHeading')) + '</b></p>')
        if (w.byModel && w.byModel.length > 0) {
          parts.push(w.byModel.map(consumptionModelBlock).join('<div class="divider"></div>'))
        } else {
          parts.push(line(t('consumption.noModelData'), 'empty-line'))
        }
        parts.push(w.avgMainStepContextReread === null
          ? line(t('consumption.noContextData'), 'empty-line')
          : line(t('consumption.avgContext', { tokens: num(Math.round(w.avgMainStepContextReread)) })))
        parts.push(w.subagentShare === null
          ? line(t('consumption.noSubagentData'), 'empty-line')
          : line(t('consumption.subagentSplit', { percent: String(Math.round(w.subagentShare * 1000) / 10) })))

        if (hasQuota) {
          parts.push('<div class="divider"></div><p class="kpi-sub"><b>' + esc(t('consumption.quotaHeading')) + '</b></p>')
          parts.push(accounts.map(consumptionQuotaBlock).join('<div class="divider"></div>'))
        }

        var recLines = consumptionRecommendationLines(summary.recommendations)
        if (recLines) {
          parts.push('<div class="divider"></div><p class="kpi-sub"><b>' + esc(t('consumption.recommendationsHeading')) + '</b></p>')
          parts.push(recLines)
        }

        parts.push('<div class="divider"></div><p class="kpi-sub"><b>' + esc(t('consumption.modelRouterHeading')) + '</b></p>')
        parts.push(consumptionModelRouterBlock(summary.modelRouter))

        parts.push('<div class="divider"></div><p class="kpi-sub"><b>' + esc(t('consumption.stewardHeading')) + '</b></p>')
        parts.push(consumptionStewardBlock(summary.steward))

        fill('consumption-body', 'consumption-empty', parts.join(''), '')
      }

      // ---------- render: activity per project (JEVADV-63) --------------------
      // `activityByProjectSummary`'s own shape (src/core/activity_by_project.ts,
      // adapters/orca/read-activity.mjs): {ok, projects: ProjectActivity[]
      // (aggregateActivityByProject's own ranking -- lastActivityAt descending,
      // ties by total interactions -- NEVER re-sorted here), corruptLines,
      // checkedAt} or {ok:false, reason, detail, checkedAt}. Empty state is
      // {ok:true, projects:[], ...}. Same null/ok:false/empty three-way split
      // as renderConsumption above.
      var ACTIVITY_TOP_N = 6
      var activityExpanded = false
      var lastActivitySummary = null

      /** One day's combined interaction count -- judged commands plus main
       *  and subagent steps, the same combination
       *  aggregateActivityByProject's own ranking already sums (its
       *  totalInteractions()), reused here as the 7-day chart's one
       *  magnitude per bar (dataviz skill: discrete daily points of one
       *  magnitude -> a bar-per-day strip, one hue, board.html's own .v1).
       *  Different KINDS of count folded into one total is not the same
       *  thing the "no shared scale" rule forbids -- that rule is about
       *  tokens/cost/steps never sharing one AXIS (see activityTokensBlock,
       *  activityRouterLine below), not about two event counts summing to
       *  one total. */
      function activityDayTotal (day) {
        return (day.judgedCommands || 0) + (day.mainSteps || 0) + (day.subagentSteps || 0)
      }

      /** dataviz skill mark spec: bars <=24px thick, a 4px rounded data-end
       *  square at the baseline, grown from a single baseline. One hue
       *  (.v1) -- a single series needs no legend box. Every bar keeps a
       *  native SVG <title> (day: value), the cheapest possible hover
       *  affordance with no chart library and no custom JS reaching this
       *  sandboxed panel. A day with nothing in it still gets its slot (the
       *  Decisions section: "always 7 entries even when a day is empty"),
       *  drawn as a flat hairline at the baseline, never omitted. */
      function activityChart (project, days) {
        var BAR_W = 10, GAP = 3, MAX_H = 22, BASELINE = 26, RADIUS = 3
        var values = days.map(activityDayTotal)
        var max = values.reduce(function (m, v) { return Math.max(m, v) }, 0)
        var width = days.length * BAR_W + (days.length - 1) * GAP
        var bars = days.map(function (d, i) {
          var value = values[i]
          var x = i * (BAR_W + GAP)
          var titleText = esc(d.day) + ': ' + num(value)
          if (max <= 0 || value <= 0) {
            return '<rect x="' + x + '" y="' + (BASELINE - 1) + '" width="' + BAR_W + '" height="1"><title>' + titleText + '</title></rect>'
          }
          var h = Math.max(2, Math.round((value / max) * MAX_H))
          var r = Math.min(RADIUS, h, BAR_W / 2)
          var yTop = BASELINE - h
          var pathD = 'M' + x + ',' + BASELINE +
            ' L' + x + ',' + (yTop + r) +
            ' Q' + x + ',' + yTop + ' ' + (x + r) + ',' + yTop +
            ' L' + (x + BAR_W - r) + ',' + yTop +
            ' Q' + (x + BAR_W) + ',' + yTop + ' ' + (x + BAR_W) + ',' + (yTop + r) +
            ' L' + (x + BAR_W) + ',' + BASELINE + ' Z'
          return '<path d="' + pathD + '"><title>' + titleText + '</title></path>'
        }).join('')
        var judgedTotal = days.reduce(function (s, d) { return s + (d.judgedCommands || 0) }, 0)
        var stepsTotal = days.reduce(function (s, d) { return s + (d.mainSteps || 0) + (d.subagentSteps || 0) }, 0)
        var label = t('activity.chartAriaLabel', { project: projectLabel(project), judged: activityCount(judgedTotal, 'activity.judged'), steps: activityCount(stepsTotal, 'activity.steps') })
        return {
          svg: '<svg class="act-chart v1" viewBox="0 0 ' + width + ' 28" width="' + width + '" height="28" role="img" aria-label="' + esc(label) + '">' + bars + '</svg>',
          judgedTotal: judgedTotal,
          stepsTotal: stepsTotal
        }
      }

      /** Allowed/advised/asked/blocked as labelled numbers, never a stacked
       *  bar (odd/tasks/jev-063-activity.md Decisions: four different-
       *  meaning counts, not one whole). Only blocked borrows .vd's own
       *  --viz variable for its <dd> text colour; the rest stay the normal
       *  text colour -- no new hue, no background fill. Advised once took
       *  .v3 (--ring), the palette's faintest neutral, and a nonzero count
       *  in it read as disabled (release screenshot pass, 2026-09-28).
       *  A zero count never takes the colour: a red "0" reads as an alarm
       *  for something that didn't happen. */
      /** "1 step" / "3 steps": `base` + One|Other, with the count formatted. */
      function activityCount (n, base) {
        return t(base + (n === 1 ? 'One' : 'Other'), { n: num(n) })
      }

      function activityGateFigures (outcomes) {
        var o = outcomes || {}
        var rows = [
          { cls: '', label: t('activity.gateAllowed'), value: o.allowed || 0 },
          { cls: '', label: t('activity.gateAdvised'), value: o.advised || 0 },
          { cls: '', label: t('activity.gateAsked'), value: o.asked || 0 },
          { cls: (o.blocked || 0) > 0 ? 'vd' : '', label: t('activity.gateBlocked'), value: o.blocked || 0 }
        ]
        return '<dl class="figures">' + rows.map(function (r) {
          return '<div class="figure ' + r.cls + '"><dt>' + esc(r.label) + '</dt><dd>' + esc(num(r.value)) + '</dd></div>'
        }).join('') + '</dl>'
      }

      /** Compact per-model token counts plus an estimated cost, no bar
       *  (four different units: four token kinds and a dollar estimate) --
       *  reuses friendlyModelName/figures/line exactly as
       *  consumptionModelBlock does, without its percentage bars (those
       *  describe one model's own share of its own total; this is raw
       *  counts). A project with no turn-usage rows in the window has an
       *  empty tokensByModel array -- an honestly empty section, so this
       *  returns '' rather than a lone "$0.00 estimated" with nothing to
       *  break down. */
      function activityTokensBlock (tokensByModel, totalCost) {
        var models = tokensByModel || []
        if (models.length === 0) return ''
        var rows = models.map(function (m) {
          return '<div class="act-model"><p class="kpi-sub"><b title="' + esc(m.model) + '">' + esc(friendlyModelName(m.model)) + '</b></p>' +
            figures([
              { label: t('consumption.input'), value: m.input || 0 },
              { label: t('consumption.output'), value: m.output || 0 },
              { label: t('consumption.cacheRead'), value: m.cacheRead || 0 },
              { label: t('consumption.cacheWrite'), value: m.cacheWrite || 0 }
            ]) +
            line(t('activity.estimatedCost', { amount: (m.estimatedCostUsd || 0).toFixed(2) })) +
            '</div>'
        }).join('')
        return rows + line(t('activity.totalEstimatedCost', { amount: (totalCost || 0).toFixed(2) }))
      }

      /** "N switches, ~$X saved/extra cost (estimate)" -- reuses the exact
       *  never-negative-saving convention consumptionModelRouterBlock above
       *  already applies (Math.abs + relabel to "extra cost" below zero),
       *  never reimplementing the math. `router` is null when the project
       *  has no router-decision rows in the window at all (never a fake
       *  zero row), in which case this whole line is omitted. */
      function activityRouterLine (router) {
        if (!router) return ''
        var estimate = router.savedEstimate
        if (estimate === null || estimate === undefined) {
          return line(t('activity.routerNoEstimate', { switches: num(router.applied) }))
        }
        var key = estimate < 0 ? 'activity.routerCost' : 'activity.routerSaved'
        return line(t(key, { switches: num(router.applied), amount: Math.abs(estimate).toFixed(2) }))
      }

      function activityProjectCard (entry) {
        var chart = activityChart(entry.project, entry.days)
        var name = projectLabel(entry.project)
        var ageHtml = entry.lastActivityAt ? '<span class="act-age">' + esc(ago(entry.lastActivityAt)) + '</span>' : ''
        return '<article class="card act-card">' +
          '<div class="act-card-head"><span class="act-name" title="' + esc(name) + '">' + esc(name) + '</span>' + ageHtml + '</div>' +
          '<div class="act-chart-wrap">' + chart.svg +
            '<div><span class="act-chart-total">' + esc(num(chart.judgedTotal + chart.stepsTotal)) + '</span><br>' +
            '<span class="cmp-foot">' + esc(t('activity.weekBreakdown', { judged: activityCount(chart.judgedTotal, 'activity.judged'), steps: activityCount(chart.stepsTotal, 'activity.steps') })) + '</span></div>' +
          '</div>' +
          activityGateFigures(entry.gateOutcomes) +
          activityTokensBlock(entry.tokensByModel, entry.totalEstimatedCostUsd) +
          activityRouterLine(entry.router) +
        '</article>'
      }

      /** Top ACTIVITY_TOP_N projects, in the array's own pre-ranked order
       *  (never re-sorted here -- see the module comment above), plus a
       *  "show more" toggle for the rest, the same interaction pattern as
       *  the live-status list's own toggle (a button, aria-expanded, focus
       *  returned to the button after re-render) under its own class/id
       *  names so the two never collide. */
      function renderActivityProjects (summary) {
        lastActivitySummary = summary
        if (!summary) { fill('projects-body', 'projects-empty', '', t('activity.empty')); return }
        if (summary.ok === false) { fill('projects-body', 'projects-empty', '', t('activity.unavailable')); return }
        var projects = Array.isArray(summary.projects) ? summary.projects : []
        if (projects.length === 0) { fill('projects-body', 'projects-empty', '', t('activity.empty')); return }
        var shown = activityExpanded ? projects : projects.slice(0, ACTIVITY_TOP_N)
        var extra = projects.length - ACTIVITY_TOP_N
        var list = '<div class="act-projects" id="projects-list">' + shown.map(activityProjectCard).join('') + '</div>'
        var toggle = extra > 0
          ? '<button type="button" class="act-toggle" data-activity-toggle aria-controls="projects-list" aria-expanded="' + (activityExpanded ? 'true' : 'false') + '">' +
            esc(activityExpanded ? t('activity.showLess') : t('activity.showMore', { n: String(extra) })) + '</button>'
          : ''
        fill('projects-body', 'projects-empty', list + toggle, '')
      }

      // One listener for the toggle, which is re-rendered with the cards;
      // the same pattern as cardsEl's own live-toggle listener below.
      el('projects-body').addEventListener('click', function (event) {
        var button = event.target && event.target.closest ? event.target.closest('[data-activity-toggle]') : null
        if (!button) return
        activityExpanded = !activityExpanded
        renderActivityProjects(lastActivitySummary)
        var again = el('projects-body').querySelector('[data-activity-toggle]')
        if (again) again.focus()
      })

      function renderUnmeasured () {
        el('unmeasured-body').innerHTML = [
          'unmeasured.money', 'unmeasured.extrapolation',
          'unmeasured.quality', 'unmeasured.counterfactual'
        ].map(function (key) { return '<li>' + esc(t(key)) + '</li>' }).join('')
      }

      function renderRecent (gate) {
        var recent = gate.recent || []
        if (recent.length === 0) {
          el('stats-recent').innerHTML = line(t('stats.recentEmpty'), 'empty-line')
          return
        }
        var sourceLabel = {
          'local-rule': t('stats.recentLocalRule'), cache: t('stats.recentCached'),
          jev: t('stats.recentJev'), none: t('stats.recentNone')
        }
        // 'advise' (the advise-model release): the model was refused this
        // one attempt and handed a reason, but nobody was interrupted --
        // its own state, own label, never `done`'s green (a clean pass) and
        // never `blocked`'s red (nothing was permanently refused). Every
        // OTHER verdict keeps printing its own raw word, unchanged.
        var verdictState = { deny: 'blocked', ask: 'working', advise: 'advised' }
        var verdictLabel = { advise: t('stats.recentAdvise') }
        // Family, source, verdict, age: the project moves to the tooltip and
        // the full timestamp is gone -- "4 min ago" is what a person scans.
        el('stats-recent').innerHTML = '<ul class="recent-list">' + recent.map(function (r) {
          var latency = r.latencyMs != null ? ' · ' + ms(r.latencyMs) + ' ms' : ''
          return '<li title="' + esc(projectLabel(r.project)) + '">' +
            '<span class="tag">' + esc(r.commandFamily || '') + '</span>' +
            '<span class="tag">' + esc((sourceLabel[r.source] || r.source || '') + latency) + '</span>' +
            '<span class="' + tagClass(verdictState[r.verdict] || 'done') + '">' +
            esc(verdictLabel[r.verdict] || r.verdict || '') + '</span>' +
            '<span class="when">' + esc(ago(r.at)) + '</span></li>'
        }).join('') + '</ul>'
      }

      function show (id, visible) { el(id).style.display = visible ? '' : 'none' }

      // Whether the board has anything to say beyond its empty state.
      var hasMeasurements = false

      function renderStats (summary, policiesWithoutKind) {
        lastStats = summary
        lastPoliciesWithoutKind = policiesWithoutKind || null
        var ok = !!(summary && summary.ok)
        var gate = (ok && summary.gate) || {}
        var mod = (ok && summary.modSkills) || {}
        var ab = (ok && summary.abBenchmark) || {}
        var windows = gate.windows || null
        var hasGate = !!(windows && windows.all && windows.all.totalDecisions > 0)
        var hasSpeed = (ab.sampleCount || 0) > 0
        var hasSkills = (mod.totalDecisions || 0) > 0
        hasMeasurements = hasGate || hasSpeed || hasSkills
        // JEVADV-49: at least one stored team policy has no kind (a config-
        // panel save can silently strip it -- see main.mjs's own
        // publishPoliciesWithoutKindStatus). This must be visible even on a
        // machine with no gate decisions measured yet, so it gets its own
        // reason to show the status card, independent of hasGate.
        var kindIssue = !!(lastPoliciesWithoutKind && lastPoliciesWithoutKind.count > 0)

        // An empty log gets one card that says why, never a column of empty
        // sections and never a zero standing in for "nothing yet". With tabs
        // (odd/tasks/board-tabs-and-names.md T2) that rule holds per tab:
        // Gate's is card-empty, and the live, activity, consumption and
        // skills cards always show, each saying in its own words that
        // nothing is there yet -- otherwise the Activity or Skills tab
        // would open blank. card-projects (JEVADV-63) manages its own empty
        // state through renderActivityProjects, fed by its own storage key
        // (activityByProjectSummary), not by hasGate/hasSkills.
        show('card-empty', !hasGate)
        el('empty-body').textContent = t('empty.body')
        show('windows', hasGate)
        show('card-status', hasGate || kindIssue)
        show('card-recent', hasGate)
        show('card-speed', hasMeasurements)
        show('card-unmeasured', hasMeasurements)

        var key = activeWindowKey(windows)
        var w = (windows && windows[key]) || {}
        show('top', hasGate && w.totalDecisions > 0)
        if (hasGate) {
          renderWindowPicker(windows, key)
          renderStatus(gate.health || {}, w, lastPoliciesWithoutKind)
          if (w.totalDecisions > 0) {
            renderToll(w)
            renderInterventions(w)
            renderApprovals(w.approvals || {})
          }
          renderRecent(gate)
        } else if (kindIssue) {
          // No gate decisions measured at all, but the kind-less-policy
          // warning still has to render somewhere -- the same chips
          // function, with no gate health to report (its own no-data chips
          // are truthful either way: "Jev has not answered a call yet" is
          // exactly what "no gate data" means here).
          renderStatus({}, {}, lastPoliciesWithoutKind)
        }
        if (hasMeasurements) {
          renderUnmeasured()
          renderSpeed(ab)
        }
        renderSkills(mod)
      }

      // ---------- render: live board -----------------------------------------
      function tagClass (state) {
        if (state === 'done') return 'tag done'
        if (state === 'working') return 'tag working'
        if (state === 'blocked') return 'tag blocked'
        if (state === 'advised') return 'tag advised'
        return 'tag'
      }
      // odd/tasks/board-leftovers.md L6 -- the owner's panel with 63 agents
      // listed the oldest first inside each status, said "working" for rows
      // silent for three days, and repeated one project and branch more than
      // ten times. So: one row per project and branch (its latest state, its
      // last-seen time and how many sessions it stands for), newest first
      // across every status, a working or waiting row silent for over an
      // hour shown as "no signal", and rows last seen over 24 h ago behind a
      // "show more" toggle. View only: the worker's entries are unchanged.
      var LIVE_STALE_AFTER_MS = 60 * 60 * 1000
      var LIVE_RECENT_MS = 24 * 60 * 60 * 1000
      // The states that claim someone is active right now; `done` never goes
      // stale, it is already the end.
      var LIVE_ACTIVE_STATES = ['working', 'waiting']
      var liveExpanded = false
      var lastBoard = null

      function presentText (value) { return (typeof value === 'string' && value.length > 0) ? value : null }
      function entryTime (entry) {
        var at = Date.parse(entry && entry.updatedAt)
        return isNaN(at) ? null : at
      }
      /** Which row an entry belongs to: its project (the resolved name, else
       *  the raw id) plus its branch. An entry with no project at all never
       *  merges with another unnamed one: it keeps its own worktree, or its
       *  own pane when it has none or is on the floating terminal (every
       *  floating pane shares that one worktree id). */
      function liveGroupKey (e) {
        var project = presentText(e.projectName) || presentText(e.project)
        if (project !== null) return 'p\u0000' + project + '\u0000' + (presentText(e.rama) || '')
        var worktree = presentText(e.worktreeId)
        if (worktree !== null && worktree !== FLOATING_TERMINAL_WORKTREE_ID) return 'w\u0000' + worktree
        return 'k\u0000' + String(e.paneKey)
      }
      /** Newer first: by last-seen time, a missing time last, then by the
       *  order Orca received the events in. */
      function newerFirst (aTime, aReceived, bTime, bReceived) {
        if (aTime !== bTime) {
          if (aTime === null) return 1
          if (bTime === null) return -1
          return bTime - aTime
        }
        return (bReceived || 0) - (aReceived || 0)
      }
      function liveGroups (entries) {
        var byKey = {}
        var order = []
        entries.forEach(function (entry) {
          var e = entry || {}
          var key = liveGroupKey(e)
          var group = byKey[key]
          if (!group) {
            group = byKey[key] = { latest: e, lastSeen: entryTime(e), count: 0 }
            order.push(group)
          } else if (newerFirst(entryTime(e), e.receivedAt, group.lastSeen, group.latest.receivedAt) < 0) {
            group.latest = e
            group.lastSeen = entryTime(e)
          }
          group.count += 1
        })
        return order.sort(function (a, b) { return newerFirst(a.lastSeen, a.latest.receivedAt, b.lastSeen, b.latest.receivedAt) })
      }
      function liveRow (group, nowMs) {
        var entry = group.latest
        var view = liveEntryView(entry)
        var silent = group.lastSeen === null || nowMs - group.lastSeen > LIVE_STALE_AFTER_MS
        var noSignal = LIVE_ACTIVE_STATES.indexOf(entry.state) !== -1 && silent
        return '<div class="live-row" title="' + esc(view.title) + '">' +
          '<span class="name">' + esc(view.name) + '</span>' +
          (view.branch ? '<span class="tag branch">' + esc(view.branch) + '</span>' : '') +
          (noSignal
            ? '<span class="tag state nosignal">' + esc(t('live.noSignal')) + '</span>'
            : '<span class="' + tagClass(entry.state) + ' state">' + esc(entry.state || '?') + '</span>') +
          (group.count > 1 ? '<span class="count">' + esc(t('live.sessions', { n: String(group.count) })) + '</span>' : '') +
          '<span class="when">' + esc(ago(entry.updatedAt)) + '</span></div>'
      }
      function render (board) {
        lastBoard = board
        var entries = (board && Array.isArray(board.entries)) ? board.entries.slice() : []

        if (!entries.length) {
          cardsEl.innerHTML = '<p class="empty">' + esc(t('live.empty')) + '</p>'
          statusEl.textContent = ''
          return
        }

        var nowMs = Date.now()
        var groups = liveGroups(entries)
        var recent = groups.filter(function (g) { return g.lastSeen !== null && nowMs - g.lastSeen <= LIVE_RECENT_MS })
        var olderCount = groups.length - recent.length
        var shown = liveExpanded ? groups : recent
        // A pane key is a pair of UUIDs that tells a person nothing: the
        // project and branch are the chips, the ids only the tooltip.
        var list = shown.length
          ? '<div class="live-list" id="live-list">' + shown.map(function (g) { return liveRow(g, nowMs) }).join('') + '</div>'
          : '<p class="empty-line" id="live-list">' + esc(t('live.none24h')) + '</p>'
        var toggle = olderCount > 0
          ? '<button type="button" class="live-toggle" data-live-toggle aria-controls="live-list" aria-expanded="' + (liveExpanded ? 'true' : 'false') + '">' +
            esc(liveExpanded ? t('live.showLess') : t('live.showMore', { n: String(olderCount) })) + '</button>'
          : ''
        cardsEl.innerHTML = list + toggle
        statusEl.textContent = t('live.agentsCount', { n: String(entries.length) })
      }

      // One listener for the toggle, which is re-rendered with the list; the
      // focus goes back onto the new button so the keyboard never loses it.
      cardsEl.addEventListener('click', function (event) {
        var button = event.target && event.target.closest ? event.target.closest('[data-live-toggle]') : null
        if (!button) return
        liveExpanded = !liveExpanded
        render(lastBoard)
        var again = cardsEl.querySelector('[data-live-toggle]')
        if (again) again.focus()
      })

      // Every number on this board (board entries, measurementsSummary) is
      // written only by the worker -- if it has never run, both stay
      // legitimately absent forever, and "No data yet" is honest but does
      // not say why. This note names the real cause once the worker's own
      // heartbeat (T1 in odd/tasks/panel-worker-wakeup.md) says nobody is
      // running right now.
      function renderWorkerNote (heartbeat) {
        if (isHeartbeatFresh(heartbeat, Date.now(), WORKER_HEARTBEAT_STALE_MS)) {
          noteEl.className = 'meta nota'
          noteEl.textContent = ''
          return
        }
        noteEl.className = 'meta nota stale'
        noteEl.textContent = t('common.workerSilent')
      }

      function reload (usuario) {
        return Promise.all([
          read('board', usuario),
          read('measurementsSummary', usuario),
          read(WORKER_HEARTBEAT_KEY, false),
          read(POLICIES_WITHOUT_KIND_STATUS_KEY, false).catch(function () { return null }),
          read('consumptionSummary', usuario),
          read('activityByProjectSummary', usuario)
        ]).then(function (results) {
          render(results[0] || { entries: [] })
          renderStats(results[1], results[3])
          renderWorkerNote(results[2])
          renderConsumption(results[4])
          renderActivityProjects(results[5])
        }).catch(function (error) {
          noteEl.className = 'meta nota stale'
          // Same rule as config.html: a raw fault message is written for
          // whoever is debugging, not for whoever installed this.
          noteEl.textContent = t('error.unexpected')
        })
      }

      var timer = null
      function startPolling () {
        if (timer) return
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload(false)
        }, 8000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reload(false); startPolling() } else if (timer) {
          clearInterval(timer); timer = null
        }
      })
      window.addEventListener('focus', function () { reload(false) })

      el('refresh').addEventListener('click', function (event) {
        var b = event.currentTarget
        b.disabled = true
        statusEl.textContent = t('live.updating')
        Promise.resolve(reload(true)).then(function () {
          setTimeout(function () { b.disabled = false }, 400)
        })
      })

      // Orca's language decides; see the note in config.html. JEVADV-10
      // (odd/tasks/release-0.5.1.md): read the worker's own published
      // locale status BEFORE the first paint, and repaint with Orca's own
      // explicit setting when the worker already knows one -- this board
      // still never PUSHES a locale request back (read-only, see
      // localeFromOrca's own doc comment above).
      var LOCALE_STATUS_KEY = 'localeStatus'
      Promise.resolve().then(function () {
        return read(LOCALE_STATUS_KEY, false).catch(function () { return null })
      }).then(function (status) {
        currentLocale = resolveEffectiveLocale(status, currentLocale)
        applyStaticI18n()
        return reload(true)
      }).then(startPolling)
    </script>
  </body>
</html>

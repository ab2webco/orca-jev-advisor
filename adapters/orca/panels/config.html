<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev Advisor</title>
    <!--
      Sandboxed panels may call ONLY `notifications.show`, `storage.get` and
      `storage.set` over the postMessage bridge (isPluginPanelAction,
      orca-oss plugin-host-api.ts / plugin-panel-bridge.ts); `secrets.*` is
      worker-only. This panel never calls `secrets.get`/`secrets.set`/
      `secrets.delete` directly -- it writes a request into storage and polls
      a result key that `main.mjs` fills in, same shape as orca-wa-inbox's
      SIDECAR_REQUEST_KEY/SIDECAR_RESULT_KEY pair. The full key is never read
      back here: this panel only ever shows the masked status the worker
      publishes (`secretStatus`).

      Every user-facing string in this file comes from CATALOG (es/en)
      below, looked up by key -- never typed inline at the point it is
      shown. This is NOT Orca's own `contributes.languagePacks`: that
      mechanism replaces Orca's whole UI language and a plugin can only
      offer it as a value of Orca's OWN `uiLanguage` setting (verified in
      orca-oss: I18nProvider.tsx resolves a plugin's pack only when
      `uiLanguage === pack.id`); nothing tells a plugin what language Orca
      is already in (`settings.get` is this plugin's own config, not the
      app's, and the panel shell injects no locale token). So this plugin
      carries its own small, explicit choice instead -- the two buttons
      next to the title -- kept in its own storage and mirrored to
      ~/.config/orca-supervisor/locale for gate-bash.ts and mod-skills,
      which run outside Orca and read it directly (see src/core/i18n.ts).
    -->

    <style>
      /* The host injects a short list of tokens into the shell's <style>
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts)
         and sets light/dark on <html>. Nothing else reaches here. The
         fallbacks are main.css's real values, not a made-up grey, so the
         panel still reads well even when the host injects nothing (an old
         host, or the test harness). */
      :root {
        color-scheme: light dark;
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717; --fb-primary-foreground: #fafafa;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted: #f5f5f5; --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-input: #e5e5e5; --fb-ring: #a1a1a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5; --fb-primary-foreground: #171717;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted: #262626; --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-input: rgb(255 255 255 / 0.15);
          --fb-ring: #737373;
        }
      }
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 0 0 24px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      .wrap { max-width: 760px; }
      .titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 12px 0; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .lang-switch { display: flex; gap: 4px; }
      .lang-switch button { padding: 3px 8px; font-size: 11px; font-weight: 500; }
      .lang-switch button[aria-pressed="true"] { background: var(--primary, var(--fb-primary)); color: var(--primary-foreground, var(--fb-primary-foreground)); border-color: transparent; }
      .sub:first-child { margin-top: 0; }
      .sub { color: var(--muted-foreground, var(--fb-muted-foreground));
             margin: 0; padding: 2px 12px 12px; font-size: 12px; }
      /* Orca's own panels don't use per-section cards: they're flat, full
         bleed, separated by a thin --border rule and a small uppercase
         label, same as activity.html and wa-inbox/config.html. */
      section { padding: 12px; margin: 0; border-top: 1px solid var(--border, var(--fb-border)); }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           margin: 0 0 10px; font-weight: 600; }
      label { display: block; font-size: 12px; margin: 10px 0 4px;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      label:first-of-type { margin-top: 0; }
      input, select {
        font: inherit; width: 100%; padding: 7px 9px; border-radius: var(--radius-md);
        border: 1px solid var(--input, var(--fb-input)); background: transparent;
        color: var(--foreground, var(--fb-foreground));
      }
      select { background-color: var(--background, var(--fb-background));
               color: var(--foreground, var(--fb-foreground)); }
      select option { background-color: var(--background, var(--fb-background));
                      color: var(--foreground, var(--fb-foreground)); }
      input:focus-visible, select:focus-visible {
        outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; border-color: transparent;
      }
      button {
        font: inherit; font-weight: 500; padding: 7px 14px;
        border-radius: var(--radius-md); cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        background: var(--secondary, var(--fb-secondary));
        color: var(--secondary-foreground, var(--fb-secondary-foreground));
        transition: background-color 90ms ease, color 90ms ease, transform 60ms ease;
      }
      button:hover { background: var(--accent, var(--fb-accent));
                     color: var(--accent-foreground, var(--fb-accent-foreground)); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      button[disabled] { opacity: 0.5; cursor: default; transform: none; }
      button.primary { background: var(--primary, var(--fb-primary));
                       color: var(--primary-foreground, var(--fb-primary-foreground));
                       border-color: transparent; }
      button.primary:hover { background: var(--primary, var(--fb-primary));
                             color: var(--primary-foreground, var(--fb-primary-foreground));
                             filter: brightness(1.12); }
      /* Always underlined, not only on hover: in light theme --destructive is
         very close to plain text, and without an underline "Remove" doesn't
         read as actionable. */
      button.link { border: 0; background: none; padding: 0; margin-left: 10px;
                    color: var(--destructive, var(--fb-destructive)); font-size: 11px; font-weight: 400;
                    text-decoration: underline; text-underline-offset: 2px; }
      button.link:hover { background: none; color: var(--destructive, var(--fb-destructive));
                          text-decoration-thickness: 2px; }
      .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
      .row.two { grid-template-columns: 1fr 1fr; }
      .row.four { grid-template-columns: 1fr 1fr 1fr 1fr; }
      @media (max-width: 560px) { .row, .row.two, .row.four { grid-template-columns: 1fr; } }
      .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
      /* The allowlist carries no success color, and none is invented here:
         weight and plain text carry the confirmation. Failure does get a
         token, --destructive. */
      .said { font-size: 12px; font-weight: 500; color: var(--foreground, var(--fb-foreground)); }
      .said.bad { font-weight: 400; color: var(--destructive, var(--fb-destructive)); }
      .entry {
        border: 1px solid var(--border, var(--fb-border)); border-radius: var(--radius-md);
        padding: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px;
      }
      .entry:first-child { margin-top: 0; }
      .entry-actions { display: flex; justify-content: flex-end; }
      /* Twenty destinations and twenty policies rendered as open forms push
         this document past 15000px, and Orca clamps a panel's reported height
         to 8000 -- past that the document scrolls inside a settings pane that
         already scrolls, which is two scrollbars. Collapsed, each row costs a
         line until someone opens it. */
      details.entry > summary {
        cursor: pointer; list-style: none; display: flex; gap: 8px;
        align-items: baseline; padding: 7px 2px; font-size: 12px;
      }
      details.entry > summary::-webkit-details-marker { display: none; }
      details.entry > summary::before {
        content: '\25B8'; font-size: 9px; opacity: 0.5; transition: transform 0.12s;
      }
      details.entry[open] > summary::before { transform: rotate(90deg); }
      details.entry > summary:hover { color: var(--foreground, var(--fb-foreground)); }
      .entry-name { font-weight: 600; flex: 0 0 auto; }
      #claude-integration-status li { overflow-wrap: anywhere; }
      .entry-meta { color: var(--muted-foreground, var(--fb-muted-foreground));
        /* min-width:0 is what lets a flex child shrink below its content and
           actually ellipsize; without it the summary widens the document. */
        min-width: 0; flex: 1 1 auto;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hint { color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; margin: 6px 0 0; line-height: 1.5; }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    </style>
  </head>

    <div class="wrap">
      <div class="titlebar">
        <h1>Jev Advisor</h1>
        <div class="lang-switch" id="lang-switch" role="group" aria-label="idioma / language">

          <button type="button" id="lang-en" aria-pressed="false">EN</button>
        </div>
      </div>
      <p class="sub" data-i18n="app.subtitle"></p>

      <section id="secret-section">

        <div class="sub" id="secret-status" style="padding:0 0 6px"></div>
        <label for="api-key" data-i18n="secret.label"></label>
        <input id="api-key" type="password" autocomplete="off" data-i18n-placeholder="secret.placeholder" />
        <div class="actions">
          <button id="save-key" class="primary" type="button" data-i18n="secret.save"></button>
          <button id="clear-key" class="link" type="button" data-i18n="secret.clear"></button>
          <span class="said" id="key-said"></span>
        </div>
      </section>

      <section id="claude-integration-section">
        <h2 data-i18n="integration.heading"></h2>
        <p class="hint" id="integration-hint"></p>
        <ul id="claude-integration-status" style="margin:0; padding-left:18px; font-size:12px; line-height:1.7;"></ul>
        <div class="actions">
          <button id="claude-integration-setup" class="primary" type="button" data-i18n="integration.setup"></button>
          <button id="claude-integration-revert" class="link" type="button" data-i18n="integration.revert"></button>
          <span class="said" id="claude-integration-said"></span>
        </div>
      </section>

      <section id="thresholds-section">
        <h2 data-i18n="thresholds.heading"></h2>
        <div class="row">
          <div><label for="actThreshold" data-i18n="thresholds.act"></label>
            <input id="actThreshold" type="number" step="0.01" min="0" max="1" /></div>
          <div><label for="confirmThreshold" data-i18n="thresholds.confirm"></label>
            <input id="confirmThreshold" type="number" step="0.01" min="0" max="1" /></div>
          <div><label for="reversibleGate">reversibleGate</label>
            <input id="reversibleGate" type="number" step="0.01" min="0" max="1" /></div>
        </div>
        <div class="row">
          <div><label for="externalGate">externalGate</label>
            <input id="externalGate" type="number" step="0.01" min="0" max="1" /></div>
          <div><label for="consequenceCeiling">consequenceCeiling</label>
            <input id="consequenceCeiling" type="number" step="0.01" min="0" /></div>
          <div><label for="logMaxEntries" data-i18n="thresholds.logMaxEntries"></label>
            <input id="logMaxEntries" type="number" step="1" min="1" /></div>
        </div>
      </section>

      <section id="catalog-section">
        <h2 data-i18n="catalog.heading"></h2>
        <p class="hint" data-i18n="catalog.hint"></p>
        <div id="catalog-list"></div>
        <div class="actions"><button id="add-catalog-row" type="button" data-i18n="catalog.add"></button></div>
      </section>

      <section id="policies-section">
        <h2 data-i18n="policies.heading"></h2>
        <p class="hint" data-i18n="policies.hint"></p>
        <div id="policies-list"></div>
        <div class="actions"><button id="add-policy-row" type="button" data-i18n="policies.add"></button></div>
      </section>

      <section id="save-section">
        <div class="actions">
          <button id="save-all" class="primary" type="button" data-i18n="save.button"></button>
          <span class="said" id="save-said"></span>
        </div>
      </section>
    </div>

    <script>

      // never already-localized prose, see those files' own notes) to this
      // panel's own catalog key. An unrecognized or missing code falls back
      // to the generic 'common.hostRejectedRequest' rather than ever
      // surfacing the producer's raw (English, diagnostic-only) `detail`.
      var ERROR_REASON_KEYS = {
        'empty-key': 'error.emptyKey',
        'unknown-intent': 'error.unknownIntent',
        'invalid-locale': 'error.invalidLocale',
        'unknown-mode': 'error.unknownMode',
        'no-json': 'error.noJson',
        'launch-failed': 'error.launchFailed',
        exception: 'error.exception',
        'missing-plugin-root': 'error.missingPluginRoot'
      }
      function errorMessageFor (result) {
        var key = result && typeof result.reason === 'string' ? ERROR_REASON_KEYS[result.reason] : undefined
        return t(key || 'common.hostRejectedRequest')
      }

      var currentLocale = 'es'
      function t (key, params) {
        var template = (CATALOG[currentLocale] && CATALOG[currentLocale][key]) || CATALOG.es[key] || key
        if (!params) return template
        return template.replace(/\{\{(\w+)\}\}/g, function (_m, name) {
          return Object.prototype.hasOwnProperty.call(params, name) ? params[name] : ''
        })
      }

      // ---------- real bridge to the host -------------------------------
      // Same protocol as panels/board.html and wa-inbox/config.html: the
      // iframe is sandboxed with an opaque origin, so the only channel is
      // postMessage with the parent frame (orca-oss
      // src/shared/plugins/plugin-panel-bridge.ts). '*' is the only usable
      // targetOrigin; the host validates which window sends it.
      //
      // Every write this panel makes is born from a click -- saving the key,
      // saving the configuration -- so it travels the user lane: a reserved
      // quota, priority over any background read, and a backoff retry if the
      // host rejects it with `rate_limited` (PANEL_MESSAGE_RATE_LIMIT).
      // Simplified from wa-inbox/config.html's own queue mechanism down to
      // what this panel needs: a few reads on open and a few writes per
      // click, never polling.
      var seq = 0
      var pending = {}
      var CUPO = { max: 30, ventanaMs: 10000, reserva: 4 }
      var gastados = []
      var cola = []
      var colaTimer = null
      var frenoHasta = 0
      var RECHAZADO = { ok: false, errorCode: 'rate_limited' }

      function hayLugarDeSondeo () {
        var corte = Date.now() - CUPO.ventanaMs
        while (gastados.length && gastados[0] <= corte) gastados.shift()
        return gastados.length < CUPO.max - CUPO.reserva
      }
      function proximoHueco () {
        var ahora = Date.now()
        if (cola[0] && cola[0].usuario) return Math.max(60, (cola[0].desde || 0) - ahora)
        var falta = frenoHasta - ahora
        if (gastados.length) falta = Math.max(falta, gastados[0] + CUPO.ventanaMs - ahora)
        return Math.max(60, Math.min(falta, CUPO.ventanaMs))
      }
      function despachar (it) {
        var requestId = 'req-' + (++seq)
        pending[requestId] = function (d) {
          if (!(d && d.errorCode === 'rate_limited')) { it.resolve(d); return }
          frenoHasta = Date.now() + 1000
          if (!it.usuario || Date.now() >= it.vence) { it.resolve(d); return }
          it.espera = Math.min((it.espera || 300) * 2, 2500)
          it.desde = Date.now() + it.espera
          encolar(it)
        }
        window.parent.postMessage(
          { type: 'orca-panel-action', requestId: requestId, action: it.action, params: it.params }, '*')
      }
      function drenar () {
        if (colaTimer) { clearTimeout(colaTimer); colaTimer = null }
        var ahora = Date.now()
        while (cola.length) {
          var it = cola[0]
          if (it.vence <= ahora) { cola.shift(); it.resolve(RECHAZADO); continue }
          if (it.usuario ? (it.desde || 0) > ahora : (ahora < frenoHasta || !hayLugarDeSondeo())) break
          cola.shift()
          if (!it.usuario) gastados.push(ahora)
          despachar(it)
        }
        if (cola.length) colaTimer = setTimeout(drenar, proximoHueco())
      }
      function encolar (it) {
        var i = cola.length
        if (it.usuario) { i = 0; while (i < cola.length && cola[i].usuario) i++ }
        cola.splice(i, 0, it)
        drenar()
      }
      function call (action, params, usuario) {
        return new Promise(function (resolve) {
          encolar({
            action: action, params: params, usuario: !!usuario,
            vence: Date.now() + (usuario ? 30000 : 12000), resolve: resolve
          })
        })
      }
      window.addEventListener('message', function (event) {
        var d = event.data
        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // storage.get returns { value: <data> } and the bridge wraps it again.
      function stored (result) {
        if (!result || !result.ok || !result.value) return null
        return result.value.value === undefined ? null : result.value.value
      }
      function read (key, usuario) { return call('storage.get', { key: key }, usuario).then(stored) }
      function write (key, value) { return call('storage.set', { key: key, value: value }, true) }
      // Background write (not requested by a click): polling and the
      // heartbeat use this one, never the user lane, so a real click's
      // reserved quota is never spent by them.
      function writeBackground (key, value) { return call('storage.set', { key: key, value: value }, false) }

      // ---------- secret key: request/result ---------------------------------
      // A sandboxed panel cannot call `secrets.get`/`secrets.set`/
      // `secrets.delete` (isPluginPanelAction, orca-oss plugin-host-api.ts):
      // only `notifications.show`, `storage.get` and `storage.set`. This
      // panel leaves a request in storage and `main.mjs` attends it on a
      // timer, same as SIDECAR_REQUEST_KEY/SIDECAR_RESULT_KEY in
      // orca-wa-inbox. The key is never read back: only the masked status
      // the worker publishes in SECRET_STATUS_KEY is shown.
      var SECRET_REQUEST_KEY = 'secretRequest'
      var SECRET_RESULT_KEY = 'secretResult'
      var SECRET_STATUS_KEY = 'secretStatus'
      var PANEL_SEEN_KEY = 'configPanelSeen'

      function signalPanelOpen () {
        writeBackground(PANEL_SEEN_KEY, { at: new Date().toISOString() })
      }

      function waitForSecretResult (requestId, deadline) {
        return read(SECRET_RESULT_KEY, false).then(function (result) {
          if (result && result.id === requestId) {
            if (result.ok) return result
            throw new Error(errorMessageFor(result))
          }
          if (Date.now() >= deadline) throw new Error(t('common.timeout'))
          return new Promise(function (resolve) { setTimeout(resolve, 700) })
            .then(function () { return waitForSecretResult(requestId, deadline) })
        })
      }

      function sendSecretRequest (intent, value) {
        var requestId = 'secret-' + Date.now() + '-' + Math.random().toString(36).slice(2)
        var request = { id: requestId, at: new Date().toISOString(), intent: intent }
        if (value !== undefined) request.value = value
        // Nudges the worker into its fast poll before waiting for the result.
        signalPanelOpen()
        return write(SECRET_REQUEST_KEY, request).then(function (r) {
          if (!r || !r.ok) throw new Error((r && r.error) || t('common.couldNotSend'))
          return waitForSecretResult(requestId, Date.now() + 20000)
        })
      }

      // ---------- Claude Code integration: request/result -------------------
      // Same pattern as the secret above: a sandboxed panel cannot
      // install/revert directly (that runs in the worker, through
      // install-claude-integration.mjs), so it leaves a request in storage
      // and main.mjs attends it in the same poll it already uses for the key.
      var CLAUDE_INTEGRATION_REQUEST_KEY = 'claudeIntegrationRequest'
      var CLAUDE_INTEGRATION_RESULT_KEY = 'claudeIntegrationResult'
      var CLAUDE_INTEGRATION_STATUS_KEY = 'claudeIntegrationStatus'

      function waitForClaudeIntegrationResult (requestId, deadline) {
        return read(CLAUDE_INTEGRATION_RESULT_KEY, false).then(function (result) {
          if (result && result.id === requestId) {
            if (result.ok) return result
            throw new Error(errorMessageFor(result))
          }
          if (Date.now() >= deadline) throw new Error(t('common.timeout'))
          return new Promise(function (resolve) { setTimeout(resolve, 700) })
            .then(function () { return waitForClaudeIntegrationResult(requestId, deadline) })
        })
      }

      function sendClaudeIntegrationRequest (intent) {
        var requestId = 'claude-integration-' + Date.now() + '-' + Math.random().toString(36).slice(2)
        var request = { id: requestId, at: new Date().toISOString(), intent: intent }
        signalPanelOpen()
        return write(CLAUDE_INTEGRATION_REQUEST_KEY, request).then(function (r) {
          if (!r || !r.ok) throw new Error((r && r.error) || t('common.couldNotSend'))
          return waitForClaudeIntegrationResult(requestId, Date.now() + 20000)
        })
      }

      // ---------- language: request/result/status -----------------------------
      // Same pattern again: this panel cannot write the language's mirror
      // file itself (the worker's permission sandbox), so it requests and
      // main.mjs attends it. LOCALE_STATUS_KEY is what this panel reads on
      // open to know which language to paint.
      var LOCALE_REQUEST_KEY = 'localeRequest'
      var LOCALE_RESULT_KEY = 'localeResult'
      var LOCALE_STATUS_KEY = 'localeStatus'

      function waitForLocaleResult (requestId, deadline) {
        return read(LOCALE_RESULT_KEY, false).then(function (result) {
          if (result && result.id === requestId) {
            if (result.ok) return result
            throw new Error(errorMessageFor(result))
          }
          if (Date.now() >= deadline) throw new Error(t('common.timeout'))
          return new Promise(function (resolve) { setTimeout(resolve, 700) })
            .then(function () { return waitForLocaleResult(requestId, deadline) })
        })
      }

      function sendLocaleRequest (locale) {
        var requestId = 'locale-' + Date.now() + '-' + Math.random().toString(36).slice(2)
        var request = { id: requestId, at: new Date().toISOString(), locale: locale }
        signalPanelOpen()
        return write(LOCALE_REQUEST_KEY, request).then(function (r) {
          if (!r || !r.ok) throw new Error((r && r.error) || t('common.couldNotSend'))
          return waitForLocaleResult(requestId, Date.now() + 20000)
        })
      }

      // ---------- applying the catalog to the DOM ----------------------------

      function applyStaticI18n () {
        document.querySelectorAll('[data-i18n]').forEach(function (node) {
          node.textContent = t(node.getAttribute('data-i18n'))
        })
        document.querySelectorAll('[data-i18n-placeholder]').forEach(function (node) {
          node.placeholder = t(node.getAttribute('data-i18n-placeholder'))
        })
        el('integration-hint').innerHTML = t('integration.hint')
      }

      function setLangButtons (locale) {
        el('lang-es').setAttribute('aria-pressed', String(locale === 'es'))
        el('lang-en').setAttribute('aria-pressed', String(locale === 'en'))
      }

      // On a language change, the dynamic rows (catalog/policies) already
      // have their labels fixed at creation time: their values are read,
      // they're rebuilt with the new language's labels, and the rest of the
      // panel repaints through the catalog.
      function applyLocale (locale) {
        currentLocale = (locale === 'en') ? 'en' : 'es'
        document.documentElement.lang = currentLocale
        setLangButtons(currentLocale)
        var savedCatalog = readCatalog()
        var savedPolicies = readPolicies()
        applyStaticI18n()
        renderSecretStatus(lastSecretStatus)
        renderClaudeIntegrationStatus(lastClaudeIntegrationStatus)
        catalogListEl.innerHTML = ''
        savedCatalog.destinations.forEach(addCatalogRow)
        policiesListEl.innerHTML = ''
        savedPolicies.forEach(addPolicyRow)
      }

      el('lang-es').addEventListener('click', function () {
        if (currentLocale === 'es') return
        applyLocale('es')
        sendLocaleRequest('es').catch(function () { /* la vista ya cambio; un fallo de red no la revierte */ })
      })
      el('lang-en').addEventListener('click', function () {
        if (currentLocale === 'en') return
        applyLocale('en')
        sendLocaleRequest('en').catch(function () { /* idem */ })
      })

      // ---------- catalogo ----------------------------------------------
      var DESTINATION_KINDS = ['service', 'client-site', 'project', 'support']

      function elMake (tag, className) {
        var e = document.createElement(tag)
        if (className) e.className = className
        return e
      }

      function fieldInput (labelText, value, placeholder, type) {
        var wrap = elMake('div')
        var label = elMake('label')
        label.textContent = labelText
        var input = elMake('input')
        input.type = type || 'text'
        input.value = value || ''
        if (placeholder) input.placeholder = placeholder
        wrap.appendChild(label)
        wrap.appendChild(input)
        return { wrap: wrap, input: input }
      }

      var catalogListEl = el('catalog-list')

      /** Wraps one editable row in a disclosure whose summary stays in step
       *  with the id field, so a collapsed list still says what is in it. */
      function makeCollapsible (isNew, nameOf, metaOf) {
        var entry = elMake('details', 'entry')
        var summary = elMake('summary')
        var name = elMake('span', 'entry-name')
        var meta = elMake('span', 'entry-meta')
        summary.appendChild(name)
        summary.appendChild(meta)
        entry.appendChild(summary)
        entry.open = isNew
        entry._sync = function () {
          name.textContent = nameOf() || t('entry.untitled')
          meta.textContent = metaOf()
        }
        // Deliberately NOT called here: the closures above read fields the
        // caller declares after this point, so at construction they are still
        // hoisted-undefined. Each builder calls _sync() once it is complete.
        return entry
      }

      function addCatalogRow (row) {
        row = row || {
          id: '', label: '', kind: 'project', worktreePath: '', terminalTitleMatch: '',
          autonomy: { actThreshold: 0.9, confirmThreshold: 0.6, maxAutoDelicateness: 2 }
        }
        var idField = fieldInput(t('catalog.fieldId'), row.id, t('catalog.fieldIdPlaceholder'))
        var labelField = fieldInput(t('catalog.fieldLabel'), row.label, t('catalog.fieldLabelPlaceholder'))
        var entry = makeCollapsible(
          !row.id,
          function () { return idField.input.value.trim() },
          function () { return kindSelect.value + ' \u00b7 ' + (labelField.input.value.trim() || row.worktreePath) }
        )
        idField.input.addEventListener('input', function () { entry._sync() })
        labelField.input.addEventListener('input', function () { entry._sync() })

        var row1 = elMake('div', 'row two')
        row1.appendChild(idField.wrap)
        row1.appendChild(labelField.wrap)
        entry.appendChild(row1)

        var row2 = elMake('div', 'row two')
        var kindWrap = elMake('div')
        var kindLabel = elMake('label')
        kindLabel.textContent = t('catalog.fieldKind')
        var kindSelect = elMake('select')
        DESTINATION_KINDS.forEach(function (k) {
          var opt = elMake('option')
          opt.value = k
          opt.textContent = k
          if (k === row.kind) opt.selected = true
          kindSelect.appendChild(opt)
        })
        kindSelect.addEventListener('change', function () { entry._sync() })
        kindWrap.appendChild(kindLabel)
        kindWrap.appendChild(kindSelect)
        var pathField = fieldInput(t('catalog.fieldPath'), row.worktreePath, t('catalog.fieldPathPlaceholder'))
        row2.appendChild(kindWrap)
        row2.appendChild(pathField.wrap)
        entry.appendChild(row2)

        var row3 = elMake('div', 'row four')
        var titleField = fieldInput(t('catalog.fieldTitleMatch'), row.terminalTitleMatch || '', t('catalog.fieldTitleMatchPlaceholder'))
        var actField = fieldInput('actThreshold', String(row.autonomy.actThreshold), '0.9', 'number')
        var confirmField = fieldInput('confirmThreshold', String(row.autonomy.confirmThreshold), '0.6', 'number')
        var delicatenessField = fieldInput('maxAutoDelicateness', String(row.autonomy.maxAutoDelicateness), '2', 'number')
        row3.appendChild(titleField.wrap)
        row3.appendChild(actField.wrap)
        row3.appendChild(confirmField.wrap)
        row3.appendChild(delicatenessField.wrap)
        entry.appendChild(row3)

        entry._sync()

        var actions = elMake('div', 'entry-actions')
        var removeBtn = elMake('button', 'link')
        removeBtn.type = 'button'
        removeBtn.textContent = t('catalog.remove')
        removeBtn.addEventListener('click', function () { entry.remove() })
        actions.appendChild(removeBtn)
        entry.appendChild(actions)

        entry._read = function () {
          return {
            id: idField.input.value.trim(),
            label: labelField.input.value.trim(),
            kind: kindSelect.value,
            worktreePath: pathField.input.value.trim(),
            terminalTitleMatch: titleField.input.value.trim() || undefined,
            autonomy: {
              actThreshold: Number(actField.input.value),
              confirmThreshold: Number(confirmField.input.value),
              maxAutoDelicateness: Number(delicatenessField.input.value)
            }
          }
        }

        catalogListEl.appendChild(entry)
      }

      el('add-catalog-row').addEventListener('click', function () { addCatalogRow() })

      function readCatalog () {
        var rows = []
        catalogListEl.querySelectorAll('.entry').forEach(function (entryEl) {
          if (typeof entryEl._read === 'function') rows.push(entryEl._read())
        })
        return { destinations: rows.filter(function (r) { return r.id.length > 0 }) }
      }

      // ---------- politicas -----------------------------------------------

      var policiesListEl = el('policies-list')

      function addPolicyRow (row) {
        row = row || { id: '', rule: '' }
        var idField = fieldInput(t('policies.fieldId'), row.id, t('policies.fieldIdPlaceholder'))
        var ruleField = fieldInput(t('policies.fieldRule'), row.rule, t('policies.fieldRulePlaceholder'))
        var entry = makeCollapsible(
          !row.id,
          function () { return idField.input.value.trim() },
          function () { return ruleField.input.value.trim() }
        )
        idField.input.addEventListener('input', function () { entry._sync() })
        ruleField.input.addEventListener('input', function () { entry._sync() })
        var rowEl = elMake('div', 'row two')
        rowEl.appendChild(idField.wrap)
        rowEl.appendChild(ruleField.wrap)
        entry.appendChild(rowEl)

        entry._sync()

        var actions = elMake('div', 'entry-actions')
        var removeBtn = elMake('button', 'link')
        removeBtn.type = 'button'
        removeBtn.textContent = t('policies.remove')
        removeBtn.addEventListener('click', function () { entry.remove() })
        actions.appendChild(removeBtn)
        entry.appendChild(actions)

        entry._read = function () {
          return { id: idField.input.value.trim(), rule: ruleField.input.value.trim() }
        }

        policiesListEl.appendChild(entry)
      }

      el('add-policy-row').addEventListener('click', function () { addPolicyRow() })

      function readPolicies () {
        var rows = []
        policiesListEl.querySelectorAll('.entry').forEach(function (entryEl) {
          if (typeof entryEl._read === 'function') rows.push(entryEl._read())
        })
        return rows.filter(function (r) { return r.id.length > 0 && r.rule.length > 0 })
      }

      // ---------- umbrales --------------------------------------------------

      function fillThresholds (config) {
        config = config || {}
        var thresholds = config.thresholds || {}
        el('actThreshold').value = thresholds.actThreshold != null ? thresholds.actThreshold : 0.9
        el('confirmThreshold').value = thresholds.confirmThreshold != null ? thresholds.confirmThreshold : 0.6
        el('reversibleGate').value = thresholds.reversibleGate != null ? thresholds.reversibleGate : 0.7
        el('externalGate').value = thresholds.externalGate != null ? thresholds.externalGate : 0.35
        el('consequenceCeiling').value = thresholds.consequenceCeiling != null ? thresholds.consequenceCeiling : 1.5
        el('logMaxEntries').value = config.logMaxEntries != null ? config.logMaxEntries : 500
      }

      function readConfig (previous) {
        return {
          thresholds: {
            actThreshold: Number(el('actThreshold').value),
            confirmThreshold: Number(el('confirmThreshold').value),
            reversibleGate: Number(el('reversibleGate').value),
            externalGate: Number(el('externalGate').value),
            consequenceCeiling: Number(el('consequenceCeiling').value)
          },
          logMaxEntries: Number(el('logMaxEntries').value),
          jevBudgetMs: (previous && previous.jevBudgetMs) || 4000
        }
      }

      // ---------- clave secreta --------------------------------------------

      var secretStatusEl = el('secret-status')
      var keySaidEl = el('key-said')
      var lastSecretStatus = null

      // The panel never reads the key back: it only paints what the worker
      // published in SECRET_STATUS_KEY (isConfigured/endsWith), never the
      // full value.
      function renderSecretStatus (status) {
        lastSecretStatus = status
        if (status === null) { secretStatusEl.textContent = t('secret.checking'); return }
        if (status && status.configured) {
          secretStatusEl.textContent = t('secret.configured', { tail: status.endsWith || '????' })
        } else {
          secretStatusEl.textContent = t('secret.notConfigured')
        }
      }

      function loadSecretStatus () {
        return read(SECRET_STATUS_KEY, false).then(renderSecretStatus)
      }

      function said (node, text, bad) {
        node.textContent = text || ''
        node.className = 'said' + (bad ? ' bad' : '')
      }

      el('save-key').addEventListener('click', function () {
        var input = el('api-key')
        var value = input.value.trim()
        if (value.length === 0) return
        said(keySaidEl, t('secret.saving'))
        sendSecretRequest('save', value).then(function () {
          input.value = ''
          said(keySaidEl, t('secret.saved'))
          return loadSecretStatus()
        }).catch(function (error) {
          said(keySaidEl, String(error && error.message || error), true)
        })
      })

      el('clear-key').addEventListener('click', function () {
        said(keySaidEl, t('secret.clearing'))
        sendSecretRequest('clear').then(function () {
          said(keySaidEl, t('secret.cleared'))
          return loadSecretStatus()
        }).catch(function (error) {
          said(keySaidEl, String(error && error.message || error), true)
        })
      })

      // ---------- Claude Code integration ------------------------------------

      var claudeIntegrationStatusEl = el('claude-integration-status')
      var claudeIntegrationSaidEl = el('claude-integration-said')
      var lastClaudeIntegrationStatus = null

      function li (text) {
        var item = elMake('li')
        item.textContent = text
        return item
      }

      // Paints exactly what the worker published in
      // CLAUDE_INTEGRATION_STATUS_KEY -- never the key, and never more detail
      // than the panel needs for the user to know what's set up and where.
      function renderClaudeIntegrationStatus (status) {
        lastClaudeIntegrationStatus = status
        claudeIntegrationStatusEl.innerHTML = ''
        if (status === null) { claudeIntegrationStatusEl.appendChild(li(t('integration.checking'))); return }
        if (!status || !status.ok) {
          claudeIntegrationStatusEl.appendChild(li(t('integration.statusUnavailable')))
          return
        }
        var hookLine = status.hook && status.hook.installed
          ? t('integration.hookCount', { installed: String(status.hook.installedCount), total: String(status.hook.totalCount) })
          : t('integration.hookNotInstalled')
        claudeIntegrationStatusEl.appendChild(li(hookLine))

        // Orca's own panes are the ones that matter most for a plugin shipped
        // for Orca, and they read a different settings.json than ~/.claude --
        // so they get their own line rather than hiding inside a total.
        var panes = status.hook && status.hook.orcaPaneCount
        var paneLine = !panes
          ? t('integration.hookPanesNone', { reason: (status.orcaUserData && status.orcaUserData.reason) || '-' })
          : (status.hook.orcaPanesCovered ? t('integration.hookPanesCovered', { panes: String(panes) }) : t('integration.hookPanesMissing'))
        claudeIntegrationStatusEl.appendChild(li(paneLine))

        var envLine = status.env && status.env.installed
          ? t('integration.envInstalled', { name: status.env.name })
          : t('integration.envNotInstalled')
        claudeIntegrationStatusEl.appendChild(li(envLine))

        var mirror = status.secretMirror
        var mirrorLine = mirror && mirror.ok
          ? (mirror.exists ? (mirror.platform === 'win32' ? t('integration.mirrorPresentWindows', { path: mirror.path }) : t('integration.mirrorPresent', { mode: mirror.mode, path: mirror.path })) : t('integration.mirrorMissing', { path: mirror.path }))
          : t('integration.mirrorUnknown')
        claudeIntegrationStatusEl.appendChild(li(mirrorLine))

        var modLine = status.modLink && status.modLink.installed
          ? t('integration.modLinkedCount', { installed: String(status.hook.totalCount), total: String(status.hook.totalCount) })
          : t('integration.modNotLinked')
        claudeIntegrationStatusEl.appendChild(li(modLine))
      }

      function loadClaudeIntegrationStatus () {
        return read(CLAUDE_INTEGRATION_STATUS_KEY, false).then(renderClaudeIntegrationStatus)
      }

      el('claude-integration-setup').addEventListener('click', function () {
        said(claudeIntegrationSaidEl, t('integration.configuring'))
        sendClaudeIntegrationRequest('install').then(function () {
          said(claudeIntegrationSaidEl, t('integration.done'))
          return loadClaudeIntegrationStatus()
        }).catch(function (error) {
          said(claudeIntegrationSaidEl, String(error && error.message || error), true)
        })
      })

      el('claude-integration-revert').addEventListener('click', function () {
        said(claudeIntegrationSaidEl, t('integration.reverting'))
        sendClaudeIntegrationRequest('uninstall').then(function () {
          said(claudeIntegrationSaidEl, t('integration.reverted'))
          return loadClaudeIntegrationStatus()
        }).catch(function (error) {
          said(claudeIntegrationSaidEl, String(error && error.message || error), true)
        })
      })

      // ---------- guardar / cargar ------------------------------------------

      var saveSaidEl = el('save-said')
      var currentConfig = null

      el('save-all').addEventListener('click', function () {
        said(saveSaidEl, t('save.saving'))
        var config = readConfig(currentConfig)
        Promise.all([
          write('config', config),
          write('catalog', readCatalog()),
          write('policies', readPolicies())
        ]).then(function (results) {
          var failed = results.find(function (r) { return !r || !r.ok })
          if (failed) throw new Error(failed.error || t('common.hostRejectedWrite'))
          currentConfig = config
          said(saveSaidEl, t('save.saved'))
        }).catch(function (error) {
          said(saveSaidEl, String(error && error.message || error), true)
        })
      })

      function load () {
        fillThresholds({})
        return read(LOCALE_STATUS_KEY, false).then(function (localeStatus) {
          var locale = (localeStatus && localeStatus.value) || 'es'
          currentLocale = (locale === 'en') ? 'en' : 'es'
          document.documentElement.lang = currentLocale
          setLangButtons(currentLocale)
          applyStaticI18n()
          renderSecretStatus(null)
          renderClaudeIntegrationStatus(null)
          return Promise.all([
            read('config', false),
            read('catalog', false),
            read('policies', false),
            loadSecretStatus(),
            loadClaudeIntegrationStatus()
          ])
        }).then(function (results) {
          currentConfig = results[0]
          fillThresholds(currentConfig)
          catalogListEl.innerHTML = ''
          ;((results[1] && results[1].destinations) || []).forEach(addCatalogRow)
          policiesListEl.innerHTML = ''
          ;(results[2] || []).forEach(addPolicyRow)
        }).catch(function (error) {
          said(saveSaidEl, String(error && error.message || error), true)
        })
      }

      // Heartbeat: while the panel is visible, it signals that it's still
      // open so the worker polls its request every ~1s instead of every ~15s.
      var heartbeatTimer = null
      function startHeartbeat () {
        if (heartbeatTimer) return
        heartbeatTimer = setInterval(function () {
          if (document.visibilityState === 'visible') signalPanelOpen()
        }, 2000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') signalPanelOpen()
      })

      signalPanelOpen()
      startHeartbeat()
      load()
    </script>
  </body>
</html>

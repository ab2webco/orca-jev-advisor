      // ---------- applying the catalog to the DOM ----------------------------

      function applyStaticI18n () {
        document.querySelectorAll('[data-i18n]').forEach(function (node) {
          node.textContent = t(node.getAttribute('data-i18n'))
        })
        document.querySelectorAll('[data-i18n-placeholder]').forEach(function (node) {
          node.placeholder = t(node.getAttribute('data-i18n-placeholder'))
        })
        el('integration-hint').innerHTML = t('integration.hint')
      }


      // There is no applyLocale here any more. It existed to repaint the panel
      // when the in-panel language switch was used, and the switch is gone:
      // the language comes from Orca, which remounts the whole panel when it
      // changes, so nothing needs to repaint in place.

      // The gate and the skills mod run OUTSIDE Orca and cannot read the
      // panel's `<html lang>`, so the locale Orca reports is mirrored out to
      // them. Best effort: a failed mirror leaves those two on their previous
      // language, which is a cosmetic difference, never a blocked command.
      sendLocaleRequest(currentLocale).catch(function () { /* cosmetic only */ })

      // ---------- catalogo ----------------------------------------------
      var DESTINATION_KINDS = ['service', 'client-site', 'project', 'support']

      function elMake (tag, className) {
        var e = document.createElement(tag)
        if (className) e.className = className
        return e
      }

      function fieldInput (labelText, value, placeholder, type) {
        var wrap = elMake('div')
        var label = elMake('label')
        label.textContent = labelText
        var input = elMake('input')
        input.type = type || 'text'
        input.value = value || ''
        if (placeholder) input.placeholder = placeholder
        wrap.appendChild(label)
        wrap.appendChild(input)
        return { wrap: wrap, input: input }
      }

      var catalogListEl = el('catalog-list')

      /** Wraps one editable row in a disclosure whose summary stays in step
       *  with the id field, so a collapsed list still says what is in it. */
      function makeCollapsible (isNew, nameOf, metaOf) {
        var entry = elMake('details', 'entry')
        var summary = elMake('summary')
        var name = elMake('span', 'entry-name')
        var meta = elMake('span', 'entry-meta')
        summary.appendChild(name)
        summary.appendChild(meta)
        entry.appendChild(summary)
        entry.open = isNew
        entry._sync = function () {
          name.textContent = nameOf() || t('entry.untitled')
          meta.textContent = metaOf()
        }
        // Deliberately NOT called here: the closures above read fields the
        // caller declares after this point, so at construction they are still
        // hoisted-undefined. Each builder calls _sync() once it is complete.
        return entry
      }

      function addCatalogRow (row) {
        // autonomy used to seed a new row with { actThreshold: 0.9,
        // confirmThreshold: 0.6, maxAutoDelicateness: 2 } -- a literal next
        // to the widget for three fields no decision anywhere reads (see
        // src/core/store.ts's own note on AutonomyConfig). Removed rather
        // than defaulted: there is nothing left to seed.
        row = row || {
          id: '', label: '', kind: 'project', worktreePath: '', terminalTitleMatch: '',
          autonomy: {}
        }
        var idField = fieldInput(t('catalog.fieldId'), row.id, t('catalog.fieldIdPlaceholder'))
        var labelField = fieldInput(t('catalog.fieldLabel'), row.label, t('catalog.fieldLabelPlaceholder'))
        var entry = makeCollapsible(
          !row.id,
          function () { return idField.input.value.trim() },
          function () { return kindSelect.value + ' \u00b7 ' + (labelField.input.value.trim() || row.worktreePath) }
        )
        idField.input.addEventListener('input', function () { entry._sync() })
        labelField.input.addEventListener('input', function () { entry._sync() })

        var row1 = elMake('div', 'row two')
        row1.appendChild(idField.wrap)
        row1.appendChild(labelField.wrap)
        entry.appendChild(row1)

        // Base .row is a 3-column grid (see the .row/.row.two/.row.four
        // rules above): kind, path and the title-match field all fit here
        // now that actThreshold/confirmThreshold/maxAutoDelicateness (the
        // fourth field's row) are gone -- traced to zero decisions anywhere
        // (see src/core/store.ts's own note on AutonomyConfig) and removed,
        // not defaulted.
        var row2 = elMake('div', 'row')
        var kindWrap = elMake('div')
        var kindLabel = elMake('label')
        kindLabel.textContent = t('catalog.fieldKind')
        var kindSelect = elMake('select')
        DESTINATION_KINDS.forEach(function (k) {
          var opt = elMake('option')
          opt.value = k
          opt.textContent = k
          if (k === row.kind) opt.selected = true
          kindSelect.appendChild(opt)
        })
        kindSelect.addEventListener('change', function () { entry._sync() })
        kindWrap.appendChild(kindLabel)
        kindWrap.appendChild(kindSelect)
        var pathField = fieldInput(t('catalog.fieldPath'), row.worktreePath, t('catalog.fieldPathPlaceholder'))
        var titleField = fieldInput(t('catalog.fieldTitleMatch'), row.terminalTitleMatch || '', t('catalog.fieldTitleMatchPlaceholder'))
        row2.appendChild(kindWrap)
        row2.appendChild(pathField.wrap)
        row2.appendChild(titleField.wrap)
        entry.appendChild(row2)

        entry._sync()

        var actions = elMake('div', 'entry-actions')
        var removeBtn = elMake('button', 'link')
        removeBtn.type = 'button'
        removeBtn.textContent = t('catalog.remove')
        removeBtn.addEventListener('click', function () { entry.remove() })
        actions.appendChild(removeBtn)
        entry.appendChild(actions)

        entry._read = function () {
          // buildDestinationRow (above) omits terminalTitleMatch entirely
          // when blank, rather than setting it to `undefined` -- see that
          // function's own comment for why `|| undefined` broke every save.
          return buildDestinationRow({
            id: idField.input.value.trim(),
            label: labelField.input.value.trim(),
            kind: kindSelect.value,
            worktreePath: pathField.input.value.trim(),
            terminalTitleMatch: titleField.input.value.trim()
          })
        }

        catalogListEl.appendChild(entry)
      }

      el('add-catalog-row').addEventListener('click', function () { addCatalogRow() })

      var catalogRefreshSaidEl = el('catalog-refresh-said')
      el('refresh-catalog').addEventListener('click', function () {
        said(catalogRefreshSaidEl, t('catalog.refreshing'))
        sendCatalogRefreshRequest().then(function (result) {
          var added = (result && typeof result.added === 'number') ? result.added : 0
          said(catalogRefreshSaidEl, added > 0 ? t('catalog.refreshDone', { count: String(added) }) : t('catalog.refreshNone'))
          return read('catalog', false)
        }).then(function (catalog) {
          if (!catalog) return
          catalogListEl.innerHTML = ''
          ;(catalog.destinations || []).forEach(addCatalogRow)
        }).catch(function (error) {
          said(catalogRefreshSaidEl, errorText(error), true)
        })
      })

      function readCatalog () {
        var rows = []
        catalogListEl.querySelectorAll('.entry').forEach(function (entryEl) {
          if (typeof entryEl._read === 'function') rows.push(entryEl._read())
        })
        return { destinations: rows.filter(function (r) { return r.id.length > 0 }) }
      }

      // Read fresh off the catalog editor's own in-memory rows (never
      // re-fetched from storage) so a policy's destination-id warning always
      // compares against what is actually loaded right now, including
      // catalog edits the user hasn't saved yet.
      function currentCatalogDestinationIds () {
        var ids = []
        catalogListEl.querySelectorAll('.entry').forEach(function (entryEl) {
          if (typeof entryEl._read !== 'function') return
          var id = entryEl._read().id
          if (id) ids.push(id)
        })
        return ids
      }

      // ---------- politicas -----------------------------------------------

      var policiesListEl = el('policies-list')

      // Same three values as decisions.ts' PolicyKind (src/core/decisions.ts)
      // and store.ts' POLICY_KINDS -- kept as a plain list here because this
      // panel is untyped JS with no import of that union, same reason
      // DESTINATION_KINDS above duplicates CatalogDestination's kind values.
      // '' is NOT a PolicyKind: it is this panel's own sentinel for "nobody
      // has chosen one yet", used only for a row that arrived from storage
      // with no kind (or an invalid one) and never written back as a real
      // stored value on its own -- see the entry._read comment below.
      var POLICY_KIND_OPTIONS = [
        { value: '', labelKey: 'policies.kindUnset' },
        { value: 'permits', labelKey: 'policies.kindPermits' },
        { value: 'requires_human', labelKey: 'policies.kindRequiresHuman' },
        { value: 'prohibits', labelKey: 'policies.kindProhibits' }
      ]

      function policyKindLabel (value) {
        var match = POLICY_KIND_OPTIONS.filter(function (o) { return o.value === value })[0]
        return match ? t(match.labelKey) : t('policies.kindUnset')
      }

      function addPolicyRow (row) {
        row = row || { id: '', rule: '', kind: '' }
        var idField = fieldInput(t('policies.fieldId'), row.id, t('policies.fieldIdPlaceholder'))
        var ruleField = fieldInput(t('policies.fieldRule'), row.rule, t('policies.fieldRulePlaceholder'))
        var entry = makeCollapsible(
          !row.id,
          function () { return idField.input.value.trim() },
          function () {
            var base = policyKindLabel(kindSelect.value) + ' · ' + ruleField.input.value.trim()
            var destinations = parseDestinations()
            // Visible without expanding the row: a scoped policy reads
            // differently from a global one at a glance, which matters once
            // there are 20 of them.
            return destinations.length > 0 ? base + ' → ' + destinations.join(', ') : base
          }
        )
        idField.input.addEventListener('input', function () { entry._sync() })
        ruleField.input.addEventListener('input', function () { entry._sync() })
        var rowEl = elMake('div', 'row two')
        rowEl.appendChild(idField.wrap)
        rowEl.appendChild(ruleField.wrap)
        entry.appendChild(rowEl)

        var kindWrap = elMake('div')
        var kindLabel = elMake('label')
        kindLabel.textContent = t('policies.fieldKind')
        var kindSelect = elMake('select')
        // A row loaded from storage without a valid kind (written before
        // `kind` existed, or with a typo'd value) never gets guessed into one
        // of the three real options -- it lands on the '' sentinel instead,
        // and stays there, visibly, until a human picks one.
        var storedKind = POLICY_KIND_OPTIONS.some(function (o) { return o.value === row.kind && o.value !== '' }) ? row.kind : ''
        POLICY_KIND_OPTIONS.forEach(function (option) {
          var opt = elMake('option')
          opt.value = option.value
          opt.textContent = t(option.labelKey)
          if (option.value === storedKind) opt.selected = true
          kindSelect.appendChild(opt)
        })
        kindWrap.appendChild(kindLabel)
        kindWrap.appendChild(kindSelect)
        entry.appendChild(kindWrap)

        var needsReviewHint = elMake('p', 'hint warn')
        needsReviewHint.textContent = t('policies.kindNeedsReview')
        entry.appendChild(needsReviewHint)

        function syncKindWarning () {
          needsReviewHint.style.display = kindSelect.value === '' ? '' : 'none'
        }
        syncKindWarning()
        kindSelect.addEventListener('change', function () { syncKindWarning(); entry._sync() })

        // Scope: empty (the default) means this policy applies globally,
        // exactly like every row already saved today. A comma-separated list
        // of destination ids narrows it -- coordinated with store.ts's
        // `PolicyRow.destinations?: readonly string[]`.
        var destinationsField = fieldInput(
          t('policies.fieldDestinations'), (row.destinations || []).join(', '), t('policies.fieldDestinationsPlaceholder'))
        entry.appendChild(destinationsField.wrap)

        var destinationsHint = elMake('p', 'hint')
        destinationsHint.textContent = t('policies.fieldDestinationsHint')
        entry.appendChild(destinationsHint)

        var destinationsWarning = elMake('p', 'hint warn')
        entry.appendChild(destinationsWarning)

        function parseDestinations () {
          return destinationsField.input.value.split(',')
            .map(function (s) { return s.trim() })
            .filter(function (s) { return s.length > 0 })
        }

        // Compared against the catalog editor's own in-memory rows, never
        // re-fetched. Purely informational -- a typo'd or removed
        // destination id is shown, never blocked and never thrown on.
        function syncDestinationsWarning () {
          var known = currentCatalogDestinationIds()
          var unknown = parseDestinations().filter(function (id) { return known.indexOf(id) === -1 })
          if (unknown.length > 0) {
            destinationsWarning.textContent = t('policies.unknownDestination', { ids: unknown.join(', ') })
            destinationsWarning.style.display = ''
          } else {
            destinationsWarning.style.display = 'none'
          }
        }
        syncDestinationsWarning()
        destinationsField.input.addEventListener('input', function () { syncDestinationsWarning(); entry._sync() })

        entry._sync()

        var actions = elMake('div', 'entry-actions')
        var removeBtn = elMake('button', 'link')
        removeBtn.type = 'button'
        removeBtn.textContent = t('policies.remove')
        removeBtn.addEventListener('click', function () { entry.remove() })
        actions.appendChild(removeBtn)
        entry.appendChild(actions)

        entry._read = function () {
          // kindSelect.value is '' when still unset: buildPolicyRow (above)
          // omits `kind` from the saved object entirely in that case (never
          // sets it to `undefined` -- see that function's own comment for
          // why `|| undefined` broke every save), so store.ts's isPolicyRow
          // still sees it as "no valid kind" next time and keeps excluding
          // it from judgment -- without this panel ever deleting the row
          // itself. Same "empty means unset" convention for `destinations`:
          // an empty scope is omitted rather than written as `[]`, so a
          // policy with no destinations still reads as "applies globally".
          return buildPolicyRow({
            id: idField.input.value.trim(),
            rule: ruleField.input.value.trim(),
            kind: kindSelect.value,
            destinations: parseDestinations()
          })
        }

        policiesListEl.appendChild(entry)
      }

      el('add-policy-row').addEventListener('click', function () { addPolicyRow() })

      function readPolicies () {
        var rows = []
        policiesListEl.querySelectorAll('.entry').forEach(function (entryEl) {
          if (typeof entryEl._read === 'function') rows.push(entryEl._read())
        })
        return rows.filter(function (r) { return r.id.length > 0 && r.rule.length > 0 })
      }

      var policyImportSaidEl = el('policy-import-said')
      var policyDiffsEl = el('policy-diffs')

      /** The baseline shipped a different wording for an id you already have.
       *  Merge-by-id can never reach it -- that is the point, an edited policy
       *  must survive -- so the only honest way through is to show both
       *  versions and let the person pick, one row at a time. */
      function renderPolicySeedDiffs (differing) {
        policyDiffsEl.innerHTML = ''
        if (!differing || differing.length === 0) return
        var heading = document.createElement('p')
        heading.className = 'hint'
        heading.textContent = t('policies.diffHeading', { n: String(differing.length) })
        policyDiffsEl.appendChild(heading)

        differing.forEach(function (diff) {
          var row = document.createElement('div')
          row.className = 'checkbox-row'
          var box = document.createElement('input')
          box.type = 'checkbox'
          box.setAttribute('data-policy-diff-id', diff.id)
          var text = document.createElement('div')
          text.className = 'checkbox-text'
          var label = document.createElement('span')
          label.className = 'checkbox-label'
          label.textContent = t('policies.diffLabel', { id: diff.id, fields: (diff.fields || []).join(', ') })
          text.appendChild(label)
          ;(diff.fields || []).forEach(function (field) {
            var line = document.createElement('span')
            line.className = 'hint'
            line.textContent = t('policies.diffField', {
              field: field,
              mine: policyFieldText(diff.existing, field),
              baseline: policyFieldText(diff.seed, field)
            })
            text.appendChild(line)
          })
          row.appendChild(box)
          row.appendChild(text)
          policyDiffsEl.appendChild(row)
        })

        var actions = document.createElement('div')
        actions.className = 'actions'
        var apply = document.createElement('button')
        apply.type = 'button'
        apply.id = 'apply-policy-diffs'
        apply.textContent = t('policies.diffApply')
        apply.addEventListener('click', function () {
          var accepted = []
          policyDiffsEl.querySelectorAll('input[data-policy-diff-id]').forEach(function (box) {
            if (box.checked) accepted.push(box.getAttribute('data-policy-diff-id'))
          })
          if (accepted.length === 0) { said(policyImportSaidEl, t('policies.diffNoneChosen')); return }
          runPolicySeedImport(accepted)
        })
        actions.appendChild(apply)
        policyDiffsEl.appendChild(actions)
      }

      /** One field of a policy as a person reads it. `destinations` is a list
       *  and an absent one means "every destination", which is a different
       *  sentence from an empty list nobody wrote. */
      function policyFieldText (policy, field) {
        if (!policy) return ''
        if (field !== 'destinations') return String(policy[field] == null ? '' : policy[field])
        var destinations = policy.destinations
        if (!destinations || destinations.length === 0) return t('policies.diffAllDestinations')
        return destinations.join(', ')
      }

      function runPolicySeedImport (acceptedIds) {
        said(policyImportSaidEl, t('policies.importing'))
        return sendPolicySeedImportRequest(acceptedIds).then(function (result) {
          var added = (result && typeof result.added === 'number') ? result.added : 0
          var skipped = (result && typeof result.skipped === 'number') ? result.skipped : 0
          var replaced = (result && typeof result.replaced === 'number') ? result.replaced : 0
          if (replaced > 0) said(policyImportSaidEl, t('policies.importReplaced', { replaced: String(replaced), added: String(added) }))
          else said(policyImportSaidEl, added > 0 ? t('policies.importDone', { added: String(added), skipped: String(skipped) }) : t('policies.importNone'))
          renderPolicySeedDiffs(result && result.differing)
          return read('policies', false)
        }).then(function (policies) {
          if (!policies) return
          policiesListEl.innerHTML = ''
          policies.forEach(addPolicyRow)
        }).catch(function (error) {
          said(policyImportSaidEl, errorText(error), true)
        })
      }

      el('import-policy-seeds').addEventListener('click', function () { runPolicySeedImport(null) })

      // ---------- baseline notice: render, review, dismiss --------------------

      var policySeedNoticeEl = el('policy-seed-notice')
      var policySeedNoticeTextEl = el('policy-seed-notice-text')

      /** Paints (or hides) the "the shipped baseline changed" notice from the
       *  worker's POLICY_SEED_NOTICE_STATUS_KEY mirror. Rendered ONLY when the
       *  status exists, says it is due, and its own counts are non-zero -- the
       *  panel never invents a reason to show this and never computes the
       *  counts itself; both numbers here are always the worker's. */
      function renderPolicySeedNotice (status) {
        var added = (status && typeof status.added === 'number') ? status.added : 0
        var differing = (status && typeof status.differing === 'number') ? status.differing : 0
        var visible = !!status && status.due === true && (added + differing) > 0
        policySeedNoticeEl.style.display = visible ? '' : 'none'
        if (!visible) return
        policySeedNoticeTextEl.textContent = t('policies.seedNoticeText', { added: String(added), differing: String(differing) })
      }

      /** Renders both halves of the worker's POLICY_SEED_NOTICE_STATUS_KEY
       *  mirror together: the banner, and -- while it is actually due --
       *  the tick list straight from `status.differingItems`, the same
       *  `{id, existing, seed, fields}` shape a live import's own
       *  `result.differing` already carries. This is what keeps the list
       *  visible on a plain panel reload, not only right after clicking
       *  "Review"/"Adopt ticked": see main.mjs's computePolicySeedNoticeDecision
       *  and the JEVADV-27 note there. Gated on `due`, not merely on the list
       *  being non-empty: an install already marked offered (a resolved
       *  notice, or one from before this fix existed) must not show a stale
       *  list nobody asked to see again -- `runPolicySeedImport` below still
       *  renders `result.differing` unconditionally right after a live
       *  import, which is how that install can still review on request. */
      function renderPolicySeedNoticeAndDiffs (status) {
        renderPolicySeedNotice(status)
        renderPolicySeedDiffs(status && status.due === true ? status.differingItems : [])
      }

      function loadPolicySeedNoticeStatus () {
        return read(POLICY_SEED_NOTICE_STATUS_KEY, false).then(renderPolicySeedNoticeAndDiffs)
      }

      el('policy-seed-notice-review').addEventListener('click', function () {
        // The existing choose-flow already renders the differing rows and
        // lets the person tick which ones to adopt -- this notice never
        // writes `policies` itself, only opens that same flow with nothing
        // pre-accepted.
        runPolicySeedImport([]).then(loadPolicySeedNoticeStatus)
      })

      el('policy-seed-notice-dismiss').addEventListener('click', function () {
        said(policyImportSaidEl, t('policies.seedNoticeDismissing'))
        sendPolicySeedDismissRequest().then(function () {
          said(policyImportSaidEl, t('policies.seedNoticeDismissed'))
          return loadPolicySeedNoticeStatus()
        }).catch(function (error) {
          said(policyImportSaidEl, errorText(error), true)
        })
      })

      // ---------- skill/tool selection switches --------------------------------

      /** Paints the two checkboxes from the worker's MOD_SKILLS_STATUS_KEY
       *  mirror. `status` is `null`/`undefined` before the first real read
       *  (or if the worker has never published it), which leaves both
       *  checkboxes unchecked -- the same "off" the file itself defaults to
       *  when it has never been written. */
      // Mirrors DEFAULT_MOD_SKILLS_READINESS_THRESHOLDS in
      // src/core/mod_skills_readiness.ts. Used only until the worker has
      // published a summary carrying the real ones -- the hint above the
      // switches names a number, and a hint that names no number is exactly
      // the "a week of data" hand-wave this replaced.
      var READINESS_FALLBACK = { minComparable: 1000, minMatchRate: 0.7 }

      /** Paints the hint's thresholds and the live "how far off" line.
       *  A null matchRate is never rendered as 0%: it means no comparable
       *  evidence yet, which is a different sentence. */
      function renderModSkillsReadiness (measurements) {
        var mod = measurements && measurements.ok ? measurements.modSkills : null
        var readiness = mod && mod.readiness ? mod.readiness : null
        var thresholds = (readiness && readiness.thresholds) || READINESS_FALLBACK
        var params = {
          minComparable: String(thresholds.minComparable),
          minMatchRate: String(Math.round(thresholds.minMatchRate * 100))
        }
        el('mod-skills-hint').textContent = t('modSkills.hint', params)

        var lineEl = el('mod-skills-readiness')
        if (!readiness) { lineEl.textContent = t('modSkills.readiness.unknown'); return }
        var comparable = mod.comparableCount || 0
        params.comparable = String(comparable)
        params.shortfall = String(readiness.comparableShortfall || 0)
        params.matchRate = mod.matchRate == null ? '-' : String(Math.round(mod.matchRate * 1000) / 10)
        if (comparable === 0) { lineEl.textContent = t('modSkills.readiness.noData'); return }
        if (readiness.reason === 'ready') { lineEl.textContent = t('modSkills.readiness.ready', params); return }
        if (readiness.reason === 'match-rate-too-low') { lineEl.textContent = t('modSkills.readiness.rateLow', params); return }
        lineEl.textContent = t('modSkills.readiness.shortfall', params)
      }

      function fillModSkillsStatus (status) {
        el('mod-skills-active').checked = !!(status && status.active === true)
        el('mod-skills-active-tools').checked = !!(status && status.activeTools === true)
      }

      var modSkillsSaidEl = el('mod-skills-said')
      el('save-mod-skills').addEventListener('click', function () {
        said(modSkillsSaidEl, t('modSkills.saving'))
        var active = el('mod-skills-active').checked
        var activeTools = el('mod-skills-active-tools').checked
        sendModSkillsConfigRequest(active, activeTools).then(function () {
          said(modSkillsSaidEl, t('modSkills.saved'))
        }).catch(function (error) {
          said(modSkillsSaidEl, errorText(error), true)
        })
      })

      // ---------- deny tier ---------------------------------------------------

      /** Paints the three checkboxes from the worker's DENY_TIER_STATUS_KEY
       *  mirror. `status` is `null`/`undefined` before the first real read --
       *  unlike fillModSkillsStatus, that must NOT leave the checkboxes
       *  unchecked: the fail-CLOSED default is all three CHECKED (still
       *  denying), the same default a brand-new install reads from an
       *  unwritten file (src/core/deny_tier_config.ts). A checkbox reads
       *  unchecked here only when the mirror explicitly says `false`. */
      // One entry per tier-1b rule, in the order the gate matches them. The
      // rows are built from this list rather than written out in the markup,
      // so a rule cannot exist in the gate with no way for a person to reach
      // it -- which is exactly how the skills switches ended up unreachable.
      var DENY_RULES = [
        { key: 'denyForcePush', name: 'forcePush' },
        { key: 'denyPushProtected', name: 'pushProtected' },
        { key: 'denyRmRf', name: 'rmRf' },
        { key: 'denyResetClean', name: 'resetClean' },
        { key: 'denyDropTable', name: 'dropTable' },
        { key: 'denyKubectlDelete', name: 'kubectlDelete' },
        { key: 'denyTerraformApply', name: 'terraformApply' },
        { key: 'denyTerraformDestroy', name: 'terraformDestroy' },
        { key: 'denyCurlPipeShell', name: 'curlPipeShell' }
      ]

      function denyRowsBuilt () { return el('deny-tier-rows').childNodes.length > 0 }

      function buildDenyTierRows () {
        var host = el('deny-tier-rows')
        DENY_RULES.forEach(function (rule) {
          var row = elMake('div'); row.className = 'checkbox-row'
          var box = elMake('input'); box.type = 'checkbox'; box.id = 'deny-' + rule.name
          var text = elMake('div'); text.className = 'checkbox-text'
          var label = elMake('span'); label.className = 'checkbox-label'
          label.textContent = t('denyTier.' + rule.name + 'Label')
          var hint = elMake('span'); hint.className = 'hint'
          hint.textContent = t('denyTier.' + rule.name + 'Hint')
          text.appendChild(label); text.appendChild(hint)
          row.appendChild(box); row.appendChild(text)
          host.appendChild(row)
        })
      }

      // Absent or non-boolean means denying, the same fail-closed direction
      // the gate and the parser take. Only an explicit false unchecks a box.
      function fillDenyTierStatus (status) {
        if (!denyRowsBuilt()) buildDenyTierRows()
        DENY_RULES.forEach(function (rule) {
          el('deny-' + rule.name).checked = !(status && status[rule.key] === false)
        })
      }

      var denyTierSaidEl = el('deny-tier-said')
      el('save-deny-tier').addEventListener('click', function () {
        said(denyTierSaidEl, t('denyTier.saving'))
        var switches = {}
        DENY_RULES.forEach(function (rule) { switches[rule.key] = el('deny-' + rule.name).checked })
        sendDenyTierConfigRequest(switches).then(function () {
          said(denyTierSaidEl, t('denyTier.saved'))
        }).catch(function (error) {
          said(denyTierSaidEl, errorText(error), true)
        })
      })

      // ---------- umbrales --------------------------------------------------

      // Mirrors main.mjs's GATE_DEFAULTS_KEY (see that file's own module
      // note on why this exists: consequenceCeiling had no honest literal
      // fallback a panel could hardcode).
      var GATE_DEFAULTS_KEY = 'gateDefaults'

      // actThreshold, confirmThreshold, reversibleGate and externalGate used
      // to live here too -- removed as dead config, read by no decision
      // anywhere (production-honesty-pass P2). consequenceCeiling was kept at
      // first because this task's own inventory named it live; it was not --
      // getConfig() has exactly two real callers (logMaxEntries, jevBudgetMs)
      // and never this field, so it was a fifth dead field, not a fourth. It
      // is still shown below, because the number is genuinely useful, but as
      // a read-only <output>, never an <input> -- do not turn it back into an
      // editable control without first wiring it to something that reads it.
      function fillThresholds (config, gateDefaults) {
        config = config || {}
        // consequenceCeiling has no honest literal fallback here: 1.5 was a
        // stale copy of a value src/core/decisions.ts has since re-measured
        // to 1.78 (GATE_CONSEQUENCE_CEILING), and a panel cannot import from
        // src/core. The real number comes from the worker's GATE_DEFAULTS_KEY
        // mirror (see T7 in odd/tasks/panel-worker-wakeup.md); until that has
        // ever been published, this stays honestly blank rather than show a
        // guessed number. There is nothing to "save" here anymore, so there
        // is no blank-value save guard either -- see readConfig below.
        var gateConsequenceCeiling = gateDefaults && typeof gateDefaults.consequenceCeiling === 'number' ? gateDefaults.consequenceCeiling : null
        el('consequenceCeiling').value = gateConsequenceCeiling != null ? String(gateConsequenceCeiling) : ''
        el('logMaxEntries').value = config.logMaxEntries != null ? config.logMaxEntries : 500
      }

      function readConfig (previous) {
        return {
          logMaxEntries: Number(el('logMaxEntries').value),
          jevBudgetMs: (previous && previous.jevBudgetMs) || 4000
        }
      }

      // ---------- clave secreta --------------------------------------------

      var secretStatusEl = el('secret-status')
      var keySaidEl = el('key-said')
      var lastSecretStatus = null

      // Three UI states over this one section, all driven from here so
      // there is exactly one place that decides what is visible:
      //  - 'empty'     no key configured yet -- label+input+Save, no Remove.
      //  - 'idle'      a key exists -- only the status line, Replace and Remove.
      //  - 'replacing' user asked to replace -- label+input+Save reappear
      //                (auto-focused) plus Cancel, alongside Remove.
      // 'replacing' is UI-only: it never touches the stored key, and Cancel
      // just falls back to 'idle' with no host call.
      var secretUiMode = 'empty'

      function applySecretUiMode () {
        var showInput = secretUiMode !== 'idle'
        el('secret-input-group').style.display = showInput ? '' : 'none'
        el('save-key').style.display = showInput ? '' : 'none'
        el('replace-key').style.display = secretUiMode === 'idle' ? '' : 'none'
        el('cancel-key').style.display = secretUiMode === 'replacing' ? '' : 'none'
        el('clear-key').style.display = secretUiMode === 'empty' ? 'none' : ''
        if (secretUiMode === 'replacing') el('api-key').focus()
      }

      // The panel never reads the key back: it only paints what the worker
      // published in SECRET_STATUS_KEY (isConfigured/endsWith), never the
      // full value.
      // `heartbeat` is `undefined` for the very first, synchronous paint
      // (before the real storage reads in load() below have even started --
      // "Checking..." is simply true there) and either `null` or a real
      // heartbeat object once loadSecretStatus has actually asked. Only in
      // that second case does an absent/stale heartbeat mean "no worker is
      // running" rather than "still finding out" (see T4 in
      // odd/tasks/panel-worker-wakeup.md).
      function renderSecretStatus (status, heartbeat) {
        lastSecretStatus = status
        if (status === null) {
          secretStatusEl.textContent = (heartbeat === undefined || isHeartbeatFresh(heartbeat, Date.now(), WORKER_HEARTBEAT_STALE_MS))
            ? t('secret.checking')
            : t('common.workerSilent')
          secretUiMode = 'empty'
          applySecretUiMode()
          return
        }
        if (status && status.configured) {
          secretStatusEl.textContent = t('secret.configured', { tail: status.endsWith || '????' })
          secretUiMode = secretUiMode === 'replacing' ? 'replacing' : 'idle'
        } else {
          secretStatusEl.textContent = t('secret.notConfigured')
          secretUiMode = 'empty'
        }
        applySecretUiMode()
      }

      el('replace-key').addEventListener('click', function () {
        secretUiMode = 'replacing'
        applySecretUiMode()
      })

      el('cancel-key').addEventListener('click', function () {
        el('api-key').value = ''
        secretUiMode = 'idle'
        applySecretUiMode()
      })

      function loadSecretStatus () {
        return Promise.all([read(SECRET_STATUS_KEY, false), read(WORKER_HEARTBEAT_KEY, false)]).then(function (results) {
          renderSecretStatus(results[0], results[1])
        })
      }

      function said (node, text, bad) {
        node.textContent = text || ''
        node.className = 'said' + (bad ? ' bad' : '')
      }

      el('save-key').addEventListener('click', function () {
        var input = el('api-key')
        var value = input.value.trim()
        if (value.length === 0) return
        said(keySaidEl, t('secret.saving'))
        sendSecretRequest('save', value).then(function () {
          input.value = ''
          said(keySaidEl, t('secret.saved'))
          secretUiMode = 'idle'
          return loadSecretStatus()
        }).catch(function (error) {
          said(keySaidEl, errorText(error), true)
        })
      })

      el('clear-key').addEventListener('click', function () {
        said(keySaidEl, t('secret.clearing'))
        sendSecretRequest('clear').then(function () {
          said(keySaidEl, t('secret.cleared'))
          return loadSecretStatus()
        }).catch(function (error) {
          said(keySaidEl, errorText(error), true)
        })
      })

      // ---------- Claude Code integration ------------------------------------

      var claudeIntegrationStatusEl = el('claude-integration-status')
      var claudeIntegrationSaidEl = el('claude-integration-said')
      var lastClaudeIntegrationStatus = null

      function li (text) {
        var item = elMake('li')
        item.textContent = text
        return item
      }

      /** Renders an ISO timestamp the way board.html's own `when()` does --
       *  the person's own locale, through the browser's own formatter,
       *  never a hand-built date string. Falls back to the raw ISO text on
       *  anything unparsable rather than showing nothing. */
      function formatSince (iso) {
        var ms = Date.parse(String(iso || ''))
        if (!ms) return String(iso || '')
        try { return new Date(ms).toLocaleString() } catch (error) { return String(iso) }
      }

      /**
       * What the skills mod line says, per odd/tasks/production-honesty-
       * pass.md's P6: derived from mod-skills-measurements.jsonl (via
       * MEASUREMENTS_STATUS_KEY, read-measurements.mjs's aggregateModSkills),
       * never from whether the copy exists. Three honest states:
       *
       *   not installed          -- the copy isn't there yet.
       *   installed, never run   -- the copy is in place but the mod has
       *                             produced zero recorded prompts. This is
       *                             the actionable one: the mod loads only
       *                             when a Claude Code session STARTS, so an
       *                             already-open session will never pick it
       *                             up, and nobody can guess that from "not
       *                             installed" or a green checkmark.
       *                             installed but never run.
       *   recording               -- N prompts, since when, most recent.
       */
      function modSkillsLine (modCopy, measurements, modSkillsStatus) {
        // The switches and the copy on disk are two separate truths, and
        // until now nobody crossed them: after an update that did not
        // reapply the copy, this panel would say "not installed" in one
        // place while the switches above it sat ON in another -- switches
        // commanding a mod that is not there. Observed in the field with
        // `modCopy exists:false` across all four config roots while
        // mod-skills-config.json read `active:true, activeTools:true`, and
        // mod-skills-measurements.jsonl had never been created at all.
        var switchedOn = !!(modSkillsStatus && (modSkillsStatus.active === true || modSkillsStatus.activeTools === true))
        if (!modCopy || !modCopy.exists) {
          return switchedOn ? t('integration.modOnButMissing') : t('integration.modNotInstalled')
        }
        var mod = measurements && measurements.ok ? measurements.modSkills : null
        var count = mod ? mod.totalDecisions || 0 : 0
        if (!mod || count === 0) return t('integration.modNeverRun')
        return t('integration.modRecording', {
          count: String(count),
          since: formatSince(mod.firstAt),
          last: formatSince(mod.lastAt)
        })
      }

      // Paints exactly what the worker published in
      // CLAUDE_INTEGRATION_STATUS_KEY -- never the key, and never more detail
      // than the panel needs for the user to know what's set up and where.
      //
      // `heartbeat` follows the same undefined/null/object convention as
      // renderSecretStatus above: `undefined` only for the very first,
      // synchronous paint before load() has asked storage anything, where
      // "Checking..." is simply true. Once loadClaudeIntegrationStatus has
      // actually read the heartbeat, an absent or stale one means no worker
      // is running -- a fixed 20s guess used to stand in for this and could
      // say "not running" about a worker that was, in fact, running (see T4
      // in odd/tasks/panel-worker-wakeup.md).
      function renderClaudeIntegrationStatus (status, heartbeat, measurements, modSkillsStatus) {
        lastClaudeIntegrationStatus = status
        claudeIntegrationStatusEl.innerHTML = ''
        if (status === null) {
          claudeIntegrationStatusEl.appendChild(li(
            (heartbeat === undefined || isHeartbeatFresh(heartbeat, Date.now(), WORKER_HEARTBEAT_STALE_MS))
              ? t('integration.checking')
              : t('common.workerSilent')
          ))
          return
        }
        if (!status || !status.ok) {
          claudeIntegrationStatusEl.appendChild(li(t('integration.statusUnavailable')))
          return
        }
        var hookLine = status.hook && status.hook.installed
          ? t('integration.hookCount', { installed: String(status.hook.installedCount), total: String(status.hook.totalCount) })
          : t('integration.hookNotInstalled')
        claudeIntegrationStatusEl.appendChild(li(hookLine))

        // Orca's own panes are the ones that matter most for a plugin shipped
        // for Orca, and they read a different settings.json than ~/.claude --
        // so they get their own line rather than hiding inside a total.
        var panes = status.hook && status.hook.orcaPaneCount
        var paneLine = !panes
          ? t('integration.hookPanesNone', { reason: (status.orcaUserData && status.orcaUserData.reason) || '-' })
          : (status.hook.orcaPanesCovered ? t('integration.hookPanesCovered', { panes: String(panes) }) : t('integration.hookPanesMissing'))
        claudeIntegrationStatusEl.appendChild(li(paneLine))

        var envLine = status.env && status.env.installed
          ? t('integration.envInstalled', { name: status.env.name })
          : t('integration.envNotInstalled')
        claudeIntegrationStatusEl.appendChild(li(envLine))

        // write-secret-mirror.mjs's statMirror() always reports `exists` and
        // `path` alongside `ok`; a record missing either cannot say anything
        // true about the file, so it gets the "could not check" line rather
        // than a sentence with "undefined" where the path should be. A known
        // absence with no path keeps its meaning without the placeholder.
        var mirror = status.secretMirror
        var mirrorLine
        if (!mirror || !mirror.ok || typeof mirror.exists !== 'boolean') {
          mirrorLine = t('integration.mirrorUnknown')
        } else if (!mirror.exists) {
          mirrorLine = mirror.path ? t('integration.mirrorMissing', { path: mirror.path }) : t('integration.mirrorMissingNoPath')
        } else if (!mirror.path) {
          mirrorLine = t('integration.mirrorUnknown')
        } else if (mirror.platform === 'win32') {
          mirrorLine = t('integration.mirrorPresentWindows', { path: mirror.path })
        } else {
          mirrorLine = t('integration.mirrorPresent', { mode: mirror.mode, path: mirror.path })
        }
        claudeIntegrationStatusEl.appendChild(li(mirrorLine))

        claudeIntegrationStatusEl.appendChild(li(modSkillsLine(status.modCopy, measurements, modSkillsStatus)))

        // odd/tasks/model-reclassification.md T7 -- one added line, guarded
        // on the field existing (install-claude-integration.mjs's status()
        // only ever omits it if an older worker build never computed it).
        if (status.agentModelHook && typeof status.agentModelHook.installed === 'boolean') {
          var agentModelHookLine = status.agentModelHook.installed
            ? t('integration.agentModelHookInstalled', { installed: String(status.agentModelHook.installedCount), total: String(status.agentModelHook.totalCount) })
            : t('integration.agentModelHookNotInstalled')
          claudeIntegrationStatusEl.appendChild(li(agentModelHookLine))
        }
      }

      var MEASUREMENTS_STATUS_KEY = 'measurementsSummary'

      function loadClaudeIntegrationStatus () {
        return Promise.all([
          read(CLAUDE_INTEGRATION_STATUS_KEY, false),
          read(WORKER_HEARTBEAT_KEY, false),
          read(MEASUREMENTS_STATUS_KEY, false),
          read(MOD_SKILLS_STATUS_KEY, false)
        ]).then(function (results) {
          renderClaudeIntegrationStatus(results[0], results[1], results[2], results[3])
          renderModSkillsReadiness(results[2])
        })
      }

      el('claude-integration-setup').addEventListener('click', function () {
        said(claudeIntegrationSaidEl, t('integration.configuring'))
        sendClaudeIntegrationRequest('install').then(function (result) {
          // odd/tasks/production-honesty-pass.md P5: install() can succeed
          // overall (the hook and env var went in) while the skills-mod copy
          // specifically failed -- that must not be reported as plain
          // "Done.", or the person has no way to know the copy needs
          // attention.
          said(claudeIntegrationSaidEl, result && result.modCopyWarning
            ? t('integration.doneWithWarning', { warning: modCopyWarningMessage(result.modCopyWarning) })
            : t('integration.done'))
          return loadClaudeIntegrationStatus()
        }).catch(function (error) {
          said(claudeIntegrationSaidEl, errorText(error), true)
        })
      })

      el('claude-integration-revert').addEventListener('click', function () {
        said(claudeIntegrationSaidEl, t('integration.reverting'))
        sendClaudeIntegrationRequest('uninstall').then(function () {
          said(claudeIntegrationSaidEl, t('integration.reverted'))
          return loadClaudeIntegrationStatus()
        }).catch(function (error) {
          said(claudeIntegrationSaidEl, errorText(error), true)
        })
      })

      // ---------- guardar / cargar ------------------------------------------

      var saveSaidEl = el('save-said')
      var currentConfig = null

      el('save-all').addEventListener('click', function () {
        // consequenceCeiling used to be saved from here too, with a guard
        // against persisting a blank/guessed value (see T7 in
        // odd/tasks/panel-worker-wakeup.md). It is read-only now and never
        // part of readConfig's output, so there is nothing left to guard.
        said(saveSaidEl, t('save.saving'))
        var config = readConfig(currentConfig)
        // Named, not anonymous: a Promise.all that only asks "did any of
        // these fail" loses which one -- the exact "something failed and
        // the message did not say what" shape this whole release is fixing
        // elsewhere. Each write keeps its own label so a refusal can name
        // the actual write(s) that failed, not a single generic sentence.
        var namedWrites = [
          { label: t('save.whichConfig'), promise: write('config', config) },
          { label: t('save.whichCatalog'), promise: write('catalog', readCatalog()) },
          { label: t('save.whichPolicies'), promise: write('policies', readPolicies()) }
        ]
        Promise.all(namedWrites.map(function (w) { return w.promise })).then(function (results) {
          var failedLabels = []
          results.forEach(function (result, index) {
            if (!result || !result.ok) failedLabels.push(namedWrites[index].label)
          })
          if (failedLabels.length > 0) throw shownError(t('save.rejectedWhich', { which: failedLabels.join(', ') }))
          writeBackground(CATALOG_POLICY_MIRROR_REQUEST_KEY, new Date().toISOString())
          currentConfig = config
          said(saveSaidEl, t('save.saved'))
        }).catch(function (error) {
          said(saveSaidEl, errorText(error), true)
        })
      })

      function load () {
        fillThresholds({})
        fillModSkillsStatus(null)
        fillDenyTierStatus(null)
        renderPolicySeedNoticeAndDiffs(null)
        // Orca's own language decides, not a preference stored here: the
        // developer already chose it once, in Orca's settings. What is stored
        // exists only to reach the gate and the skills mod, which run outside
        // Orca and cannot see this document.
        return Promise.resolve().then(function () {
          applyStaticI18n()
          renderSecretStatus(null)
          renderClaudeIntegrationStatus(null)
          return Promise.all([
            read('config', false),
            read('catalog', false),
            read('policies', false),
            read(GATE_DEFAULTS_KEY, false),
            read(MOD_SKILLS_STATUS_KEY, false),
            read(DENY_TIER_STATUS_KEY, false),
            read(POLICY_SEED_NOTICE_STATUS_KEY, false),
            loadSecretStatus(),
            loadClaudeIntegrationStatus()
          ])
        }).then(function (results) {
          currentConfig = results[0]
          fillThresholds(currentConfig, results[3])
          catalogListEl.innerHTML = ''
          ;((results[1] && results[1].destinations) || []).forEach(addCatalogRow)
          policiesListEl.innerHTML = ''
          ;(results[2] || []).forEach(addPolicyRow)
          fillModSkillsStatus(results[4])
          fillDenyTierStatus(results[5])
          renderPolicySeedNoticeAndDiffs(results[6])
        }).catch(function (error) {
          said(saveSaidEl, errorText(error), true)
        })
      }

      // Heartbeat: while the panel is visible, it signals that it's still
      // open so the worker polls its request every ~1s instead of every ~15s.
      var heartbeatTimer = null
      function startHeartbeat () {
        if (heartbeatTimer) return
        heartbeatTimer = setInterval(function () {
          if (document.visibilityState === 'visible') signalPanelOpen()
        }, 2000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') signalPanelOpen()
      })

      signalPanelOpen()
      startHeartbeat()
      load()
    </script>

    <!--
      odd/tasks/model-reclassification.md T7 -- the Models section's own,
      self-contained script. Deliberately a second script tag rather than
      an addition to the one above: parallel work also edits config.html (a
      learned-allows section, the Team policies notice style, and the
      integration line), so every identifier here is its own thing, never a
      function added to the original script. It reuses the original
      script's globals freely (both are classic, non-module scripts sharing
      one global scope): el/elMake/read/write/writeBackground/t/said/
      shownError/errorText/errorMessageFor/signalPanelOpen/CATALOG.
    -->
    <script>
      'use strict'

      // ---------- storage keys -------------------------------------------
      // Verbatim from adapters/orca/models-worker.mjs's own exported
      // constants -- see that file's module note for the shapes behind
      // each one.
      var MODELS_KEY = 'models'
      var MODELS_CONFIG_KEY = 'modelsConfig'
      var MODELS_MIRROR_REQUEST_KEY = 'modelsMirrorRequest'
      var MODELS_SEED_NOTICE_KEY = 'modelsSeedNotice'
      var MODELS_SEED_REQUEST_KEY = 'modelsSeedRequest'
      var MODELS_SEED_RESULT_KEY = 'modelsSeedResult'
      var MODEL_MEASUREMENTS_KEY = 'modelMeasurements'

      // Mirrors DEFAULT_MOD_SKILLS_READINESS_THRESHOLDS
      // (src/core/mod_skills_readiness.ts), the same way READINESS_FALLBACK
      // above mirrors it for the skills mod: summarizeModelMeasurements
      // (src/core/model_measurement.ts) always evaluates readiness against
      // exactly this constant, so naming it here is not a guess -- only a
      // fallback for the hint text before the first real readout loads.
      var MODELS_READINESS_FALLBACK = { minComparable: 1000, minMatchRate: 0.7 }

      // ---------- catalog shape (hand-copied, read-only check) -----------
      // Mirrors isModelEntry (src/core/model_catalog.ts) -- this sandboxed
      // panel has no module graph reaching src/core (see isHeartbeatFresh's
      // own comment, above, for the same reasoning applied to worker-
      // status.mjs). A row failing this is dropped here, exactly as
      // parseModelCatalog drops it on the worker side: one bad row costs
      // only that row.
      function modelsParseCatalog (value) {
        if (!Array.isArray(value)) return []
        return value.filter(function (row) {
          return !!row && typeof row === 'object' &&
            typeof row.id === 'string' && row.id.length > 0 &&
            typeof row.provider === 'string' && row.provider.length > 0 &&
            typeof row.label === 'string' && row.label.length > 0 &&
            (row.rank === null || (typeof row.rank === 'number' && row.rank >= 1)) &&
            typeof row.agentModel === 'string' && row.agentModel.length > 0 &&
            typeof row.source === 'string' &&
            typeof row.available === 'boolean' &&
            (row.summary === undefined || typeof row.summary === 'string')
        })
      }

      /** Ranked entries first (by rank ascending), then unranked ones in
       *  stored order -- the exact rule src/core/model_catalog.ts's
       *  orderedLadder applies, hand-copied for the same reason as
       *  modelsParseCatalog above. This is also the DISPLAY-order
       *  invariant modelsReorder below assumes: a ranked prefix followed
       *  by an unranked tail. */
      function modelsSplitLadder (entries) {
        var ranked = entries.filter(function (e) { return e.rank !== null })
          .slice().sort(function (a, b) { return a.rank - b.rank })
        var unranked = entries.filter(function (e) { return e.rank === null })
        return ranked.concat(unranked)
      }

      /** The only shape allowed onto the wire for one row -- mirrors
       *  buildDestinationRow/buildPolicyRow above: every field isModelEntry
       *  requires is always present with the right type, and a blank
       *  optional field is OMITTED rather than sent as `''`/`undefined`
       *  (see stripUndefinedValues's own comment for why `undefined`
       *  specifically must never reach storage.set). */
      function modelsBuildRow (fields) {
        var row = {
          id: fields.id,
          provider: fields.provider,
          label: fields.label,
          rank: fields.rank === undefined ? null : fields.rank,
          agentModel: fields.agentModel,
          source: fields.source || '',
          available: !!fields.available
        }
        if (fields.summary) row.summary = fields.summary
        return row
      }

      /** Pure: renumbers every RANKED row 1..n in its current display-order
       *  position, leaving unranked rows (rank: null) untouched. Every
       *  rank-changing action below (reorder, rank this, mark unranked,
       *  remove) finishes with this pass, so a rank can never gap or
       *  duplicate no matter which action touched the ladder last. */
      function modelsRenumber (display) {
        var next = 1
        return display.map(function (row) {
          if (row.rank === null) return row
          var renumbered = Object.assign({}, row, { rank: next })
          next += 1
          return renumbered
        })
      }

      /**
       * Pure reorder over a ladder already in DISPLAY order (see
       * modelsSplitLadder). Moving up/down only swaps positions WITHIN the
       * ranked part -- an unranked row has no up/down of its own (the UI
       * disables those buttons for it; this still no-ops defensively if
       * called on one anyway). The ONLY way an unranked entry enters the
       * ranked ladder is the explicit "Rank this" action (modelsRankThis
       * below), which appends it at the bottom without displacing anyone --
       * the ladder could never grow before that action existed.
       * Finishes with modelsRenumber so the swap can never leave a gap or
       * a duplicate rank behind.
       */
      function modelsReorder (display, index, direction) {
        var rows = display.map(function (row) { return Object.assign({}, row) })
        var rankedCount = rows.filter(function (r) { return r.rank !== null }).length
        if (index < 0 || index >= rankedCount) return rows
        var target = direction === 'up' ? index - 1 : index + 1
        if (target < 0 || target >= rankedCount) return rows
        var tmp = rows[index]
        rows[index] = rows[target]
        rows[target] = tmp
        return modelsRenumber(rows)
      }

      /** Pure: moves one UNRANKED row into the ranked ladder, appended at
       *  the bottom (the newest, lowest rank) without demoting anyone --
       *  the ONLY way an entry enters the ranked part. Renumbered
       *  immediately after, same discipline as every other rank-changing
       *  action. */
      function modelsRankThis (display, index) {
        var rows = display.map(function (row) { return Object.assign({}, row) })
        var row = rows[index]
        rows.splice(index, 1)
        var rankedCount = rows.filter(function (r) { return r.rank !== null }).length
        row.rank = rankedCount + 1
        rows.splice(rankedCount, 0, row)
        return modelsRenumber(rows)
      }

      /** Pure: moves one ranked row out to the front of the unranked tail,
       *  then renumbers the ranked rows left behind so leaving the ladder
       *  never opens a gap. */
      function modelsMarkUnranked (display, index) {
        var rows = display.map(function (row) { return Object.assign({}, row) })
        var row = rows[index]
        row.rank = null
        rows.splice(index, 1)
        var newRankedCount = rows.filter(function (r) { return r.rank !== null }).length
        rows.splice(newRankedCount, 0, row)
        return modelsRenumber(rows)
      }

      /** Pure: removes one row outright, then renumbers the ranked rows
       *  left behind so removing a ranked entry never opens a gap. */
      function modelsRemove (display, index) {
        var rows = display.map(function (row) { return Object.assign({}, row) })
        rows.splice(index, 1)
        return modelsRenumber(rows)
      }

      // ---------- ladder editor: state + render ---------------------------

      /** The ladder, always kept in DISPLAY order (modelsSplitLadder's
       *  invariant). Loaded once in modelsLoad, mutated in place by every
       *  button below, and only written to storage when "Save the ladder"
       *  is pressed -- exactly like the destination/policy editors above,
       *  which stage every edit in the DOM until "Save configuration". */
      var modelsLadder = []

      /** Whether the ladder has edits not yet written to storage by "Save
       *  the ladder" -- set by every mutating ladder action (reorder, rank
       *  this, mark unranked, remove, add, toggling available), cleared by
       *  a successful save, a fresh load, and "Discard my edits". The
       *  baseline notice's Apply button refuses to run while this is true:
       *  applying replaces modelsLadder outright with a fresh
       *  storage read, and doing that over unsaved edits would silently
       *  discard them. */
      var modelsDirty = false

      var modelsLadderListEl = el('models-ladder-list')

      function modelsRenderLadder () {
        el('models-empty-catalog-hint').style.display = modelsLadder.length === 0 ? '' : 'none'
        modelsLadderListEl.innerHTML = ''
        var rankedCount = modelsLadder.filter(function (r) { return r.rank !== null }).length

        modelsLadder.forEach(function (row, index) {
          var entry = elMake('div', 'entry')

          var top = elMake('div', 'models-row-fields')
          var name = elMake('span', 'entry-name')
          name.textContent = row.label + ' (' + row.id + ')'
          top.appendChild(name)
          var badge = elMake('span', 'models-badge')
          badge.textContent = row.rank !== null ? t('models.rankLabel', { rank: String(row.rank) }) : t('models.unrankedBadge')
          top.appendChild(badge)
          entry.appendChild(top)

          var meta = elMake('div', 'models-row-meta')
          meta.textContent = row.provider + ' · ' + row.agentModel
          entry.appendChild(meta)

          if (row.source && /^https?:\/\//i.test(row.source)) {
            var link = elMake('a')
            link.href = row.source
            link.target = '_blank'
            link.rel = 'noopener'
            link.textContent = t('models.sourceLink')
            entry.appendChild(link)
          }

          var availableRow = elMake('div', 'checkbox-row')
          var availableBox = elMake('input')
          availableBox.type = 'checkbox'
          availableBox.checked = !!row.available
          availableBox.addEventListener('change', function () {
            row.available = availableBox.checked
            modelsDirty = true
          })
          var availableText = elMake('div', 'checkbox-text')
          var availableLabel = elMake('span', 'checkbox-label')
          availableLabel.textContent = t('models.availableLabel')
          availableText.appendChild(availableLabel)
          availableRow.appendChild(availableBox)
          availableRow.appendChild(availableText)
          entry.appendChild(availableRow)

          var actions = elMake('div', 'entry-actions')

          // Up/down only ever move a RANKED row -- an unranked row has no
          // order of its own until "Rank this" gives it one, so its own
          // arrows stay disabled rather than doing anything.
          var upBtn = elMake('button')
          upBtn.type = 'button'
          upBtn.textContent = t('models.moveUp')
          upBtn.disabled = row.rank === null || index === 0
          upBtn.addEventListener('click', function () {
            modelsLadder = modelsReorder(modelsLadder, index, 'up')
            modelsDirty = true
            modelsRenderLadder()
          })
          actions.appendChild(upBtn)

          var downBtn = elMake('button')
          downBtn.type = 'button'
          downBtn.textContent = t('models.moveDown')
          downBtn.disabled = row.rank === null || index === rankedCount - 1
          downBtn.addEventListener('click', function () {
            modelsLadder = modelsReorder(modelsLadder, index, 'down')
            modelsDirty = true
            modelsRenderLadder()
          })
          actions.appendChild(downBtn)

          if (row.rank !== null) {
            var unrankBtn = elMake('button')
            unrankBtn.type = 'button'
            unrankBtn.textContent = t('models.markUnranked')
            unrankBtn.addEventListener('click', function () {
              modelsLadder = modelsMarkUnranked(modelsLadder, index)
              modelsDirty = true
              modelsRenderLadder()
            })
            actions.appendChild(unrankBtn)
          } else {
            // The only door into the ranked ladder: appends this row at
            // the bottom without demoting anyone.
            var rankThisBtn = elMake('button')
            rankThisBtn.type = 'button'
            rankThisBtn.textContent = t('models.rankThis')
            rankThisBtn.addEventListener('click', function () {
              modelsLadder = modelsRankThis(modelsLadder, index)
              modelsDirty = true
              modelsRenderLadder()
            })
            actions.appendChild(rankThisBtn)
          }

          var removeBtn = elMake('button', 'link')
          removeBtn.type = 'button'
          removeBtn.textContent = t('models.remove')
          removeBtn.addEventListener('click', function () {
            modelsLadder = modelsRemove(modelsLadder, index)
            modelsDirty = true
            modelsRenderLadder()
          })
          actions.appendChild(removeBtn)

          entry.appendChild(actions)
          modelsLadderListEl.appendChild(entry)
        })
      }

      el('models-add-row').addEventListener('click', function () {
        var id = el('models-add-id').value.trim()
        var label = el('models-add-label').value.trim()
        var provider = el('models-add-provider').value.trim()
        var agentModel = el('models-add-agentmodel').value.trim()
        var source = el('models-add-source').value.trim()
        var summary = el('models-add-summary').value.trim()
        var saidEl = el('models-add-said')
        if (!id || !label || !provider || !agentModel) {
          said(saidEl, t('models.addMissingFields'), true)
          return
        }
        if (modelsLadder.some(function (r) { return r.id === id })) {
          said(saidEl, t('models.addDuplicateId'), true)
          return
        }
        // Always UNRANKED and not available -- never guess an order or
        // whether the person can actually run it.
        modelsLadder.push(modelsBuildRow({
          id: id, label: label, provider: provider, agentModel: agentModel,
          source: source, summary: summary, rank: null, available: false
        }))
        modelsDirty = true
        said(saidEl, t('models.added'))
        el('models-add-id').value = ''
        el('models-add-label').value = ''
        el('models-add-provider').value = ''
        el('models-add-agentmodel').value = ''
        el('models-add-source').value = ''
        el('models-add-summary').value = ''
        modelsRenderLadder()
      })

      el('models-save-ladder').addEventListener('click', function () {
        var saidEl = el('models-ladder-said')
        said(saidEl, t('models.savingLadder'))
        write(MODELS_KEY, modelsLadder.map(modelsBuildRow)).then(function (result) {
          if (!result || !result.ok) throw shownError(t('common.hostRejectedWrite'))
          writeBackground(MODELS_MIRROR_REQUEST_KEY, new Date().toISOString())
          modelsDirty = false
          said(saidEl, t('models.savedLadder'))
        }).catch(function (error) {
          said(saidEl, errorText(error), true)
        })
      })

      // ---------- active mode switch ---------------------------------------

      /** The hint's base sentence plus the live readiness line -- a null
       *  matchRate/summary is never rendered as a 0%, exactly like
       *  renderModSkillsReadiness above. */
      function modelsRenderActiveHint (measurements) {
        var hintEl = el('models-active-hint')
        var summary = measurements && measurements.ok ? measurements.summary : null
        var readiness = summary ? summary.readiness : null
        var base = t('models.activeHint')
        if (!readiness) { hintEl.textContent = base + ' ' + t('models.readiness.unknown'); return }
        var comparable = summary.comparable || 0
        var params = {
          minComparable: String(MODELS_READINESS_FALLBACK.minComparable),
          comparable: String(comparable),
          shortfall: String(readiness.comparableShortfall || 0),
          matchRate: summary.matchRate == null ? '-' : String(Math.round(summary.matchRate * 1000) / 10)
        }
        var line
        if (comparable === 0) line = t('models.readiness.noData')
        else if (readiness.reason === 'ready') line = t('models.readiness.ready', params)
        else if (readiness.reason === 'match-rate-too-low') line = t('models.readiness.rateLow', params)
        else line = t('models.readiness.shortfall', params)
        hintEl.textContent = base + ' ' + line
      }

      el('models-save-config').addEventListener('click', function () {
        var saidEl = el('models-config-said')
        said(saidEl, t('models.savingConfig'))
        write(MODELS_CONFIG_KEY, { active: el('models-active').checked }).then(function (result) {
          if (!result || !result.ok) throw shownError(t('common.hostRejectedWrite'))
          writeBackground(MODELS_MIRROR_REQUEST_KEY, new Date().toISOString())
          said(saidEl, t('models.savedConfig'))
        }).catch(function (error) {
          said(saidEl, errorText(error), true)
        })
      })

      // ---------- baseline notice: render, apply, dismiss -------------------

      var modelsSeedNoticeEl = el('models-seed-notice')
      var modelsSeedNoticeTextEl = el('models-seed-notice-text')
      var modelsSeedNoticeItemsEl = el('models-seed-notice-items')
      var modelsSeedNoticeDirtyEl = el('models-seed-notice-dirty')
      var modelsSeedNoticeApplyBtn = el('models-seed-notice-apply')
      var modelsSeedNoticeDismissBtn = el('models-seed-notice-dismiss')

      /** Both buttons are disabled from the click that sends a
       *  request until its matching result (or the timeout) arrives, so a
       *  second click can never replace an in-flight request and strand
       *  the first waiter with "worker silent". */
      function modelsSetSeedNoticeButtonsDisabled (disabled) {
        modelsSeedNoticeApplyBtn.disabled = disabled
        modelsSeedNoticeDismissBtn.disabled = disabled
      }

      /** Shown when Apply is refused because the ladder has
       *  unsaved edits (modelsDirty). Hidden again by a fresh load, a
       *  save, or "Discard my edits" -- whichever clears the flag. */
      function modelsSetSeedNoticeDirtyVisible (visible) {
        modelsSeedNoticeDirtyEl.style.display = visible ? '' : 'none'
      }

      /** Same double-check renderPolicySeedNotice makes above: rendered
       *  ONLY when the status exists, says it is due, and its own counts
       *  are non-zero. Nothing here is ever computed by the panel itself. */
      function modelsRenderSeedNotice (status) {
        var added = status && typeof status.added === 'number' ? status.added : 0
        var differing = status && typeof status.differing === 'number' ? status.differing : 0
        var visible = !!status && status.due === true && (added + differing) > 0
        modelsSeedNoticeEl.style.display = visible ? '' : 'none'
        modelsSeedNoticeItemsEl.innerHTML = ''
        if (!visible) return
        modelsSeedNoticeTextEl.textContent = t('models.seedNoticeText', {
          version: String(status.shippedVersion), added: String(added), differing: String(differing)
        })
        // Nothing preselected -- the person ticks what they want, exactly
        // like the Team policies diff list above.
        ;(status.items || []).forEach(function (item) {
          var row = elMake('div', 'checkbox-row')
          var box = elMake('input')
          box.type = 'checkbox'
          box.setAttribute('data-models-seed-item-id', item.id)
          var text = elMake('div', 'checkbox-text')
          var label = elMake('span', 'checkbox-label')
          label.textContent = item.kind === 'added'
            ? t('models.seedNoticeItemAdded', { id: item.id, label: item.label })
            : t('models.seedNoticeItemChanged', { id: item.id, label: item.label, fields: (item.fields || []).join(', ') })
          text.appendChild(label)
          row.appendChild(box)
          row.appendChild(text)
          modelsSeedNoticeItemsEl.appendChild(row)
        })
      }

      function modelsLoadSeedNoticeStatus () {
        return read(MODELS_SEED_NOTICE_KEY, false).then(modelsRenderSeedNotice)
      }

      function modelsWaitForSeedResult (requestId, deadline) {
        return read(MODELS_SEED_RESULT_KEY, false).then(function (result) {
          if (result && result.id === requestId) {
            if (result.ok) return result
            throw shownError(errorMessageFor(result))
          }
          if (Date.now() >= deadline) throw shownError(t('common.workerSilent'))
          return new Promise(function (resolve) { setTimeout(resolve, 700) })
            .then(function () { return modelsWaitForSeedResult(requestId, deadline) })
        })
      }

      function modelsSendSeedRequest (action, acceptedIds) {
        var requestId = 'models-seed-' + Date.now() + '-' + Math.random().toString(36).slice(2)
        var request = { id: requestId, at: new Date().toISOString(), action: action, acceptedIds: acceptedIds || [] }
        signalPanelOpen()
        return write(MODELS_SEED_REQUEST_KEY, request).then(function (r) {
          if (!r || !r.ok) throw shownError(t('common.couldNotSend'))
          return modelsWaitForSeedResult(requestId, Date.now() + 20000)
        })
      }

      el('models-seed-notice-apply').addEventListener('click', function () {
        var saidEl = el('models-seed-notice-said')
        // A successful apply replaces modelsLadder outright with a
        // fresh storage read -- refuse to even ask while there are unsaved
        // ladder edits, rather than silently discarding them.
        if (modelsDirty) {
          modelsSetSeedNoticeDirtyVisible(true)
          return
        }
        var accepted = []
        modelsSeedNoticeItemsEl.querySelectorAll('input[data-models-seed-item-id]').forEach(function (box) {
          if (box.checked) accepted.push(box.getAttribute('data-models-seed-item-id'))
        })
        if (accepted.length === 0) { said(saidEl, t('models.seedNoticeNoneChosen')); return }
        said(saidEl, t('models.seedNoticeApplying'))
        modelsSetSeedNoticeButtonsDisabled(true)
        modelsSendSeedRequest('apply', accepted).then(function (result) {
          said(saidEl, t('models.seedNoticeApplied', { replaced: String(result.replaced || 0), added: String(result.added || 0) }))
          return Promise.all([read(MODELS_KEY, false), modelsLoadSeedNoticeStatus()])
        }).then(function (results) {
          modelsLadder = modelsSplitLadder(modelsParseCatalog(results[0]))
          modelsDirty = false
          modelsRenderLadder()
        }).catch(function (error) {
          said(saidEl, errorText(error), true)
        }).then(function () {
          modelsSetSeedNoticeButtonsDisabled(false)
        })
      })

      el('models-seed-notice-dismiss').addEventListener('click', function () {
        var saidEl = el('models-seed-notice-said')
        said(saidEl, t('models.seedNoticeDismissing'))
        modelsSetSeedNoticeButtonsDisabled(true)
        modelsSendSeedRequest('dismiss', []).then(function () {
          said(saidEl, t('models.seedNoticeDismissed'))
          return modelsLoadSeedNoticeStatus()
        }).catch(function (error) {
          said(saidEl, errorText(error), true)
        }).then(function () {
          modelsSetSeedNoticeButtonsDisabled(false)
        })
      })

      el('models-seed-notice-discard').addEventListener('click', function () {
        // Undoes any unsaved ladder edits by reloading the ladder
        // straight from storage, the same read Apply itself uses, then
        // clears the flag Apply was refusing on.
        var saidEl = el('models-ladder-said')
        modelsSetSeedNoticeDirtyVisible(false)
        read(MODELS_KEY, false).then(function (stored) {
          modelsLadder = modelsSplitLadder(modelsParseCatalog(stored))
          modelsDirty = false
          modelsRenderLadder()
          said(saidEl, t('models.seedNoticeEditsDiscarded'))
        }).catch(function (error) {
          said(saidEl, errorText(error), true)
        })
      })

      // ---------- measurement readout ---------------------------------------

      function modelsAppendLine (container, text) {
        var p = elMake('p', 'hint')
        p.style.margin = '4px 0'
        p.textContent = text
        container.appendChild(p)
      }

      /** Three states, never two: absent/zero decisions reads as the
       *  empty sentence; a sidecar failure (`ok: false`) is a DIFFERENT
       *  sentence -- "no calls measured yet" would be a lie about a
       *  readout that actually failed to compute; only `ok: true` with at
       *  least one decision renders the table. Every number below comes
       *  straight from `summary`, never invented. */
      function modelsRenderMeasurements (measurements) {
        var container = el('models-measurements')
        container.innerHTML = ''
        if (!measurements) { modelsAppendLine(container, t('models.measurementsEmpty')); return }
        if (!measurements.ok) { modelsAppendLine(container, t('models.measurementsUnavailable')); return }
        var summary = measurements.summary
        if (!summary || summary.decisions === 0) { modelsAppendLine(container, t('models.measurementsEmpty')); return }
        modelsAppendLine(container, t('models.measurementsDecisions', { decisions: String(summary.decisions) }))
        modelsAppendLine(container, t('models.measurementsJudged', { judged: String(summary.judged) }))
        modelsAppendLine(container, t('models.measurementsUnjudged', { unjudged: String(summary.unjudged) }))
        modelsAppendLine(container, t('models.measurementsUp', { up: String(summary.up) }))
        modelsAppendLine(container, t('models.measurementsDown', { down: String(summary.down) }))
        modelsAppendLine(container, t('models.measurementsAgree', { agree: String(summary.agree) }))
        modelsAppendLine(container, summary.agreementRate == null
          ? t('models.measurementsAgreementRateUnknown')
          : t('models.measurementsAgreementRate', { rate: String(Math.round(summary.agreementRate * 1000) / 10) }))
        modelsAppendLine(container, t('models.measurementsApplied', { applied: String(summary.applied) }))
      }

      // ---------- load ------------------------------------------------------

      function modelsLoad () {
        modelsRenderSeedNotice(null)
        modelsRenderMeasurements(null)
        modelsSetSeedNoticeDirtyVisible(false)
        return Promise.all([
          read(MODELS_KEY, false),
          read(MODELS_CONFIG_KEY, false),
          read(MODELS_SEED_NOTICE_KEY, false),
          read(MODEL_MEASUREMENTS_KEY, false)
        ]).then(function (results) {
          // A never-seeded or freshly-emptied catalog reads as [], same as
          // FRESH: every subagent call passes through unchanged, which
          // modelsRenderLadder's own empty-state hint says in words.
          modelsLadder = modelsSplitLadder(modelsParseCatalog(results[0]))
          modelsDirty = false
          modelsRenderLadder()
          el('models-active').checked = !!(results[1] && results[1].active === true)
          modelsRenderSeedNotice(results[2])
          modelsRenderMeasurements(results[3])
          modelsRenderActiveHint(results[3])
        }).catch(function (error) {
          said(el('models-ladder-said'), errorText(error), true)
        })
      }

      modelsLoad()
    </script>
  </body>
</html>
